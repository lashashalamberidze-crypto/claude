// ── auth ──
async function doLogin(){
  var e=document.getElementById('email').value.trim(), p=document.getElementById('pass').value, err=document.getElementById('loginErr');
  err.textContent='';
  var client=getSb(); if(!client){ err.textContent='ბიბლიოთეკა ვერ ჩაიტვირთა.'; return; }
  try{ var r=await client.auth.signInWithPassword({email:e,password:p});
    if(r.error){ err.textContent='❌ '+r.error.message; return; }
    uid=r.data.user.id; showApp(r.data.user.email);
  }catch(ex){ err.textContent='❌ '+(ex.message||ex); }
}
async function doLogout(){ try{ if(sb) await sb.auth.signOut(); }catch(e){} location.reload(); }

function updateNet(){ var b=document.getElementById('netbar'); if(!b)return; if(navigator.onLine){ b.className='on'; b.textContent='🌐 ონლაინ'; } else { b.className='off'; b.textContent='📴 ოფლაინ'; } }

async function showApp(email){
  document.getElementById('loginCard').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('whoami').textContent=email||'—';
  updateNet();
  window.addEventListener('online',updateNet);
  window.addEventListener('offline',updateNet);
  skRender();
}

// ══ AI proxy (mirrors index.html callClaudeAI) ══
const _AI_SB_PROXY = SB_URL + '/functions/v1/ai-proxy';
async function callClaudeAI(prompt, maxTokens) {
  maxTokens = maxTokens || 800;
  try {
    const r = await fetch(_AI_SB_PROXY, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + SB_KEY
      },
      body: JSON.stringify({ prompt: prompt, max_tokens: maxTokens })
    });
    if (!r.ok) throw new Error('proxy ' + r.status);
    const d = await r.json().catch(()=>({}));
    return d.text || d.answer || d.content?.[0]?.text || '';
  } catch(e) {
    const r2 = await fetch(SB_URL + '/functions/v1/agro-ai-advice', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + SB_KEY
      },
      body: JSON.stringify({ question: prompt, culture: '', category: 'general' })
    });
    if (!r2.ok) throw new Error('fallback ' + r2.status);
    const d2 = await r2.json().catch(()=>({}));
    return d2.answer || d2.text || '';
  }
}

function skRender(){
  const culture = document.getElementById('sk-culture')?.value||'';
  const type    = document.getElementById('sk-type')?.value||'';
  const search  = (document.getElementById('sk-search')?.value||'').toLowerCase();
  const grid    = document.getElementById('sk-grid');
  if(!grid) return;
  const filtered = SK_DATA.filter(d=>{
    if(culture && !d.cultures.some(c=>c.includes(culture)||culture.includes(c)||c==='ყველა'||c.includes('ყველა'))) return false;
    if(type && d.type!==type) return false;
    if(search && !d.name.toLowerCase().includes(search) && !d.note.toLowerCase().includes(search)) return false;
    return true;
  });
  const tC = {sasuki:'rgba(34,197,94,.12)',pesticidi:'rgba(239,68,68,.1)',fungicidi:'rgba(14,165,233,.1)',herbicidi:'rgba(245,158,11,.1)'};
  const tL = {sasuki:'🌱 სასუქი',pesticidi:'🐛 პესტ.',fungicidi:'🦠 ფუნგ.',herbicidi:'🌿 ჰერბ.'};
  grid.innerHTML = filtered.map(d=>`
    <div style="background:#fff;border:1px solid #dde8f5;border-radius:14px;padding:16px">
      <div style="display:inline-block;padding:3px 10px;border-radius:20px;font-size:.68rem;font-weight:600;background:${tC[d.type]||'#f7fafd'};margin-bottom:8px;color:#1e3a5f">${tL[d.type]||d.type}</div>
      <div style="font-size:.88rem;font-weight:600;color:#1e3a5f;margin-bottom:6px">${d.name}</div>
      <div style="font-size:.76rem;color:#4a6a8a;margin-bottom:3px">📐 <b>${d.dose}</b> &nbsp;📅 ${d.time}</div>
      <div style="font-size:.73rem;color:#4a6a8a;margin-bottom:6px;line-height:1.5">${d.note}</div>
      <div style="font-size:.68rem;color:#059669">🌿 ${d.cultures.join(', ')}</div>
    </div>`).join('') || '<div style="padding:24px;text-align:center;color:#4a6a8a">ვერ მ.</div>';
}
window.skRender = skRender;

async function skAskAI(){
  const q = document.getElementById('sk-ai-q')?.value?.trim();
  const c = document.getElementById('sk-ai-culture')?.value||'';
  if(!q){ alert('შეიყვანეთ კითხვა!'); return; }
  const res = document.getElementById('sk-ai-result');
  const btn = document.getElementById('sk-ai-btn');
  res.style.display='block'; res.textContent='🤖 მ...';
  if(btn){ btn.disabled=true; btn.textContent='⏳ ...'; }
  try{
    const _p = `შენ ხარ სასოფლო-სამეურნეო ქიმიის ექსპერტი საქართველოში. ${c?'კულტ.: '+c+'.':''} კითხვა: ${q}\n\nუპასუხე ქართულად, კონკრეტულად: პრეპარატის სახელი, დოზა, ვადა, სიხშირე. თუ მსგავსი ალტ. არსებობს — განახსენე. ბოლოს — უსაფრთხოების ზომები.`;
    res.textContent = await callClaudeAI(_p, 600);
  }catch(e){ res.textContent = '❌ კავშირის შეცდომა. სცადე ხელახლა.'; }
  finally{ if(btn){ btn.disabled=false; btn.textContent='🤖 AI პასუხი'; } }
}
