<style>
:root{
  --green:#0e3b32; --green-d:#0a2c25; --green-l:#17564a;
  --gold:#c9a96b; --gold-l:#e2caa0; --cream:#f2efe8; --ink:#13241f;
  --serif:"Noto Serif Georgian",Georgia,serif;
  --sans:"Noto Sans Georgian",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{min-height:100vh;min-height:100svh}
body{
  font-family:var(--sans);background:var(--green);color:var(--cream);
  line-height:1.6;-webkit-font-smoothing:antialiased;
  padding:max(18px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right))
          max(26px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  display:flex;flex-direction:column;align-items:center;
  background-image:
    radial-gradient(circle at 18% 12%,rgba(23,86,74,.55),transparent 42%),
    radial-gradient(circle at 84% 86%,rgba(23,86,74,.45),transparent 46%);
  background-attachment:fixed;
}
/* ორნამენტის ფონი */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:url("pattern.png");background-size:50px 50px;background-repeat:repeat;opacity:.55}
.wrap{position:relative;z-index:1;width:100%;max-width:520px;display:flex;flex-direction:column;flex:1;justify-content:center}

/* ─── თავსართი ─── */
.head{text-align:center;padding:10px 0 4px}
.logo{display:block;width:min(252px,70%);height:auto;margin:2px auto 4px}
.rule{display:flex;align-items:center;justify-content:center;gap:11px;margin:12px 0 10px}
.rule i{display:block;width:52px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.rule i+i{background:linear-gradient(90deg,var(--gold),transparent)}
.rule b{width:6px;height:6px;border:1px solid var(--gold);transform:rotate(45deg);display:block}
h1{font-family:var(--serif);font-weight:800;font-size:clamp(1.9rem,8.5vw,2.6rem);
  color:var(--gold);letter-spacing:-.01em;line-height:1.1}
.meta{font-size:.78rem;color:rgba(242,239,232,.62);margin-top:9px;line-height:1.75}
.meta b{color:var(--cream);font-weight:600}

/* ─── ძებნა ─── */
.card{background:rgba(242,239,232,.045);border:1px solid rgba(201,169,107,.26);
  border-radius:18px;padding:20px 17px;margin-top:20px;backdrop-filter:blur(2px)}
.lead{text-align:center;font-size:.86rem;color:rgba(242,239,232,.78);margin-bottom:14px;line-height:1.65}
.f{position:relative}
.f svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.5;pointer-events:none}
#q{width:100%;padding:15px 14px 15px 43px;font:600 1.02rem var(--sans);
  color:var(--ink);background:var(--cream);border:2px solid transparent;border-radius:13px;outline:0}
#q::placeholder{color:#8a9490;font-weight:400}
#q:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(201,169,107,.18)}
.hint{text-align:center;font-size:.71rem;color:rgba(242,239,232,.45);margin-top:9px}

/* ─── შედეგები ─── */
#res{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.g{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;
  background:rgba(242,239,232,.07);border:1px solid rgba(201,169,107,.22);
  border-radius:13px;padding:13px 14px;color:var(--cream);font:inherit;transition:.16s}
.g:hover,.g:active{background:rgba(201,169,107,.17);border-color:var(--gold)}
.g-n{flex:1;min-width:0;font-size:.95rem;font-weight:600}
.g-t{flex-shrink:0;font-family:var(--serif);font-weight:800;font-size:.86rem;color:var(--gold);
  background:rgba(201,169,107,.14);border:1px solid rgba(201,169,107,.3);
  border-radius:9px;padding:5px 11px;white-space:nowrap}
.g-a{flex-shrink:0;color:var(--gold);opacity:.6}
.msg{text-align:center;padding:22px 14px;font-size:.88rem;color:rgba(242,239,232,.7);line-height:1.75}
.msg b{display:block;color:var(--gold);font-family:var(--serif);font-size:1.02rem;margin-bottom:6px}

/* ─── მისალმება ─── */
#hi{position:fixed;inset:0;z-index:40;background:var(--green);display:none;
  flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:30px max(20px,env(safe-area-inset-left));overflow-y:auto;
  background-image:
    radial-gradient(circle at 50% 18%,rgba(201,169,107,.14),transparent 55%),
    radial-gradient(circle at 20% 90%,rgba(23,86,74,.6),transparent 50%)}
#hi.on{display:flex;animation:fade .45s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.hi-in{max-width:460px;width:100%}
.hi-w{font-family:var(--serif);font-size:clamp(1.15rem,5.4vw,1.5rem);color:var(--cream);
  opacity:0;animation:up .55s .1s ease forwards}
.hi-n{font-family:var(--serif);font-weight:800;font-size:clamp(1.6rem,7.4vw,2.2rem);
  color:var(--gold);margin-top:5px;line-height:1.22;opacity:0;animation:up .55s .25s ease forwards}
.hi-r{margin:22px auto 18px;width:120px;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  opacity:0;animation:fade .5s .45s ease forwards}
.hi-l{font-size:.76rem;letter-spacing:.24em;text-transform:uppercase;color:rgba(242,239,232,.6);
  opacity:0;animation:up .5s .55s ease forwards}
.hi-box{margin:12px auto 0;display:inline-flex;flex-direction:column;align-items:center;
  border:2px solid var(--gold);border-radius:22px;padding:16px 42px;min-width:200px;
  background:rgba(201,169,107,.07);opacity:0;transform:scale(.9);
  animation:pop .6s .68s cubic-bezier(.2,1.4,.4,1) forwards}
.hi-t{font-family:var(--serif);font-weight:800;font-size:clamp(4.4rem,22vw,6.4rem);
  color:var(--gold);line-height:.95;letter-spacing:-.03em}
.hi-s{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);opacity:.75;margin-top:2px}
.hi-f{margin-top:26px;font-size:.78rem;color:rgba(242,239,232,.55);line-height:1.8;
  opacity:0;animation:up .5s .95s ease forwards}
.hi-b{margin-top:22px;display:inline-flex;align-items:center;gap:8px;padding:12px 26px;
  border:1px solid rgba(201,169,107,.45);border-radius:12px;background:transparent;
  color:var(--gold);font:600 .84rem var(--sans);cursor:pointer;opacity:0;
  animation:up .5s 1.1s ease forwards;transition:background .16s}
.hi-b:hover{background:rgba(201,169,107,.14)}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}

@media(max-width:360px){.card{padding:17px 13px}}
</style></head><body>
<div class="bg"></div>

<div class="wrap">
  <div class="head">
    <img class="logo" src="logo.png" alt="საქართველოს ეკონომიკის განვითარების კორპორაცია">
    <div class="rule"><i></i><b></b><i></i></div>
    <h1>გალა ვახშამი</h1>
    <div class="meta">
      <b>20 ოქტომბერი</b> · <b>19:00 საათი</b><br>
      სასტუმრო „სტამბა", რუფტოპი · კოსტავას 14
    </div>
  </div>

  <div class="card">
    <div class="lead">იპოვეთ თქვენი მაგიდა —<br>აკრიფეთ სახელი ან გვარი</div>
    <div class="f">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#13241f" stroke-width="2.2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
      </svg>
      <input id="q" type="search" autocomplete="off" autocorrect="off" spellcheck="false"
             enterkeyhint="search" placeholder="სახელი და გვარი">
    </div>
    <div id="res"></div>
  </div>

</div>

<div id="hi"><div class="hi-in">
  <div class="hi-w">კეთილი იყოს თქვენი მობრძანება</div>
  <div class="hi-n" id="hiN"></div>
  <div class="hi-r"></div>
  <div class="hi-l">თქვენი მაგიდა</div>
  <div class="hi-box"><div class="hi-t" id="hiT"></div><div class="hi-s">მაგიდა</div></div>
  <div class="hi-f">გისურვებთ სასიამოვნო საღამოს!</div>
  <button class="hi-b" id="hiB">← სხვა სტუმრის ძებნა</button>
</div></div>

<script>
var G = [["ცირა მესხია",1],["ნინო ბენდელიანი",1],["სალომე ჯალაღონია",1],["ბექა კაცაძე",1],["მარიამ სალდაძე",1],["თეონა ხუციშვილი",1],["მარიანა გამიხარდაშვილი",1],["ოთარ ხუციშვილი",1],["სესილი ტაბატაძე",1],["ირინე გიორგიძე",1],["ირაკლი გაბრიაძე",2],["გიორგი ნასარაია",2],["მარიამ ქვრივიშვილი",2],["ირაკლი ნადარეიშვილი",2],["გენადი არველაძე",2],["ინგა ფხალაძე",2],["ვახტანგ ცინცაძე",2],["ნინო ენუქიძე",2],["თამარ იოსელიანი",2],["გია კაკაურიძე",2],["ბაჩო რუსიშვილი",3],["თამარ ქარჩხაძე",3],["ლევან დარსალია",3],["ავთანდილ კასრაძე",3],["მაია ომიაძე",3],["ნინო მურჯიკნელი",3],["გიორგი გურგენიძე",3],["გიორგი აბაშიშვილი",3],["თორნიკე ზირაქიშვილი",3],["თამთა თამაზაშვილი",4],["გვანცა პაპავაძე",4],["თათია ბიძინაშვილი",4],["გვანცა ზაქარეიშვილი",4],["თამარ თვალავაძე",4],["ნათია ბერუაშვილი",4],["ირინა მგალობლიშვილი",4],["ანა მაჭავარიანი",4],["მაკა ბურჯანაძე",4],["ნათია წიკლაური",4],["ზურაბ დაბრუნდაშვილი",5],["ჯარჯი აბუაშვილი",5],["ზაქარია დეკანოსიძე",5],["ირაკლი ვეშაგური",5],["მაია კოჭლამაზაშვილი",5],["ნათია ბახუტაშვილი",5],["ნონა ხურცია",5],["თეა მაჭავარიანი",5],["სოფიო სამადაშვილი",5],["ელენე მინდაძე",6],["თინათინ ხულორდავა",6],["ირინე კილაძე",6],["გუგულა ცუხიშვილი",6],["ქეთევან მურადაშვილი",6],["ლანა იჩუაიძე",6],["ნანა გუნცაძე",6],["ანა უგულავა",6],["მარიამ ჯავახიშვილი",6],["ნინო მაზიაშვილი",6],["ჯემალ ჭელიძე",7],["ტარიელ ლაფერაშვილი",7],["ელა შეწირული",7],["ნია კაპანაძე",7],["სალომე საბანაძე",7],["დიანა აბულაძე",7],["ეკატერინე კოდუა",7],["დავით ბითაძე",7],["ნინო შეწირული",7],["სოფიო ბაქრაძე",8],["გიორგი მიხელიძე",8],["მარიამ ნოზაძე",8],["თამარ მელიქიშვილი",8],["ქეთევან ჩუხუა",8],["თამარ პატაშური",8],["დავით კაპანაძე",8],["გურანდა მაისურაძე",8],["ანა გოგუაძე",8],["თამარ პატარკაციშვილი",8],["სალომე იანვარაშვილი",9],["ქეთევან მიქაძე",9],["ლანა კბილაშვილი",9],["ნინო ჭილაია",9],["მერი შავაძე",9],["მარიამ ზაზაძე",9],["სალომე სუდაძე",9],["გიორგი მგალობლიშვილი",9],["ვასილ ბერიძე",9],["ნეკო ბეგიაშვილი",9],["დავით მამარდაშვილი",10],["ბესიკ ტრაპაიძე",10],["ლანა შენგელია",10],["საბა ლუტიძე",10],["ეკატერინე ბალისევიჩი",10],["დავით მელიქიძე",10],["დავით ბოკერია",10],["მირიან სუხიტაშვილი",10],["შოთა მაისურაძე",10],["გიორგი ხვედელიძე",10],["ნინო ორკოშნელი",11],["მარიამ ქუმარიტაშვილი",11],["სალომე ღაჭავა",11],["თამარ ჭარხალაშვილი",11],["ნათია ქიმუცაძე",11],["ელისო ცაგარეიშვილი",11],["ლონდა არველაძე",11],["თინათინ გოგატიშვილი",11],["თამარ ლომინაძე",11],["ოთარ გოგუა",12],["ივანე ვერძეული",12],["მარლენ ანთია",12],["დავით ხაბეიშვილი",12],["ოთარ კასრაძე",12],["ლელა ღვინაძე",12],["ნანა ცუხიშვილი",12],["ქეთევან ფერაძე",12],["ლილიანა ნიშნიანიძე",12],["ლაშა ბოსტაშვილი",12]];

/* ქართული → ლათინური, ძებნისთვის */
var MAP = {'ა':'a','ბ':'b','გ':'g','დ':'d','ე':'e','ვ':'v','ზ':'z','თ':'t','ი':'i','კ':'k',
'ლ':'l','მ':'m','ნ':'n','ო':'o','პ':'p','ჟ':'j','რ':'r','ს':'s','ტ':'t','უ':'u','ფ':'p',
'ქ':'k','ღ':'g','ყ':'k','შ':'s','ჩ':'c','ც':'c','ძ':'d','წ':'c','ჭ':'c','ხ':'x','ჯ':'j','ჰ':'h'};
function lat(s){ var o=''; for(var i=0;i<s.length;i++){ var c=s[i]; o += (MAP[c]!==undefined?MAP[c]:c); } return o; }
function norm(s){ return String(s||'').toLowerCase().replace(/[^Ⴀ-ჿa-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); }
/* ლათინური ვარიანტების გაერთიანება: th→t, kh→x, ch→c, sh→s, ts→c, dz→d, gh→g, zh→j, ph→p */
function latNorm(s){
  return norm(s).replace(/th/g,'t').replace(/kh/g,'x').replace(/sh/g,'s').replace(/ch/g,'c')
    .replace(/ts/g,'c').replace(/dz/g,'d').replace(/gh/g,'g').replace(/zh/g,'j').replace(/ph/g,'p')
    .replace(/w/g,'v').replace(/q/g,'k').replace(/y/g,'i').replace(/x/g,'x');
}
var IDX = G.map(function(g){
  var n = norm(g[0]);
  return { name:g[0], t:g[1], n:n, l:latNorm(lat(n)), w:n.split(' '), lw:latNorm(lat(n)).split(' ') };
});

var q=document.getElementById('q'), res=document.getElementById('res'),
    hi=document.getElementById('hi'), hiN=document.getElementById('hiN'), hiT=document.getElementById('hiT');

function search(raw){
  var s=norm(raw); if(s.length<2) return null;
  var ls=latNorm(lat(s)), terms=s.split(' '), lt=ls.split(' ');
  var out=[];
  for(var i=0;i<IDX.length;i++){
    var g=IDX[i], sc=0;
    var allG = terms.every(function(t){ return g.w.some(function(w){ return w.indexOf(t)===0; }); });
    var allL = lt.every(function(t){ return g.lw.some(function(w){ return w.indexOf(t)===0; }); });
    if(allG) sc=3; else if(allL) sc=2;
    else if(g.n.indexOf(s)>=0) sc=2;
    else if(g.l.indexOf(ls)>=0) sc=1;
    if(sc) out.push({g:g,sc:sc});
  }
  out.sort(function(a,b){ return b.sc-a.sc || a.g.name.localeCompare(b.g.name,'ka'); });
  return out.slice(0,40).map(function(x){ return x.g; });
}

function render(){
  var v=q.value;
  if(norm(v).length<2){ res.innerHTML=''; return; }
  var r=search(v);
  if(!r || !r.length){
    res.innerHTML='<div class="msg"><b>ვერ მოიძებნა</b>სცადეთ მხოლოდ გვარი, ან მიმართეთ ორგანიზატორს</div>';
    return;
  }
  res.innerHTML = r.map(function(g,i){
    return '<button class="g" data-i="'+i+'"><span class="g-n">'+esc(g.name)+'</span>'+
      '<span class="g-a">→</span></button>';
  }).join('');
  var btns=res.querySelectorAll('.g');
  for(var i=0;i<btns.length;i++){
    (function(b,g){ b.onclick=function(){ welcome(g); }; })(btns[i], r[i]);
  }
}
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function welcome(g){
  hiN.textContent=g.name; hiT.textContent=g.t;
  hi.classList.add('on');
  if(navigator.vibrate) try{ navigator.vibrate(30); }catch(e){}
  document.body.style.overflow='hidden';
  try{ location.hash='t'+g.t; }catch(e){}
}
document.getElementById('hiB').onclick=function(){
  hi.classList.remove('on'); document.body.style.overflow='';
  q.value=''; res.innerHTML=''; q.focus();
  try{ history.replaceState(null,'',location.pathname); }catch(e){}
};

q.addEventListener('input',render);
q.addEventListener('keydown',function(e){
  if(e.key==='Enter'){ e.preventDefault(); var b=res.querySelector('.g'); if(b) b.click(); q.blur(); }
});
if(!/Mobi|Android|iPhone/i.test(navigator.userAgent)) setTimeout(function(){ q.focus(); },400);
</script>
