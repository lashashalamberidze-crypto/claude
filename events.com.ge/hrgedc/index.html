<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HR დაფა — საქართველოს ეკონომიკის განვითარების კორპორაცია</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Georgian:wght@600;700;800&family=Noto+Sans+Georgian:wght@300;400;500;600;700&display=swap">
<style>
/* ტელევიზორისთვის: ეკრანი იხატება 1920×1080-ზე და ავტომატურად ზომდება */
:root{--green:#0e3b32;--green-d:#0a2c25;--green-l:#17564a;--gold:#c9a96b;--gold-l:#e2caa0;--cream:#f2efe8;
  --serif:"Noto Serif Georgian",Georgia,serif;--sans:"Noto Sans Georgian",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--green-d)}
body{font-family:var(--sans);color:var(--cream);-webkit-font-smoothing:antialiased;cursor:none}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;
  background:var(--green);
  background-image:radial-gradient(circle at 15% 10%,rgba(23,86,74,.8),transparent 45%),
    radial-gradient(circle at 85% 90%,rgba(23,86,74,.7),transparent 50%),
    radial-gradient(circle at 60% 40%,rgba(201,169,107,.07),transparent 45%);
  overflow:hidden}
.orn{position:absolute;inset:0;background:url("pattern.png") repeat;background-size:64px 64px;opacity:.35;
  animation:pan 120s linear infinite}
@keyframes pan{to{background-position:640px 640px}}
.glowA,.glowB{position:absolute;border-radius:50%;filter:blur(80px);opacity:.35}
.glowA{width:700px;height:700px;background:#1f7a66;left:-200px;bottom:-250px;animation:float 18s ease-in-out infinite alternate}
.glowB{width:600px;height:600px;background:#8a6f3c;right:-200px;top:-260px;opacity:.25;animation:float 22s ease-in-out infinite alternate-reverse}
@keyframes float{to{transform:translate(120px,-80px) scale(1.1)}}

.wrap{position:relative;z-index:1;height:100%;display:grid;grid-template-rows:150px 1fr 74px;padding:34px 48px 0}

/* თავსართი */
.top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:40px}
.logo{height:118px;width:auto;display:block}
.welcome{text-align:center}
.welcome .k{font-size:18px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);opacity:.85}
.welcome .t{font-family:var(--serif);font-weight:800;font-size:44px;color:var(--cream);margin-top:6px;line-height:1.2}
.clock{text-align:right}
.time{font-family:var(--serif);font-weight:800;font-size:96px;line-height:1;color:var(--gold);letter-spacing:-2px;font-variant-numeric:tabular-nums}
.time .sec{font-size:44px;opacity:.65;margin-left:6px}
.colon{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:.25}}
.date{font-size:24px;margin-top:8px;color:var(--cream);opacity:.9}

/* ბადე */
.main{display:grid;grid-template-columns:500px 1fr 500px;gap:28px;padding:22px 0 24px;min-height:0}
.col{display:flex;flex-direction:column;gap:28px;min-height:0}
.panel{position:relative;background:rgba(10,44,37,.62);border:1px solid rgba(201,169,107,.28);border-radius:28px;
  padding:22px 28px;backdrop-filter:blur(6px);overflow:hidden;min-height:0;
  opacity:0;transform:translateY(24px);animation:in .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes in{to{opacity:1;transform:none}}
.panel h2{display:flex;align-items:center;gap:14px;font-family:var(--serif);font-weight:700;font-size:28px;color:var(--gold)}
.panel h2 .ic{font-size:30px}
.panel h2 .sub{margin-left:auto;font-family:var(--sans);font-weight:500;font-size:18px;color:var(--cream);opacity:.6}
.rule{height:1px;margin:14px 0 16px;background:linear-gradient(90deg,var(--gold),transparent)}

/* დაბადების დღეები */
.bday{flex:1}
.bd-list{display:flex;flex-direction:column;gap:16px}
.bd{display:flex;align-items:center;gap:20px;padding:16px 18px;border-radius:20px;
  background:linear-gradient(90deg,rgba(201,169,107,.16),rgba(201,169,107,.03));border:1px solid rgba(201,169,107,.3);
  opacity:0;animation:in .7s ease forwards}
.av{flex:none;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:800;
  font-size:32px;color:var(--green);background:linear-gradient(135deg,var(--gold-l),var(--gold));box-shadow:0 0 0 4px rgba(201,169,107,.25);
  position:relative}
.av::after{content:"🎂";position:absolute;right:-8px;bottom:-6px;font-size:30px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-8deg)}}
.bd .n{font-family:var(--serif);font-weight:700;font-size:28px;line-height:1.25}
.bd .r{font-size:19px;opacity:.7;margin-top:2px}
.wish{margin-top:20px;text-align:center;font-family:var(--serif);font-size:26px;color:var(--gold-l)}
.confetti{position:absolute;inset:0;pointer-events:none;opacity:.45}
.bday h2,.bday .rule,.bd-list,.wish,.upcoming-bd{position:relative;z-index:1}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;opacity:.85;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(760px) rotate(540deg)}}
.upcoming-bd{margin-top:18px;font-size:19px;opacity:.75;line-height:1.7}
.upcoming-bd b{color:var(--gold-l);font-weight:600}

/* შეხვედრები */
.meet{flex:1}
.tl{position:relative;display:flex;flex-direction:column;gap:12px}
.m{display:grid;grid-template-columns:110px minmax(0,1fr) auto;align-items:center;gap:20px;padding:13px 20px;border-radius:18px;
  background:rgba(242,239,232,.04);border:1px solid rgba(242,239,232,.08);transition:all .6s;opacity:0;animation:in .7s ease forwards}
.m .h{font-family:var(--serif);font-weight:700;font-size:28px;color:var(--gold);font-variant-numeric:tabular-nums}
.m .h small{display:block;font-family:var(--sans);font-weight:400;font-size:16px;color:var(--cream);opacity:.55}
.m .ti{font-size:24px;font-weight:600;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m .ro{font-size:17px;opacity:.6;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m .st{font-size:16px;font-weight:700;letter-spacing:.06em;padding:8px 14px;border-radius:999px;white-space:nowrap}
.m.done{opacity:.38!important}
.m.done .st{background:rgba(242,239,232,.08);color:var(--cream)}
.m.now{background:linear-gradient(90deg,rgba(201,169,107,.24),rgba(201,169,107,.06));border-color:var(--gold);
  box-shadow:0 0 0 1px var(--gold),0 12px 40px -12px rgba(201,169,107,.6)}
.m.now .st{background:var(--gold);color:var(--green);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(201,169,107,0)}0%{box-shadow:0 0 0 0 rgba(201,169,107,.6)}}
.m.next .st{background:rgba(201,169,107,.18);color:var(--gold-l);border:1px solid rgba(201,169,107,.5)}
.m.later .st{background:transparent;color:var(--cream);opacity:.55;border:1px solid rgba(242,239,232,.18)}

/* ამინდი */
.wx-now{display:flex;align-items:center;gap:22px}
.wx-ic{font-size:84px;line-height:1;filter:drop-shadow(0 8px 20px rgba(0,0,0,.3));animation:bob 5s ease-in-out infinite}
.wx-t{font-family:var(--serif);font-weight:800;font-size:76px;line-height:1;color:var(--cream)}
.wx-d{font-size:22px;opacity:.8;margin-top:4px}
.wx-meta{font-size:18px;opacity:.6;margin-top:4px}
.wx-days{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:16px}
.wd{text-align:center;padding:12px 4px;border-radius:16px;background:rgba(242,239,232,.05);border:1px solid rgba(242,239,232,.08)}
.wd .dn{font-size:17px;opacity:.7}
.wd .di{font-size:38px;margin:4px 0}
.wd .dt{font-size:19px;font-weight:600}
.wd .dt span{opacity:.5;font-weight:400}

/* ღონისძიებები */
.ev{flex:1}
.ev-list{display:flex;flex-direction:column;gap:12px}
.e{display:flex;align-items:center;gap:20px;opacity:0;animation:in .7s ease forwards}
.cal{flex:none;width:70px;border-radius:14px;overflow:hidden;text-align:center;background:var(--cream);color:var(--green);
  box-shadow:0 8px 20px -8px rgba(0,0,0,.5)}
.cal .mo{background:var(--gold);color:var(--green);font-size:14px;font-weight:700;letter-spacing:.1em;padding:3px 0}
.cal .dd{font-family:var(--serif);font-weight:800;font-size:30px;line-height:1.15;padding:1px 0 3px}
.e .et{font-size:21px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.e>div:nth-child(2){min-width:0}
.e .em{font-size:17px;opacity:.6;margin-top:2px}
.e .cd{margin-left:auto;font-size:16px;font-weight:700;color:var(--gold-l);white-space:nowrap}

/* ქვედა ზოლი */
.bottom{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:28px;border-top:1px solid rgba(201,169,107,.35);
  background:rgba(10,44,37,.75);margin:0 -48px;padding:0 48px}
.tag{font-size:18px;font-weight:700;letter-spacing:.2em;color:var(--green);background:var(--gold);padding:8px 16px;border-radius:10px;white-space:nowrap}
.ticker{overflow:hidden;white-space:nowrap;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.ticker span{display:inline-block;padding-left:100%;font-size:24px;animation:tick 45s linear infinite}
.ticker em{font-style:normal;color:var(--gold);margin:0 26px}
@keyframes tick{to{transform:translateX(-100%)}}
.hr{font-family:var(--serif);font-weight:700;font-size:26px;color:var(--gold);letter-spacing:.06em;white-space:nowrap}
.hr small{font-family:var(--sans);font-weight:400;font-size:16px;color:var(--cream);opacity:.55;margin-left:10px;letter-spacing:0}
</style>
</head>
<body>
<div id="stage">
  <div class="orn"></div><div class="glowA"></div><div class="glowB"></div>
  <div class="wrap">
    <header class="top">
      <img class="logo" src="logo.png" alt="საქართველოს ეკონომიკის განვითარების კორპორაცია">
      <div class="welcome"><div class="k" id="greet">დილა მშვიდობისა</div><div class="t">კარგი დღე გისურვებთ, გუნდო!</div></div>
      <div class="clock"><div class="time" id="time">--:--</div><div class="date" id="date"></div></div>
    </header>

    <div class="main">
      <div class="col">
        <section class="panel bday" style="animation-delay:.1s">
          <div class="confetti" id="confetti"></div>
          <h2><span class="ic">🎉</span>დღეს დაბადების დღეა</h2>
          <div class="rule"></div>
          <div class="bd-list" id="bdays"></div>
          <div class="wish">გილოცავთ! ბედნიერებას და წარმატებებს გისურვებთ</div>
          <div class="upcoming-bd" id="bdNext"></div>
        </section>
      </div>

      <div class="col">
        <section class="panel meet" style="animation-delay:.25s">
          <h2><span class="ic">📅</span>დღევანდელი შეხვედრები<span class="sub" id="meetSub"></span></h2>
          <div class="rule"></div>
          <div class="tl" id="meetings"></div>
        </section>
      </div>

      <div class="col">
        <section class="panel" style="animation-delay:.4s">
          <h2><span class="ic">🌤️</span>ამინდი · თბილისი</h2>
          <div class="rule"></div>
          <div class="wx-now"><div class="wx-ic" id="wxIc">⛅</div>
            <div><div class="wx-t" id="wxT">--°</div><div class="wx-d" id="wxD"></div><div class="wx-meta" id="wxM"></div></div></div>
          <div class="wx-days" id="wxDays"></div>
        </section>
        <section class="panel ev" style="animation-delay:.55s">
          <h2><span class="ic">✨</span>მომავალი ღონისძიებები</h2>
          <div class="rule"></div>
          <div class="ev-list" id="events"></div>
        </section>
      </div>
    </div>

    <footer class="bottom">
      <div class="tag">სიახლეები</div>
      <div class="ticker"><span id="ticker"></span></div>
      <div class="hr">HR სამსახური</div>
    </footer>
  </div>
</div>

<script>
/* ═══ სადემონსტრაციო მონაცემები — რეალური ინტეგრაციისას აქ შეიცვლება ═══ */
var BIRTHDAYS = [
  { name: "ნინო ბერიძე",     role: "ფინანსური დეპარტამენტი", offset: 0 },
  { name: "გიორგი კაპანაძე",  role: "IT სამსახური",            offset: 0 },
  { name: "ანა ლომიძე",       role: "მარკეტინგი",              offset: 0 },
  { name: "დავით მაისურაძე",  role: "იურიდიული დეპარტამენტი",  offset: 2 },
  { name: "მარიამ ჯაფარიძე",  role: "HR სამსახური",            offset: 5 }
];
var MEETINGS = [
  { from: "09:30", to: "10:00", title: "დილის სტენდაპი",             room: "საკონფერენციო დარბაზი A" },
  { from: "11:00", to: "12:00", title: "ბიუჯეტის განხილვა — Q4",      room: "დირექტორის კაბინეტი" },
  { from: "13:00", to: "14:00", title: "ახალბედების ორიენტაცია", room: "სასწავლო ოთახი" },
  { from: "15:00", to: "16:00", title: "პარტნიორებთან შეხვედრა",       room: "საკონფერენციო დარბაზი B" },
  { from: "16:30", to: "17:30", title: "პროექტების სტატუსი",          room: "Online · Zoom" },
  { from: "17:45", to: "18:15", title: "გასაუბრება — ვაკანსია",        room: "HR ოთახი" }
];
var EVENTS = [
  { title: "ლიდერობის ტრენინგი",           place: "სასწავლო ცენტრი · 10:00",    offset: 3 },
  { title: "გალა ვახშამი",                 place: "სასტუმრო „სტამბა“ · 19:00", offset: 8 },
  { title: "საახალწლო წვეულება",           place: "მთავარი ოფისი · 18:00",      offset: 45 },
  { title: "სპორტული დღე",                 place: "ვაკის პარკი · 11:00",        offset: 21 }
];
var NEWS = [
  "კეთილი იყოს თქვენი მობრძანება ახალ თანამშრომლებს — ლევან გელაშვილი (IT) და სოფო ქავთარაძე (მარკეტინგი)",
  "შიდა ვაკანსია: პროექტის მენეჯერი — განაცხადები HR სამსახურში 30 ოქტომბრამდე",
  "პარასკევს 16:00-ზე — ყავის შესვენება მეოთხე სართულზე ☕",
  "გაიარეთ თანამშრომელთა კმაყოფილების კვლევა — ბმული თქვენს ელფოსტაზე"
];

/* ═══ ეკრანის ზომაზე მორგება ═══ */
var stage = document.getElementById("stage");
function fit(){ var s = Math.min(innerWidth/1920, innerHeight/1080); stage.style.transform = "translate(-50%,-50%) scale(" + s + ")"; }
addEventListener("resize", fit); fit();

var WD = ["კვირა","ორშაბათი","სამშაბათი","ოთხშაბათი","ხუთშაბათი","პარასკევი","შაბათი"];
var WDS = ["კვი","ორშ","სამ","ოთხ","ხუთ","პარ","შაბ"];
var MO = ["იანვარი","თებერვალი","მარტი","აპრილი","მაისი","ივნისი","ივლისი","აგვისტო","სექტემბერი","ოქტომბერი","ნოემბერი","დეკემბერი"];
function pad(n){ return (n<10?"0":"")+n; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function addDays(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return x; }
function mins(hm){ var p=hm.split(":"); return +p[0]*60 + +p[1]; }

/* ═══ საათი და თარიღი ═══ */
function clock(){
  var d = new Date(), h = d.getHours();
  document.getElementById("time").innerHTML = pad(h)+'<span class="colon">:</span>'+pad(d.getMinutes())+'<span class="sec">'+pad(d.getSeconds())+'</span>';
  document.getElementById("date").textContent = WD[d.getDay()]+", "+d.getDate()+" "+MO[d.getMonth()]+" "+d.getFullYear();
  document.getElementById("greet").textContent = h<12 ? "დილა მშვიდობისა" : h<18 ? "შუადღე მშვიდობისა" : "საღამო მშვიდობისა";
}
setInterval(clock, 1000); clock();

/* ═══ დაბადების დღეები ═══ */
(function(){
  var today = BIRTHDAYS.filter(function(b){ return b.offset===0; }), next = BIRTHDAYS.filter(function(b){ return b.offset>0; });
  document.getElementById("bdays").innerHTML = today.map(function(b,i){
    var ini = b.name.split(" ").map(function(w){ return w[0]; }).join("");
    return '<div class="bd" style="animation-delay:'+(.5+i*.18)+'s"><div class="av">'+esc(ini)+'</div><div><div class="n">'+esc(b.name)+'</div><div class="r">'+esc(b.role)+'</div></div></div>';
  }).join("");
  document.getElementById("bdNext").innerHTML = next.length ? "მალე: " + next.map(function(b){
    var d = addDays(new Date(), b.offset); return "<b>"+esc(b.name)+"</b> — "+d.getDate()+" "+MO[d.getMonth()];
  }).join(" · ") : "";
  var cf = document.getElementById("confetti"), cols = ["#c9a96b","#e2caa0","#f2efe8","#3fae8f","#e8b4b8"], h = "";
  for (var i=0;i<26;i++) h += '<i style="left:'+(Math.random()*100)+'%;background:'+cols[i%cols.length]+';animation-duration:'+(6+Math.random()*6)+'s;animation-delay:'+(-Math.random()*10)+'s"></i>';
  cf.innerHTML = h;
})();

/* ═══ შეხვედრები — სტატუსი რეალურ დროში ═══ */
function meetings(){
  var d = new Date(), now = d.getHours()*60 + d.getMinutes(), nextSet = false, html = "";
  MEETINGS.forEach(function(m,i){
    var a = mins(m.from), b = mins(m.to), cls, st;
    if (now >= b) { cls = "done"; st = "დასრულდა"; }
    else if (now >= a) { cls = "now"; st = "მიმდინარეობს"; }
    else if (!nextSet) { cls = "next"; nextSet = true; var left = a-now; st = left < 60 ? left+" წთ-ში" : "შემდეგი"; }
    else { cls = "later"; st = "მოგვიანებით"; }
    html += '<div class="m '+cls+'" style="animation-delay:'+(.6+i*.12)+'s"><div class="h">'+m.from+'<small>'+m.to+'-მდე</small></div>'+
      '<div><div class="ti">'+esc(m.title)+'</div><div class="ro">📍 '+esc(m.room)+'</div></div><div class="st">'+st+'</div></div>';
  });
  document.getElementById("meetings").innerHTML = html;
  document.getElementById("meetSub").textContent = MEETINGS.length + " შეხვედრა";
}
meetings(); setInterval(meetings, 30000);
// განმეორებითი ანიმაცია არ გვინდა ყოველ განახლებაზე
setTimeout(function(){ var st=document.createElement("style"); st.textContent=".m{animation:none!important;opacity:1}"; document.head.appendChild(st); }, 2500);

/* ═══ ღონისძიებები ═══ */
(function(){
  var MS = ["იან","თებ","მარ","აპრ","მაი","ივნ","ივლ","აგვ","სექ","ოქტ","ნოე","დეკ"];
  var list = EVENTS.slice().sort(function(a,b){ return a.offset-b.offset; }).slice(0,3);
  document.getElementById("events").innerHTML = list.map(function(e,i){
    var d = addDays(new Date(), e.offset), cd = e.offset===1 ? "ხვალ" : e.offset+" დღეში";
    return '<div class="e" style="animation-delay:'+(.8+i*.15)+'s"><div class="cal"><div class="mo">'+MS[d.getMonth()]+'</div><div class="dd">'+d.getDate()+'</div></div>'+
      '<div><div class="et">'+esc(e.title)+'</div><div class="em">'+esc(e.place)+'</div></div><div class="cd">'+cd+'</div></div>';
  }).join("");
})();

/* ═══ სიახლეების ზოლი ═══ */
document.getElementById("ticker").innerHTML = NEWS.map(esc).join('<em>◆</em>');

/* ═══ ამინდი — Open-Meteo (გასაღების გარეშე); ინტერნეტის გარეშე სადემო მონაცემები ═══ */
var WX = { 0:["☀️","მზიანი"],1:["🌤️","ძირითადად მზიანი"],2:["⛅","ნაწილობრივ ღრუბლიანი"],3:["☁️","ღრუბლიანი"],45:["🌫️","ნისლი"],48:["🌫️","ნისლი"],
  51:["🌦️","ჟინჟღლი"],53:["🌦️","ჟინჟღლი"],55:["🌦️","ჟინჟღლი"],61:["🌧️","მცირე წვიმა"],63:["🌧️","წვიმა"],65:["🌧️","ძლიერი წვიმა"],
  71:["🌨️","მცირე თოვლი"],73:["🌨️","თოვლი"],75:["❄️","ძლიერი თოვლი"],80:["🌦️","ხანმოკლე წვიმა"],81:["🌧️","ხანმოკლე წვიმა"],82:["⛈️","თავსხმა"],
  95:["⛈️","ჭექა-ქუხილი"],96:["⛈️","ჭექა-ქუხილი"],99:["⛈️","ჭექა-ქუხილი"] };
function wx(c){ return WX[c] || ["⛅",""]; }
function renderWx(cur, days){
  var w = wx(cur.code);
  document.getElementById("wxIc").textContent = w[0];
  document.getElementById("wxT").textContent = Math.round(cur.t) + "°";
  document.getElementById("wxD").textContent = w[1];
  document.getElementById("wxM").textContent = "ქარი " + Math.round(cur.wind) + " კმ/სთ · ტენიანობა " + Math.round(cur.hum) + "%";
  document.getElementById("wxDays").innerHTML = days.slice(0,5).map(function(d,i){
    return '<div class="wd"><div class="dn">'+(i===0?"დღეს":WDS[d.date.getDay()])+'</div><div class="di">'+wx(d.code)[0]+'</div><div class="dt">'+Math.round(d.max)+'° <span>'+Math.round(d.min)+'°</span></div></div>';
  }).join("");
}
function demoWx(){
  var codes=[2,1,3,61,0], mx=[17,19,15,13,18], mn=[8,9,7,6,8];
  renderWx({ t:15, code:2, wind:9, hum:58 }, codes.map(function(c,i){ return { date:addDays(new Date(),i), code:c, max:mx[i], min:mn[i] }; }));
}
function loadWx(){
  var url = "https://api.open-meteo.com/v1/forecast?latitude=41.7151&longitude=44.8271&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Asia%2FTbilisi&forecast_days=5";
  fetch(url).then(function(r){ return r.json(); }).then(function(j){
    var c = j.current, dl = j.daily;
    renderWx({ t:c.temperature_2m, code:c.weather_code, wind:c.wind_speed_10m, hum:c.relative_humidity_2m },
      dl.time.map(function(t,i){ return { date:new Date(t+"T12:00:00"), code:dl.weather_code[i], max:dl.temperature_2m_max[i], min:dl.temperature_2m_min[i] }; }));
  }).catch(function(){ if (document.getElementById("wxT").textContent === "--°") demoWx(); });
}
demoWx(); loadWx(); setInterval(loadWx, 30*60*1000);

// გვერდის თავიდან ჩატვირთვა ყოველ 6 საათში (ტელევიზორზე დღეების ცვლისთვის)
setTimeout(function(){ location.reload(); }, 6*3600*1000);
</script>
