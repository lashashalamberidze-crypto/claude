<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>events.com.ge — თქვენი ციფრული ევენთები ერთ სივრცეში</title>
<meta name="description" content="events.com.ge — თქვენი ციფრული ევენთები ერთ სივრცეში.">
<meta name="theme-color" content="#0a0618">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@300;500;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Noto Sans Georgian", system-ui, sans-serif;
    background: #0a0618; color: #fff; overflow: hidden;
    display: grid; place-items: center; min-height: 100svh;
  }

  /* ფონი — მოძრავი ფერადი ნათებები */
  .bg { position: fixed; inset: 0; overflow: hidden; z-index: 0; }
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .55; mix-blend-mode: screen; will-change: transform; }
  .b1 { width: 55vmax; height: 55vmax; background: #e11d48; left: -15vmax; top: -20vmax; animation: drift1 22s ease-in-out infinite alternate; }
  .b2 { width: 50vmax; height: 50vmax; background: #7c3aed; right: -15vmax; top: -10vmax; animation: drift2 26s ease-in-out infinite alternate; }
  .b3 { width: 45vmax; height: 45vmax; background: #2563eb; left: 10vmax; bottom: -25vmax; animation: drift3 30s ease-in-out infinite alternate; }
  .b4 { width: 30vmax; height: 30vmax; background: #f59e0b; right: 5vmax; bottom: -10vmax; opacity: .35; animation: drift1 34s ease-in-out infinite alternate-reverse; }
  @keyframes drift1 { to { transform: translate(18vw, 14vh) scale(1.15); } }
  @keyframes drift2 { to { transform: translate(-16vw, 20vh) scale(.9); } }
  @keyframes drift3 { to { transform: translate(14vw, -18vh) scale(1.1); } }

  /* ბადე და მარცვლოვანი ტექსტურა */
  .grid {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%);
  }
  .grain {
    position: fixed; inset: -50%; z-index: 2; pointer-events: none; opacity: .08;
    background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation: grain 1.2s steps(6) infinite;
  }
  @keyframes grain { 0%,100% { transform: translate(0,0); } 20% { transform: translate(-3%,2%); } 40% { transform: translate(2%,-3%); } 60% { transform: translate(-2%,-1%); } 80% { transform: translate(3%,3%); } }

  canvas#stars { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

  /* შინაარსი */
  main { position: relative; z-index: 3; text-align: center; padding: 24px 16px; max-width: 1000px; }
  .logo {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 10px 20px; border-radius: 999px;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    font-weight: 500; letter-spacing: .5px; font-size: 15px;
    opacity: 0; animation: rise 1s .2s cubic-bezier(.2,.7,.2,1) forwards;
  }
  .logo .dot { width: 8px; height: 8px; border-radius: 50%; background: #f43f5e; box-shadow: 0 0 0 0 rgba(244,63,94,.7); animation: pulse 2s infinite; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 12px rgba(244,63,94,0); } 100% { box-shadow: 0 0 0 0 rgba(244,63,94,0); } }

  h1 {
    margin-top: 32px;
    font-size: clamp(34px, 7.2vw, 88px); font-weight: 800; line-height: 1.3; letter-spacing: -1px; padding: 0 .1em .15em;
    background: linear-gradient(100deg, #fff 0%, #fbcfe8 30%, #c4b5fd 55%, #93c5fd 75%, #fff 100%);
    background-size: 220% auto;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: rise 1.2s .45s cubic-bezier(.2,.7,.2,1) both, shine 8s 1.6s linear infinite;
    text-shadow: 0 0 60px rgba(167,139,250,.15);
  }
  h1 .line { display: block; }
  @keyframes shine { to { background-position: -220% center; } }
  @keyframes rise { from { opacity: 0; transform: translateY(24px); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }

  .sep {
    width: 120px; height: 2px; margin: 36px auto 0; border-radius: 2px;
    background: linear-gradient(90deg, transparent, #f43f5e, #8b5cf6, transparent);
    opacity: 0; animation: rise 1s 1s forwards;
  }
  .domain { margin-top: 18px; font-weight: 300; font-size: 16px; letter-spacing: 4px; text-transform: lowercase; color: rgba(255,255,255,.6); opacity: 0; animation: rise 1s 1.2s forwards; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; opacity: 1 !important; }
  }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
  </div>
  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="grid" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <main>
    <div class="logo"><span class="dot"></span>events.com.ge</div>
    <h1><span class="line">თქვენი ციფრული ევენთები</span><span class="line">ერთ სივრცეში</span></h1>
    <div class="sep"></div>
    <p class="domain">events.com.ge</p>
  </main>

<script>
// ციმციმა ნაწილაკები ფონზე
(() => {
  const cv = document.getElementById("stars"), ctx = cv.getContext("2d");
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let w, h, dpr, pts = [];
  function size() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = cv.width = innerWidth * dpr; h = cv.height = innerHeight * dpr;
    cv.style.width = innerWidth + "px"; cv.style.height = innerHeight + "px";
    const n = Math.round(innerWidth * innerHeight / 9000);
    pts = Array.from({ length: n }, () => ({ x: Math.random() * w, y: Math.random() * h, r: (Math.random() * 1.4 + .3) * dpr, s: Math.random() * .25 + .05, p: Math.random() * Math.PI * 2 }));
  }
  function tick(t) {
    ctx.clearRect(0, 0, w, h);
    for (const p of pts) {
      p.y -= p.s * dpr; if (p.y < -5) { p.y = h + 5; p.x = Math.random() * w; }
      const a = .35 + .35 * Math.sin(t / 900 + p.p);
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  addEventListener("resize", size); size(); requestAnimationFrame(tick);
})();
</script>
</body>
</html>
