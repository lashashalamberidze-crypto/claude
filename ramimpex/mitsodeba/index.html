// ===== Helpers =====
const fmt = (n, dec = 2) => {
  if (n === null || n === undefined || isNaN(n)) return "0";
  return Number(n).toLocaleString("ka-GE", { minimumFractionDigits: dec, maximumFractionDigits: dec });
};
const fmtL = (n) => fmt(n, 2) + " ₾";
const fmtBytes = (b) => {
  if (!b) return "0 B";
  if (b < 1024) return b + " B";
  if (b < 1024*1024) return (b/1024).toFixed(1) + " KB";
  return (b/1024/1024).toFixed(2) + " MB";
};
const calcDeliveryItem = (it) => {
  const q = Number(it.qty) || 0, sp = Number(it.salePrice) || 0, cp = Number(it.costPrice) || 0;
  const rev = q*sp, cost = q*cp, profit = rev-cost;
  return { rev, cost, profit, margin: rev > 0 ? (profit/rev)*100 : 0 };
};
const calcDelivery = (d) => {
  const items = d.items || [];
  let rev = 0, cost = 0;
  for (const it of items) { const c = calcDeliveryItem(it); rev += c.rev; cost += c.cost; }
  return { rev, cost, profit: rev-cost, margin: rev > 0 ? ((rev-cost)/rev)*100 : 0, itemCount: items.length };
};
const calcTenderActuals = (deliveries) => {
  let rev = 0, cost = 0, paidRev = 0, unpaidRev = 0, paidCost = 0, unpaidCost = 0;
  for (const d of deliveries || []) {
    const c = calcDelivery(d);
    rev += c.rev; cost += c.cost;
    if (d.paid) paidRev += c.rev; else unpaidRev += c.rev;
    if (d.supplierPaid) paidCost += c.cost; else unpaidCost += c.cost;
  }
  return { rev, cost, profit: rev-cost, margin: rev > 0 ? ((rev-cost)/rev)*100 : 0,
           deliveryCount: (deliveries||[]).length, paidRev, unpaidRev, paidCost, unpaidCost };
};
const calcTenderPlanned = (t) => {
  const items = t.items || [];
  let plannedRev = 0;
  for (const it of items) plannedRev += (Number(it.qty) || 0) * (Number(it.salePrice) || 0);
  return { plannedRev, itemCount: items.length };
};
// Returns array: [{ name, unit, plannedQty, deliveredQty, remainingQty, progress, salePrice }]
const calcProductProgress = (tender) => {
  const result = {};
  for (const item of tender.items || []) {
    const key = (item.name || "").trim().toLowerCase();
    if (!key) continue;
    if (!result[key]) result[key] = {
      name: item.name, unit: item.unit || "კგ",
      plannedQty: 0, deliveredQty: 0, salePrice: Number(item.salePrice) || 0,
    };
    result[key].plannedQty += Number(item.qty) || 0;
  }
  for (const d of tender.deliveries || []) {
    for (const di of d.items || []) {
      const key = (di.name || "").trim().toLowerCase();
      if (!key) continue;
      if (!result[key]) result[key] = {
        name: di.name, unit: di.unit || "კგ",
        plannedQty: 0, deliveredQty: 0, salePrice: Number(di.salePrice) || 0, orphan: true,
      };
      result[key].deliveredQty += Number(di.qty) || 0;
    }
  }
  return Object.values(result).map(r => ({
    ...r,
    remainingQty: r.plannedQty - r.deliveredQty,
    progress: r.plannedQty > 0 ? Math.min(100, (r.deliveredQty / r.plannedQty) * 100) : 0,
  }));
};
const calcTenderTotalQty = (tender) => {
  const rows = calcProductProgress(tender);
  let plannedQty = 0, deliveredQty = 0;
  for (const r of rows) { plannedQty += r.plannedQty; deliveredQty += r.deliveredQty; }
  return { plannedQty, deliveredQty, remainingQty: plannedQty - deliveredQty, rows };
};
const formatDate = (iso) => {
  if (!iso) return "";
  try { const d = new Date(iso); if (isNaN(d.getTime())) return ""; return d.toLocaleDateString("ka-GE", { year: "numeric", month: "short", day: "numeric" }); } catch { return ""; }
};
const newId = (p="id") => `${p}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,7)}`;

// ===== Mappers =====
const tenderDbToUi = (row) => ({
  id: row.id, name: row.name, code: row.code, date: row.date, address: row.address, notes: row.notes,
  tenderAmount: Number(row.tender_amount) || 0, bidPrice: Number(row.bid_price) || 0, bidStep: Number(row.bid_step) || 0,
  items: row.items || [], deliveries: row.deliveries || [], files: row.files || [],
  createdAt: row.created_at, updatedAt: row.updated_at, updatedBy: row.updated_by,
});
const tenderUiToDb = (t, email) => ({
  name: t.name, code: t.code, date: t.date, address: t.address, notes: t.notes,
  tender_amount: t.tenderAmount, bid_price: t.bidPrice, bid_step: t.bidStep,
  items: t.items || [], updated_by: email || null,
});
const deliveryDbToUi = (row) => ({
  id: row.id, tenderId: row.tender_id, deliveredAt: row.delivered_at, notes: row.notes,
  items: row.items || [], files: row.files || [],
  paid: !!row.paid, paidAt: row.paid_at ? row.paid_at.slice(0, 10) : null,
  supplierPaid: !!row.supplier_paid, supplierPaidAt: row.supplier_paid_at ? row.supplier_paid_at.slice(0, 10) : null,
  createdAt: row.created_at, updatedAt: row.updated_at, updatedBy: row.updated_by,
});
const deliveryUiToDb = (d, email) => ({
  tender_id: d.tenderId, delivered_at: d.deliveredAt, notes: d.notes,
  items: d.items || [], paid: !!d.paid, paid_at: d.paidAt || null,
  supplier_paid: !!d.supplierPaid, supplier_paid_at: d.supplierPaidAt || null,
  updated_by: email || null,
});

// ===== API =====
const api = {
  sb: () => window.supabase,
  signIn: async (email, password) => { const { data, error } = await api.sb().auth.signInWithPassword({ email, password }); if (error) throw error; return data; },
  signOut: async () => { await api.sb().auth.signOut(); },
  getSession: async () => { const { data } = await api.sb().auth.getSession(); return data.session; },
  onAuthChange: (cb) => api.sb().auth.onAuthStateChange(cb),

  async loadAll() {
    const sb = api.sb();
    const [tendersRes, deliveriesRes, filesRes] = await Promise.all([
      sb.from("tenders").select("*").order("updated_at", { ascending: false }),
      sb.from("deliveries").select("*").order("delivered_at", { ascending: false }),
      sb.from("files").select("*").order("uploaded_at", { ascending: false }),
    ]);
    if (tendersRes.error) throw tendersRes.error;
    if (deliveriesRes.error) throw deliveriesRes.error;
    if (filesRes.error) throw filesRes.error;
    const tenderFiles = {}, deliveryFiles = {};
    for (const f of filesRes.data || []) {
      const fo = { id: f.id, name: f.name, type: f.mime_type, size: f.size_bytes, path: f.storage_path, kind: f.kind, uploadedAt: f.uploaded_at, uploadedBy: f.uploaded_by };
      if (f.delivery_id) (deliveryFiles[f.delivery_id] ||= []).push(fo);
      else if (f.tender_id) (tenderFiles[f.tender_id] ||= []).push(fo);
    }
    const dByT = {};
    for (const d of deliveriesRes.data || []) (dByT[d.tender_id] ||= []).push(deliveryDbToUi({ ...d, files: deliveryFiles[d.id] || [] }));
    return (tendersRes.data || []).map((row) => tenderDbToUi({ ...row, deliveries: dByT[row.id] || [], files: tenderFiles[row.id] || [] }));
  },

  async createTender(t, email) {
    const { data, error } = await api.sb().from("tenders").insert(tenderUiToDb(t, email)).select().single();
    if (error) throw error;
    return tenderDbToUi({ ...data, deliveries: [], files: [] });
  },
  async updateTender(id, t, email) {
    const { data, error } = await api.sb().from("tenders").update(tenderUiToDb(t, email)).eq("id", id).select().single();
    if (error) throw error;
    return tenderDbToUi({ ...data, deliveries: t.deliveries || [], files: t.files || [] });
  },
  async deleteTender(id) {
    const sb = api.sb();
    const { data: files } = await sb.from("files").select("storage_path").eq("tender_id", id);
    if (files?.length) await sb.storage.from("tender-files").remove(files.map(f => f.storage_path));
    const { error } = await sb.from("tenders").delete().eq("id", id);
    if (error) throw error;
  },

  async createDelivery(d, email) {
    const { data, error } = await api.sb().from("deliveries").insert(deliveryUiToDb(d, email)).select().single();
    if (error) throw error;
    return deliveryDbToUi({ ...data, files: [] });
  },
  async updateDelivery(id, d, email) {
    const { data, error } = await api.sb().from("deliveries").update(deliveryUiToDb(d, email)).eq("id", id).select().single();
    if (error) throw error;
    return deliveryDbToUi({ ...data, files: d.files || [] });
  },
  async deleteDelivery(id) {
    const sb = api.sb();
    const { data: files } = await sb.from("files").select("storage_path").eq("delivery_id", id);
    if (files?.length) await sb.storage.from("tender-files").remove(files.map(f => f.storage_path));
    const { error } = await sb.from("deliveries").delete().eq("id", id);
    if (error) throw error;
  },

  async uploadFile({ tenderId, deliveryId, kind, file, email }) {
    const sb = api.sb();
    const safe = file.name.replace(/[^a-zA-Z0-9._-]/g, "_").slice(0, 80);
    const path = `${tenderId}/${deliveryId || 'tender'}/${Date.now()}_${Math.random().toString(36).slice(2,8)}_${safe}`;
    const up = await sb.storage.from("tender-files").upload(path, file, { contentType: file.type || "application/octet-stream", upsert: false });
    if (up.error) throw up.error;
    const { data, error } = await sb.from("files").insert({
      tender_id: tenderId, delivery_id: deliveryId || null, kind: kind || 'other',
      storage_path: path, name: file.name, mime_type: file.type, size_bytes: file.size, uploaded_by: email,
    }).select().single();
    if (error) { await sb.storage.from("tender-files").remove([path]); throw error; }
    return { id: data.id, name: data.name, type: data.mime_type, size: data.size_bytes, path: data.storage_path, kind: data.kind, uploadedAt: data.uploaded_at, uploadedBy: data.uploaded_by };
  },
  async deleteFile(file) {
    const sb = api.sb();
    if (file.path) await sb.storage.from("tender-files").remove([file.path]);
    const { error } = await sb.from("files").delete().eq("id", file.id);
    if (error) throw error;
  },
  async fileSignedUrl(path) {
    const { data, error } = await api.sb().storage.from("tender-files").createSignedUrl(path, 300);
    if (error) throw error; return data.signedUrl;
  },

  // ===== Admin user management (calls Edge Function) =====
  async _adminCall(method, action, body, queryExtra = {}) {
    const sb = api.sb();
    const { data: { session } } = await sb.auth.getSession();
    if (!session) throw new Error("Not signed in");
    const url = new URL(`${window.SUPABASE_URL}/functions/v1/admin-users`);
    if (action) url.searchParams.set("action", action);
    for (const [k, v] of Object.entries(queryExtra)) url.searchParams.set(k, v);
    const res = await fetch(url.toString(), {
      method,
      headers: {
        "Authorization": `Bearer ${session.access_token}`,
        "Content-Type": "application/json",
        "apikey": window.SUPABASE_ANON_KEY,
      },
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    return data;
  },
  async listUsers() { return (await api._adminCall("GET", "list")).users || []; },
  async createUser(email, password) { return (await api._adminCall("POST", "create", { email, password })).user; },
  async deleteUser(userId) { await api._adminCall("DELETE", null, null, { id: userId }); },
  async resetUserPassword(userId, password) { await api._adminCall("POST", "reset", { userId, password }); },

  async seed(tenders, email) {
    const sb = api.sb();
    let n = 0;
    for (const t of tenders) {
      const { error } = await sb.from("tenders").insert({
        name: t.name || "ახალი ტენდერი", code: t.code || null, date: t.date || null, address: t.address || null, notes: null,
        tender_amount: Number(t.tenderAmount) || 0, bid_price: Number(t.bidPrice) || 0, bid_step: Number(t.bidStep) || 0,
        items: t.items || [], updated_by: email,
      });
      if (error) throw error;
      n++;
    }
    return n;
  },
};

const ALLOWED_FILE_TYPES = {
  // images
  'image/jpeg': '.jpg', 'image/jpg': '.jpg', 'image/png': '.png', 'image/webp': '.webp', 'image/gif': '.gif',
  // documents
  'application/pdf': '.pdf',
  'application/msword': '.doc',
  'application/vnd.openxmlformats-officedocument.wordprocessingml.document': '.docx',
  'application/vnd.ms-excel': '.xls',
  'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': '.xlsx',
  'application/vnd.oasis.opendocument.text': '.odt',
  'application/vnd.oasis.opendocument.spreadsheet': '.ods',
  'text/csv': '.csv',
  'text/plain': '.txt',
};
const MAX_FILE_SIZE = 10 * 1024 * 1024; // 10 MB

const validateFile = (file) => {
  // size check
  if (file.size > MAX_FILE_SIZE) {
    return { ok: false, error: `"${file.name}" — ზომა ძალიან დიდია (${fmtBytes(file.size)}). მაქს. დასაშვები: 10 MB` };
  }
  if (file.size === 0) {
    return { ok: false, error: `"${file.name}" — ფაილი ცარიელია` };
  }
  // type check (by MIME or extension fallback)
  const ext = "." + (file.name.split(".").pop() || "").toLowerCase();
  const allowedExts = Object.values(ALLOWED_FILE_TYPES);
  const mimeOk = file.type && Object.keys(ALLOWED_FILE_TYPES).includes(file.type.toLowerCase());
  const extOk = allowedExts.includes(ext);
  if (!mimeOk && !extOk) {
    return { ok: false, error: `"${file.name}" — დაუშვებელი ტიპი (${ext}). დასაშვებია: PDF, JPG, PNG, DOC, DOCX, XLS, XLSX` };
  }
  // dangerous file name check
  const dangerous = /\.(exe|bat|cmd|com|scr|vbs|ps1|sh|app|jar|msi|dll|js)$/i;
  if (dangerous.test(file.name)) {
    return { ok: false, error: `"${file.name}" — საშიში ფაილის ტიპი დაუშვებელია` };
  }
  return { ok: true };
};

const FileList = ({ files, onUpload, onDelete, onView, accept, emptyText }) => {
  const inputRef = useRef(null);
  const [uploading, setUploading] = useState(false);
  const handle = async (e) => {
    const fs = Array.from(e.target.files || []);
    if (!fs.length) return;
    setUploading(true);
    for (const f of fs) {
      const v = validateFile(f);
      if (!v.ok) { alert("⚠️ " + v.error); continue; }
      try { await onUpload(f); } catch (err) { alert("შეცდომა: " + err.message); }
    }
    setUploading(false);
    e.target.value = "";
  };
  return (
    <div>
      <button onClick={() => inputRef.current?.click()} disabled={uploading} className="text-xs text-stone-700 hover:text-stone-900 inline-flex items-center gap-1 mb-2 disabled:opacity-50 font-medium">{uploading ? <Spinner /> : I.upload} ფაილის ატვირთვა</button>
      <input ref={inputRef} type="file" multiple accept={accept || ".pdf,.jpg,.jpeg,.png,.webp,.gif,.doc,.docx,.xls,.xlsx,.csv,.txt"} onChange={handle} className="hidden" />

    if (ser === lastSentRef.current) return;
    if (debounceRef.current) clearTimeout(debounceRef.current);
    debounceRef.current = setTimeout(async () => {
      setSaving(true);
      try { const u = await save(draft); lastSentRef.current = JSON.stringify(u); }
      catch (e) { toast("შენახვა ვერ მოხერხდა: " + e.message, "error"); }
      setSaving(false);
    }, 700);
    return () => debounceRef.current && clearTimeout(debounceRef.current);
  }, [draft]);

  const c = calcDelivery(draft);
  const profitPos = c.profit >= 0;
  const updateItem = (id, ni) => setDraft({ ...draft, items: draft.items.map(i => i.id === id ? ni : i) });
  const deleteItem = (id) => { if (!confirm("ნამდვილად წაიშალოს?")) return; setDraft({ ...draft, items: draft.items.filter(i => i.id !== id) }); };
  const addItem = () => setDraft({ ...draft, items: [...draft.items, { id: newId("it"), name: "", unit: "კგ", qty: 0, salePrice: 0, costPrice: 0 }] });
  const addFromTender = (ti) => {
    if (draft.items.find(i => i.name === ti.name)) { toast("უკვე დამატებულია", "info"); return; }
    setDraft({ ...draft, items: [...draft.items, { id: newId("it"), name: ti.name, unit: ti.unit || "კგ", qty: 0, salePrice: ti.salePrice || 0, costPrice: 0 }] });
  };

  const invoiceFiles = (draft.files || []).filter(f => f.kind === 'invoice');
  const purchaseFiles = (draft.files || []).filter(f => f.kind === 'purchase_act');
  const handoverFiles = (draft.files || []).filter(f => f.kind === 'handover_act');
  const otherFiles = (draft.files || []).filter(f => !['invoice','purchase_act','handover_act'].includes(f.kind));

  const fileUpload = (kind) => async (file) => {
    const ref = await onFileUpload({ deliveryId: draft.id, kind, file });
    setDraft(d => ({ ...d, files: [...(d.files || []), ref] }));
    lastSentRef.current = "";
    toast("ფაილი აიტვირთა", "success");
  };
  const fileDelete = async (f) => {
    if (!confirm(`წაიშალოს "${f.name}"?`)) return;
    try { await onFileDelete(f); setDraft(d => ({ ...d, files: (d.files || []).filter(x => x.id !== f.id) })); lastSentRef.current = ""; toast("წაიშალა", "success"); }
    catch (e) { toast("ვერ წაიშალა: " + e.message, "error"); }
  };

  const tenderItemsAvailable = (tender?.items || []).filter(ti => !draft.items.find(di => di.name === ti.name));

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between gap-2">
        <button onClick={back} className="inline-flex items-center gap-1 text-stone-700 hover:text-stone-900 text-sm font-medium px-2 py-1 -ml-2">{I.back} უკან ტენდერზე</button>
        <div className="flex items-center gap-2">
          {saving ? <span className="text-xs text-stone-500 inline-flex items-center gap-1"><Spinner /> ინახება…</span> : <span className="text-xs text-emerald-600 inline-flex items-center gap-1">{I.check} შენახული</span>}
          <button onClick={() => { if (confirm("მიწოდება სრულად წაიშალოს?")) onDelete(draft.id); }} className="p-2 text-rose-600 hover:bg-rose-50 rounded-lg">{I.trash}</button>
        </div>
      </div>

      <div className="bg-white rounded-2xl border border-stone-200 p-4 sm:p-5">
        <h2 className="font-display text-lg font-bold text-stone-900 mb-1 flex items-center gap-2">{I.truck} მიწოდება</h2>
        <div className="text-xs text-stone-500 mb-3">ტენდერი: <strong className="text-stone-700">{tender?.name || "..."}</strong></div>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label className="block text-xs text-stone-500 mb-1 uppercase tracking-wide">თარიღი</label>
            <input type="date" value={draft.deliveredAt || ""} onChange={(e) => setDraft({ ...draft, deliveredAt: e.target.value })} className="w-full px-3 py-2 border border-stone-200 rounded-lg text-sm focus:outline-none focus:border-stone-900" />
          </div>
          <div>
            <label className="block text-xs text-stone-500 mb-1 uppercase tracking-wide">შენიშვნები</label>
            <input type="text" value={draft.notes || ""} onChange={(e) => setDraft({ ...draft, notes: e.target.value })} placeholder="დამატებითი ინფო" className="w-full px-3 py-2 border border-stone-200 rounded-lg text-sm focus:outline-none focus:border-stone-900" />
          </div>
        </div>
        <div className="mt-3 pt-3 border-t border-stone-100 grid grid-cols-1 sm:grid-cols-2 gap-3">
          <label className={`flex items-center gap-3 cursor-pointer p-3 rounded-xl border-2 transition ${draft.paid ? "border-emerald-300 bg-emerald-50" : "border-stone-200 bg-stone-50 hover:bg-stone-100"}`}>
            <input
              type="checkbox"
              checked={!!draft.paid}
              onChange={(e) => setDraft({ ...draft, paid: e.target.checked, paidAt: e.target.checked ? (draft.paidAt || new Date().toISOString().slice(0,10)) : null })}
              className="w-5 h-5 accent-emerald-600 cursor-pointer"
            />
            <div className="flex-1">
              <div className={`text-sm font-semibold ${draft.paid ? "text-emerald-900" : "text-stone-700"}`}>
                {draft.paid ? "✓ ჩარიცხულია" : "ჯერ არ ჩარიცხულა"}
              </div>
              <div className="text-[11px] text-stone-500 mt-0.5">თანხა შემკვეთისგან მიღებულია?</div>
            </div>
            {draft.paid && (
              <input
                type="date"
                value={draft.paidAt || ""}
                onClick={(e) => e.stopPropagation()}
                onChange={(e) => { e.stopPropagation(); setDraft({ ...draft, paidAt: e.target.value }); }}
                className="text-xs px-2 py-1 border border-emerald-200 bg-white rounded"
              />
            )}
          </label>
          <label className={`flex items-center gap-3 cursor-pointer p-3 rounded-xl border-2 transition ${draft.supplierPaid ? "border-sky-300 bg-sky-50" : "border-stone-200 bg-stone-50 hover:bg-stone-100"}`}>
            <input
              type="checkbox"
              checked={!!draft.supplierPaid}
              onChange={(e) => setDraft({ ...draft, supplierPaid: e.target.checked, supplierPaidAt: e.target.checked ? (draft.supplierPaidAt || new Date().toISOString().slice(0,10)) : null })}
              className="w-5 h-5 accent-sky-600 cursor-pointer"
            />
            <div className="flex-1">
              <div className={`text-sm font-semibold ${draft.supplierPaid ? "text-sky-900" : "text-stone-700"}`}>
                {draft.supplierPaid ? "✓ მიმწოდებელს გადახდილია" : "მიმწოდებელს ჯერ არ გადახდია"}
              </div>
              <div className="text-[11px] text-stone-500 mt-0.5">თვითღირებულება მიმწოდებლისთვის ანაზღაურებულია?</div>
            </div>
            {draft.supplierPaid && (
              <input
                type="date"
                value={draft.supplierPaidAt || ""}
                onClick={(e) => e.stopPropagation()}
                onChange={(e) => { e.stopPropagation(); setDraft({ ...draft, supplierPaidAt: e.target.value }); }}
                className="text-xs px-2 py-1 border border-sky-200 bg-white rounded"
              />
            )}
          </label>
        </div>
      </div>

      <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
        <StatCard icon={I.dollar} label="გაყიდვა" value={fmtL(c.rev)} tone="neutral" />
        <StatCard icon={I.pkg} label="თვითღირ." value={fmtL(c.cost)} tone="accent" />
        <StatCard icon={profitPos ? I.trendUp : I.trendDown} label="მოგება" value={fmtL(c.profit)} tone={profitPos ? "positive" : "negative"} />
        <StatCard icon={profitPos ? I.trendUp : I.trendDown} label="მარჟა" value={fmt(c.margin, 1) + "%"} tone={profitPos ? "positive" : "negative"} />
      </div>

      <div className="space-y-2">
        <div className="flex items-center justify-between">
          <h3 className="text-sm font-semibold text-stone-700 uppercase tracking-wide">პროდუქტები ({draft.items.length})</h3>
          <button onClick={addItem} className="inline-flex items-center gap-1 text-sm text-stone-700 hover:text-stone-900 font-medium">{I.plus} დამატება</button>
        </div>
        {tenderItemsAvailable.length > 0 && (
          <div className="bg-sky-50 border border-sky-200 rounded-xl p-3">
            <div className="text-xs text-sky-900 font-semibold uppercase tracking-wide mb-2">სწრაფი დამატება ტენდერიდან</div>
            <div className="flex flex-wrap gap-1.5">
              {tenderItemsAvailable.map(ti => (
                <button key={ti.id} onClick={() => addFromTender(ti)} className="text-xs px-2 py-1 bg-white border border-sky-300 text-sky-900 rounded-full hover:bg-sky-100 transition">+ {ti.name} ({fmtL(ti.salePrice)})</button>
              ))}
            </div>
          </div>
        )}
        {draft.items.length === 0 ? (
          <div className="text-center py-8 bg-white border border-dashed border-stone-300 rounded-xl text-stone-500 text-sm">
            ჯერ პროდუქტი არ არის.<br/>
            <button onClick={addItem} className="mt-2 inline-flex items-center gap-1 text-stone-900 font-medium">{I.plus} ხელით დამატება</button>
          </div>
        ) : (
          draft.items.map((it) => <DeliveryItemRow key={it.id} item={it} onChange={(ni) => updateItem(it.id, ni)} onDelete={() => deleteItem(it.id)} suggestions={tender?.items} />)
        )}
        {tender?.items?.length > 0 && <datalist id="delivery-product-suggestions">{tender.items.map(t => <option key={t.id} value={t.name} />)}</datalist>}
      </div>

      <div className="bg-white rounded-2xl border border-stone-200 p-4 space-y-4">
        <div>
          <h3 className="text-sm font-semibold text-sky-700 uppercase tracking-wide flex items-center gap-1.5 mb-2">{React.cloneElement(I.doc, { size: 16 })} მიღება-ჩაბარების აქტი</h3>
          <FileList files={handoverFiles} onUpload={fileUpload('handover_act')} onDelete={fileDelete} onView={onFileView} emptyText="მიღება-ჩაბარების აქტის ასატვირთად დააჭირე" />
        </div>
        <div className="border-t border-stone-100 pt-4">
          <h3 className="text-sm font-semibold text-emerald-700 uppercase tracking-wide flex items-center gap-1.5 mb-2">{React.cloneElement(I.send, { size: 16 })} ანგარიშ-ფაქტურა (ჩვენი მიერ გაცემული)</h3>
          <FileList files={invoiceFiles} onUpload={fileUpload('invoice')} onDelete={fileDelete} onView={onFileView} emptyText="ანგარიშ-ფაქტურის ასატვირთად დააჭირე" />
        </div>
        <div className="border-t border-stone-100 pt-4">
          <h3 className="text-sm font-semibold text-amber-700 uppercase tracking-wide flex items-center gap-1.5 mb-2">{React.cloneElement(I.inbox, { size: 16 })} შესყიდვის აქტი (მიმწოდებლისგან მიღებული)</h3>
          <FileList files={purchaseFiles} onUpload={fileUpload('purchase_act')} onDelete={fileDelete} onView={onFileView} emptyText="შესყიდვის აქტის ასატვირთად დააჭირე" />
        </div>
        {otherFiles.length > 0 && (
          <div className="border-t border-stone-100 pt-4">
            <h3 className="text-sm font-semibold text-stone-700 uppercase tracking-wide mb-2">სხვა ფაილები</h3>
            <FileList files={otherFiles} onUpload={fileUpload('other')} onDelete={fileDelete} onView={onFileView} />
          </div>
        )}
      </div>
    </div>
  );
};

// ===== Tender Detail =====
const TenderDetail = ({ tender, save, onDelete, back, toast, onFileUpload, onFileDelete, onFileView, openDelivery, addDelivery }) => {
  const [draft, setDraft] = useState(tender);
  const [editingMeta, setEditingMeta] = useState(false);
  const [section, setSection] = useState("deliveries");
  const [saving, setSaving] = useState(false);
  const debounceRef = useRef(null);
  const lastSentRef = useRef(JSON.stringify(tender));

  useEffect(() => { setDraft(tender); }, [tender.id]);
  useEffect(() => { setDraft(d => ({ ...d, deliveries: tender.deliveries || [], files: tender.files || [] })); }, [tender.deliveries, tender.files]);

  useEffect(() => {
    const compareDraft = { ...draft, deliveries: undefined, files: undefined };
    const compareLast = JSON.parse(lastSentRef.current || "{}");
    delete compareLast.deliveries; delete compareLast.files;
    const ser = JSON.stringify(compareDraft);
    const lastSer = JSON.stringify(compareLast);
    if (ser === lastSer) return;
    if (debounceRef.current) clearTimeout(debounceRef.current);
    debounceRef.current = setTimeout(async () => {
      setSaving(true);
      try { const u = await save(draft); lastSentRef.current = JSON.stringify(u); }
      catch(e) { toast("შენახვა ვერ მოხერხდა: " + e.message, "error"); }
      setSaving(false);
    }, 700);
    return () => debounceRef.current && clearTimeout(debounceRef.current);
  }, [draft.name, draft.code, draft.date, draft.address, draft.notes, draft.tenderAmount, draft.bidPrice, JSON.stringify(draft.items)]);

  const planned = calcTenderPlanned(draft);
  const actual = calcTenderActuals(draft.deliveries);
  const profitPos = actual.profit >= 0;

  const updateItem = (id, ni) => setDraft({ ...draft, items: draft.items.map(i => i.id === id ? ni : i) });
  const deleteItem = (id) => { if (!confirm("ნამდვილად წაიშალოს?")) return; setDraft({ ...draft, items: draft.items.filter(i => i.id !== id) }); };
  const addItem = () => setDraft({ ...draft, items: [...draft.items, { id: newId("ti"), name: "", unit: "კგ", qty: 0, salePrice: 0 }] });

  const tenderFiles = draft.files || [];

  return (
    <div className="space-y-4 sm:space-y-5">
      <div className="flex items-center justify-between gap-2">
        <button onClick={back} className="inline-flex items-center gap-1 text-stone-700 hover:text-stone-900 text-sm font-medium px-2 py-1 -ml-2">{I.back} უკან</button>
        <div className="flex items-center gap-2">
          {saving ? <span className="text-xs text-stone-500 inline-flex items-center gap-1"><Spinner /> ინახება…</span> : <span className="text-xs text-emerald-600 inline-flex items-center gap-1">{I.check} შენახული</span>}
          <button onClick={() => setEditingMeta(v => !v)} className="p-2 text-stone-600 hover:text-stone-900 hover:bg-stone-100 rounded-lg">{I.edit}</button>
          <button onClick={() => { if (confirm("ტენდერი სრულად წაიშალოს ყველა მიწოდებითა და ფაილით?")) onDelete(draft.id); }} className="p-2 text-rose-600 hover:bg-rose-50 rounded-lg">{I.trash}</button>
        </div>
      </div>

      <div className="bg-white rounded-2xl border border-stone-200 p-4 sm:p-6">
        {editingMeta ? (
          <div className="space-y-3">
            <div>
              <label className="block text-xs text-stone-500 mb-1 uppercase tracking-wide">დაწესებულება</label>
              <input value={draft.name || ""} onChange={(e) => setDraft({ ...draft, name: e.target.value })} className="w-full px-3 py-2 border border-stone-200 rounded-lg text-sm focus:outline-none focus:border-stone-900" />
            </div>
            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="block text-xs text-stone-500 mb-1 uppercase tracking-wide">კოდი</label>
                <input value={draft.code || ""} onChange={(e) => setDraft({ ...draft, code: e.target.value })} className="w-full px-3 py-2 border border-stone-200 rounded-lg text-sm focus:outline-none focus:border-stone-900" />
              </div>
              <div>
                <label className="block text-xs text-stone-500 mb-1 uppercase tracking-wide">თარიღი</label>
                <input type="date" value={draft.date ? draft.date.slice(0,10) : ""} onChange={(e) => setDraft({ ...draft, date: e.target.value ? e.target.value + "T00:00:00Z" : null })} className="w-full px-3 py-2 border border-stone-200 rounded-lg text-sm focus:outline-none focus:border-stone-900" />
              </div>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="block text-xs text-stone-500 mb-1 uppercase tracking-wide">სატენდერო თანხა</label>
                <input type="number" value={draft.tenderAmount || 0} onChange={(e) => setDraft({ ...draft, tenderAmount: parseFloat(e.target.value) || 0 })} className="w-full px-3 py-2 border border-stone-200 rounded-lg text-sm focus:outline-none focus:border-stone-900" />
              </div>
              <div>
                <label className="block text-xs text-stone-500 mb-1 uppercase tracking-wide">წინადადება</label>
                <input type="number" value={draft.bidPrice || 0} onChange={(e) => setDraft({ ...draft, bidPrice: parseFloat(e.target.value) || 0 })} className="w-full px-3 py-2 border border-stone-200 rounded-lg text-sm focus:outline-none focus:border-stone-900" />
              </div>
            </div>
            <div>
              <label className="block text-xs text-stone-500 mb-1 uppercase tracking-wide">მისამართი</label>
              <textarea value={draft.address || ""} onChange={(e) => setDraft({ ...draft, address: e.target.value })} rows={2} className="w-full px-3 py-2 border border-stone-200 rounded-lg text-sm focus:outline-none focus:border-stone-900 resize-none" />
            </div>
            <div>
              <label className="block text-xs text-stone-500 mb-1 uppercase tracking-wide">შენიშვნები</label>
              <textarea value={draft.notes || ""} onChange={(e) => setDraft({ ...draft, notes: e.target.value })} rows={2} className="w-full px-3 py-2 border border-stone-200 rounded-lg text-sm focus:outline-none focus:border-stone-900 resize-none" />
            </div>
            <button onClick={() => setEditingMeta(false)} className="inline-flex items-center gap-1 px-3 py-1.5 bg-stone-900 text-white rounded-lg text-sm">{I.save} დასრულება</button>
          </div>
        ) : (
          <>
            <h2 className="text-lg sm:text-xl font-bold text-stone-900 leading-snug">{draft.name || "უსახელო"}</h2>
            <div className="flex flex-wrap gap-x-4 gap-y-1 mt-2 text-xs text-stone-600">
              {draft.code && <span className="inline-flex items-center gap-1">{I.hash} {draft.code}</span>}
              {draft.date && <span className="inline-flex items-center gap-1">{I.cal} {formatDate(draft.date)}</span>}
            </div>
            {draft.address && <div className="flex items-start gap-1 mt-2 text-xs text-stone-500">{I.pin}<span className="line-clamp-2">{draft.address}</span></div>}
            {(draft.tenderAmount > 0 || draft.bidPrice > 0 || draft.bidStep > 0) ? null : null}
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 mt-3 pt-3 border-t border-stone-100">
              <div className="bg-emerald-50 rounded-lg px-3 py-2 ring-1 ring-emerald-100">
                <label className="block text-[10px] text-emerald-700 uppercase tracking-wide mb-1">მოგებული თანხა</label>
                <input type="number" step="0.01" value={draft.bidPrice || 0}
                  onChange={(e) => setDraft({ ...draft, bidPrice: parseFloat(e.target.value) || 0 })}
                  className="w-full bg-transparent text-sm font-bold tabular-nums focus:outline-none p-0 border-0 text-emerald-900" />
              </div>
              {(() => {
                const won = draft.bidPrice || 0;
                const actual = (draft.deliveries || []).reduce((s, d) =>
                  s + (d.items || []).reduce((ss, it) => ss + ((+it.qty || 0) * (+it.salePrice || 0)), 0), 0);
                const remaining = won - actual;
                return (
                  <div className={`rounded-lg px-3 py-2 ring-1 ${remaining >= 0 ? "bg-sky-50 ring-sky-100" : "bg-rose-50 ring-rose-100"}`}>
                    <label className={`block text-[10px] uppercase tracking-wide mb-1 ${remaining >= 0 ? "text-sky-700" : "text-rose-700"}`}>დარჩენილი მისატანი</label>
                    <div className={`text-sm font-bold tabular-nums ${remaining >= 0 ? "text-sky-900" : "text-rose-900"}`}>{fmtL(remaining)}</div>
                  </div>
                );
              })()}
            </div>
            {draft.notes && <div className="mt-3 pt-3 border-t border-stone-100 text-sm text-stone-700 whitespace-pre-wrap">{draft.notes}</div>}
            <div className="mt-3 pt-3 border-t border-stone-100">
              <h4 className="text-xs text-stone-500 uppercase tracking-wide mb-2 flex items-center gap-1.5">{React.cloneElement(I.doc, { size: 13 })} ხელშეკრულება</h4>
              <FileList
                files={(draft.files || []).filter(f => f.kind === 'contract')}
                onUpload={async (file) => { const ref = await onFileUpload({ tenderId: draft.id, kind: 'contract', file }); setDraft(d => ({ ...d, files: [...(d.files || []), ref] })); toast("ხელშეკრულება აიტვირთა", "success"); }}
                onDelete={async (f) => { if (!confirm(`წაიშალოს "${f.name}"?`)) return; try { await onFileDelete(f); setDraft(d => ({ ...d, files: (d.files || []).filter(x => x.id !== f.id) })); toast("წაიშალა", "success"); } catch(e) { toast("ვერ წაიშალა: " + e.message, "error"); } }}
                onView={onFileView}
                emptyText="ხელშეკრულების ფაილის ასატვირთად დააჭირე"
              />
            </div>
          </>
        )}
      </div>

      <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
        <StatCard icon={I.dollar} label="ფაქტ. გაყიდვა" value={fmtL(actual.rev)} sub={`გეგმა: ${fmtL(planned.plannedRev)}`} tone="neutral" />
        <StatCard icon={I.pkg} label="ფაქტ. ხარჯი" value={fmtL(actual.cost)} tone="accent" />
        <StatCard icon={profitPos ? I.trendUp : I.trendDown} label="მოგება" value={fmtL(actual.profit)} sub={`${actual.deliveryCount} მიწოდება`} tone={profitPos ? "positive" : "negative"} />

              <StatCard icon={I.alert} label="მიმწოდებელს დავალიანება" value={fmtL(unpaidCost)} sub="ჯერ არ გადახდილა" tone="accent" />

                      {fileCount === 0 && <Pill tone="warning">ფაილების გარეშე</Pill>}

            ეს არის ტენდერით გათვალისწინებული პროდუქტები და გაყიდვის ფასები.<br/>

          </div>

      )}

      {section === "analytics" && (() => {

        if (rows.length === 0) {

                      <th className="px-3 py-2.5 font-medium text-right text-sky-700">მიწოდებული</th>
                      <th className="px-3 py-2.5 font-medium text-right text-amber-700">დარჩენილი</th>
                      <th className="px-3 py-2.5 font-medium min-w-[160px]">პროგრესი</th>
                    </tr>
                  </thead>
                  <tbody>
                    {rows.map(r => {
                      const done = r.progress >= 100;
                      const tone = done ? "bg-emerald-500" : r.progress >= 75 ? "bg-sky-500" : r.progress >= 25 ? "bg-amber-500" : "bg-stone-400";
                      return (
                        <tr key={r.name} className="border-t border-stone-100 hover:bg-stone-50">
                          <td className="px-4 py-2.5 font-medium text-stone-900">
                            {r.name} <span className="text-xs text-stone-400">({r.unit})</span>
                            {r.orphan && <span className="ml-2 text-[10px] text-amber-700">(ტენდერში არ არის)</span>}

                          <td className="px-3 py-2.5 text-right tabular-nums text-stone-700">{fmt(r.plannedQty, 1)}</td>
                          <td className="px-3 py-2.5 text-right tabular-nums text-sky-700 font-medium">{fmt(r.deliveredQty, 1)}</td>
                          <td className={`px-3 py-2.5 text-right tabular-nums font-medium ${r.remainingQty > 0 ? "text-amber-700" : r.remainingQty < 0 ? "text-rose-700" : "text-emerald-700"}`}>

                          </td>
                          <td className="px-3 py-2.5">
                            {r.plannedQty > 0 ? (
                              <div className="flex items-center gap-2">
                                <div className="flex-1 h-2 bg-stone-100 rounded-full overflow-hidden">
                                  <div className={`h-full ${tone} transition-all`} style={{ width: `${Math.min(100, r.progress)}%` }} />
                                </div>
                                <span className="text-[10px] text-stone-600 tabular-nums w-9 text-right">{fmt(r.progress, 0)}%</span>
                              </div>
                            ) : <span className="text-xs text-stone-400">—</span>}
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        );
      })()}

      {section === "files" && (
        <div className="bg-white rounded-2xl border border-stone-200 p-4">
          <h3 className="text-sm font-semibold text-stone-700 uppercase tracking-wide mb-3">ტენდერის ზოგადი ფაილები</h3>
          <div className="text-xs text-stone-500 bg-stone-100 rounded-lg p-3 mb-3">
            ხელშეკრულება, განცხადება, სხვა დოკუმენტები. <br/>ანგარიშ-ფაქტურა და შესყიდვის აქტი ცალკეული მიწოდების შიგნით ინახება.
          </div>
          <FileList
            files={tenderFiles}
            onUpload={async (file) => { const ref = await onFileUpload({ tenderId: draft.id, kind: 'tender_doc', file }); setDraft(d => ({ ...d, files: [...(d.files || []), ref] })); toast("აიტვირთა", "success"); }}
            onDelete={async (f) => { if (!confirm(`წაიშალოს "${f.name}"?`)) return; try { await onFileDelete(f); setDraft(d => ({ ...d, files: (d.files || []).filter(x => x.id !== f.id) })); toast("წაიშალა", "success"); } catch(e) { toast("ვერ წაიშალა: " + e.message, "error"); } }}
            onView={onFileView}
            emptyText="ტენდერის ფაილების ასატვირთად დააჭირე"
          />
        </div>
      )}
    </div>
  );
};
// ===== Dashboard =====
const Dashboard = ({ tenders, search, setSearch, openTender, addTender }) => {
  const filtered = useMemo(() => {
    if (!search.trim()) return tenders;
    const q = search.toLowerCase();
    return tenders.filter(t => (t.name||"").toLowerCase().includes(q) || (t.code||"").toLowerCase().includes(q) || (t.address||"").toLowerCase().includes(q));
  }, [tenders, search]);

  const totals = useMemo(() => {
    let rev = 0, cost = 0, deliveries = 0, paidRev = 0, unpaidRev = 0, won = 0, paidCost = 0, unpaidCost = 0;
    for (const t of tenders) {
      const c = calcTenderActuals(t.deliveries);
      rev += c.rev; cost += c.cost; deliveries += c.deliveryCount;
      paidRev += c.paidRev; unpaidRev += c.unpaidRev;
      paidCost += c.paidCost; unpaidCost += c.unpaidCost;
      won += t.bidPrice || 0;
    }
    return { rev, cost, profit: rev-cost, margin: rev > 0 ? ((rev-cost)/rev)*100 : 0,
             deliveries, paidRev, unpaidRev, paidCost, unpaidCost, won, remaining: won - rev };
  }, [tenders]);

  return (
    <div className="space-y-5 sm:space-y-6">
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <StatCard icon={I.dollar} label="გაყიდვა" value={fmtL(totals.rev)} sub={`${tenders.length} ტენდერი / ${totals.deliveries} მიწოდება`} tone="neutral" />
        <StatCard icon={I.pkg} label="თვითღირ." value={fmtL(totals.cost)} tone="accent" />
        <StatCard icon={totals.profit >= 0 ? I.trendUp : I.trendDown} label="მოგება" value={fmtL(totals.profit)} tone={totals.profit >= 0 ? "positive" : "negative"} />
        <StatCard icon={totals.margin >= 0 ? I.trendUp : I.trendDown} label="მარჟა" value={fmt(totals.margin, 1) + "%"} tone={totals.margin >= 0 ? "positive" : "negative"} />
      </div>
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <StatCard icon={I.dollar} label="მოგებული თანხა" value={fmtL(totals.won)} sub="ყველა ტენდერი ერთად" tone="neutral" />
        <StatCard icon={I.check} label="ჩარიცხული" value={fmtL(totals.paidRev)} sub="შემკვეთისგან მიღებული" tone="positive" />
        <StatCard icon={I.alert} label="გადაუხდელი" value={fmtL(totals.unpaidRev)} sub="ჯერ არ ჩარიცხულა" tone="warning" />
        <StatCard icon={I.send} label="დარჩენილი მისატანი" value={fmtL(totals.remaining)} sub={totals.remaining >= 0 ? "ვალდებულება დარჩა" : "ჭარბი მიწოდება"} tone={totals.remaining >= 0 ? "info" : "negative"} />
      </div>
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <StatCard icon={I.check} label="მიმწოდებელს გადახდილი" value={fmtL(totals.paidCost)} sub="ანაზღაურებული" tone="info" />
        <StatCard icon={I.alert} label="მიმწოდებელს დავალიანება" value={fmtL(totals.unpaidCost)} sub="ჯერ არ გადახდილა" tone="accent" />
      </div>

      <div className="flex flex-col sm:flex-row gap-2">
        <div className="relative flex-1">
          <span className="absolute left-3 top-1/2 -translate-y-1/2 text-stone-400">{I.search}</span>
          <input type="search" value={search} onChange={(e) => setSearch(e.target.value)} placeholder="ძებნა — დაწესებულება, კოდი…" className="w-full pl-10 pr-3 py-3 bg-white border border-stone-200 rounded-xl text-sm focus:outline-none focus:border-stone-900 focus:ring-1 focus:ring-stone-900" />
        </div>

      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-3">
        {filtered.length === 0 && <div className="col-span-full py-12 text-center text-stone-500 text-sm">ტენდერი არ მოიძებნა</div>}
        {filtered.map(t => {
          const planned = calcTenderPlanned(t);

          const dCount = (t.deliveries || []).length;

                  <div><div className="text-[10px] text-stone-500 uppercase tracking-wide mb-0.5">მოგება</div><div className={`text-sm font-semibold tabular-nums ${profitPos ? "text-emerald-700" : "text-rose-700"}`}>{fmtL(actual.profit)}</div></div>
                  <div><div className="text-[10px] text-stone-500 uppercase tracking-wide mb-0.5">მარჟა</div><div className={`text-sm font-semibold tabular-nums ${profitPos ? "text-emerald-700" : "text-rose-700"}`}>{fmt(actual.margin, 1)}%</div></div>
                </div>
              ) : (
                <div className="pt-3 border-t border-stone-100">
                  <div className="text-xs text-stone-500">გეგმური ღირებულება: <strong className="text-stone-700 tabular-nums">{fmtL(planned.plannedRev)}</strong></div>

          </div>

                  <th className="px-3 py-2 font-medium text-right">გაყიდვა</th>
                  <th className="px-3 py-2 font-medium text-right text-emerald-700">ჩარიცხ.</th>
                  <th className="px-3 py-2 font-medium text-right text-amber-700">გადაუხდ.</th>
                  <th className="px-3 py-2 font-medium text-right text-sky-700">დარჩენ.</th>
                  <th className="px-3 py-2 font-medium text-right text-amber-700">მიმწოდ. დავალ.</th>
                  <th className="px-3 py-2 font-medium text-right">მოგება</th>
                </tr>
              </thead>
              <tbody>
                {tenders.map(t => {
                  const a = calcTenderActuals(t.deliveries);
                  const won = t.bidPrice || 0;
                  const remaining = won - a.rev;
                  const pos = a.profit >= 0;
                  return (
                    <tr key={t.id} className="border-t border-stone-100 hover:bg-stone-50 cursor-pointer" onClick={() => openTender(t.id)}>
                      <td className="px-3 py-2 font-medium text-stone-900 truncate max-w-[180px]">{t.name}</td>
                      <td className="px-3 py-2 text-right tabular-nums text-stone-700">{won > 0 ? fmtL(won) : "—"}</td>
                      <td className="px-3 py-2 text-right text-stone-600 tabular-nums">{a.deliveryCount}</td>
                      <td className="px-3 py-2 text-right tabular-nums">{fmtL(a.rev)}</td>
                      <td className="px-3 py-2 text-right tabular-nums text-emerald-700 font-medium">{fmtL(a.paidRev)}</td>
                      <td className="px-3 py-2 text-right tabular-nums text-amber-700 font-medium">{fmtL(a.unpaidRev)}</td>
                      <td className={`px-3 py-2 text-right tabular-nums font-medium ${won > 0 ? (remaining >= 0 ? "text-sky-700" : "text-rose-700") : "text-stone-400"}`}>
                        {won > 0 ? fmtL(remaining) : "—"}
                      </td>
                      <td className="px-3 py-2 text-right tabular-nums text-amber-700 font-medium">{fmtL(a.unpaidCost)}</td>
                      <td className={`px-3 py-2 text-right font-semibold tabular-nums ${pos ? "text-emerald-700" : "text-rose-700"}`}>{fmtL(a.profit)}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </div>
  );
};

// ===== Seed prompt =====
const SeedPrompt = ({ onSeed, onSkip, busy }) => (
  <div className="max-w-md mx-auto py-12 text-center">
    <div className="w-16 h-16 rounded-2xl bg-stone-900 text-white text-2xl font-bold flex items-center justify-center mx-auto mb-5 font-display">R</div>
    <h2 className="font-display text-2xl font-bold text-stone-900 mb-2">პირველი შესვლა</h2>
    <p className="text-stone-600 text-sm mb-6 leading-relaxed">მონაცემთა ბაზა ცარიელია. გნებავს ჩაიტვირთოს Excel-დან გადმოტანილი {SEED.length} ტენდერი ({SEED.reduce((s, t) => s + (t.items?.length || 0), 0)} პროდუქტი)?</p>
    <div className="flex flex-col gap-2">
      <button onClick={onSeed} disabled={busy} className="inline-flex items-center justify-center gap-2 px-5 py-3 bg-stone-900 text-white rounded-xl font-medium hover:bg-stone-800 disabled:opacity-50 transition">{busy ? <><Spinner /> იტვირთება…</> : <>{I.download} ჩატვირთე საწყისი მონაცემები</>}</button>
      <button onClick={onSkip} className="px-5 py-3 text-stone-700 rounded-xl text-sm hover:bg-stone-100 transition">არა, ცარიელით ვიწყებ</button>
    </div>
  </div>
);

// ===== User Management (admin only) =====
const UserManagement = ({ back, currentEmail, toast }) => {
  const [users, setUsers] = useState(null);
  const [loading, setLoading] = useState(true);
  const [showAdd, setShowAdd] = useState(false);
  const [newEmail, setNewEmail] = useState("");
  const [newPassword, setNewPassword] = useState("");
  const [busy, setBusy] = useState(false);

  const load = async () => {
    setLoading(true);
    try { setUsers(await api.listUsers()); }
    catch(e) { toast("ვერ ჩაიტვირთა: " + e.message, "error"); setUsers([]); }
    setLoading(false);
  };
  useEffect(() => { load(); }, []);

  const handleAdd = async (e) => {
    e.preventDefault();
    if (!newEmail || !newPassword) return;
    setBusy(true);
    try {
      await api.createUser(newEmail.trim(), newPassword);
      toast("იუზერი შეიქმნა", "success");
      setNewEmail(""); setNewPassword(""); setShowAdd(false);
      await load();
    } catch(err) { toast("ვერ შეიქმნა: " + err.message, "error"); }
    setBusy(false);
  };

  const handleDelete = async (u) => {
    if (!confirm(`ნამდვილად წაიშალოს იუზერი ${u.email}?`)) return;
    try { await api.deleteUser(u.id); toast("წაიშალა", "success"); await load(); }
    catch(e) { toast("ვერ წაიშალა: " + e.message, "error"); }
  };

  const handleReset = async (u) => {
    const newPwd = prompt(`ახალი პაროლი იუზერისთვის ${u.email}:`);
    if (!newPwd) return;
    if (newPwd.length < 6) { toast("პაროლი მინ. 6 სიმბოლო", "error"); return; }
    try { await api.resetUserPassword(u.id, newPwd); toast("პაროლი შეიცვალა", "success"); }
    catch(e) { toast("ვერ შეიცვალა: " + e.message, "error"); }
  };

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between gap-2">
        <button onClick={back} className="inline-flex items-center gap-1 text-stone-700 hover:text-stone-900 text-sm font-medium px-2 py-1 -ml-2">{I.back} უკან</button>
        <button onClick={load} className="p-2 text-stone-600 hover:text-stone-900 hover:bg-stone-100 rounded-lg" title="განახლება">{I.refresh}</button>
      </div>

      <div className="bg-white rounded-2xl border border-stone-200 p-4 sm:p-6">
        <div className="flex items-center justify-between mb-4">
          <div>
            <h2 className="font-display text-xl font-bold text-stone-900 flex items-center gap-2">{I.user} იუზერების მართვა</h2>
            <p className="text-xs text-stone-500 mt-1">მხოლოდ ადმინისტრატორი ხედავს ამ გვერდს</p>
          </div>
          <button onClick={() => setShowAdd(v => !v)} className="inline-flex items-center gap-1 px-3 py-2 bg-stone-900 text-white rounded-lg text-sm font-medium hover:bg-stone-800 transition">
            {showAdd ? I.back : I.plus} {showAdd ? "გაუქმება" : "ახალი იუზერი"}
          </button>
        </div>

        {showAdd && (
          <form onSubmit={handleAdd} className="bg-stone-50 rounded-xl p-4 mb-4 space-y-3">
            <h3 className="text-sm font-semibold text-stone-700">ახალი იუზერის შექმნა</h3>
            <div>
              <label className="block text-xs text-stone-500 mb-1 uppercase tracking-wide">ელფოსტა</label>
              <input type="email" required value={newEmail} onChange={(e) => setNewEmail(e.target.value)} placeholder="user@example.com" className="w-full px-3 py-2 border border-stone-200 rounded-lg text-sm focus:outline-none focus:border-stone-900" />
            </div>
            <div>
              <label className="block text-xs text-stone-500 mb-1 uppercase tracking-wide">პაროლი (მინ. 6 სიმბოლო)</label>
              <input type="text" required minLength={6} value={newPassword} onChange={(e) => setNewPassword(e.target.value)} placeholder="დროებითი პაროლი" className="w-full px-3 py-2 border border-stone-200 rounded-lg text-sm focus:outline-none focus:border-stone-900 font-mono" />
              <p className="text-[10px] text-stone-500 mt-1">გადაეცი ეს პაროლი თანამშრომელს — მოგვიანებით თვითონ შეცვლის</p>
            </div>
            <button type="submit" disabled={busy} className="w-full inline-flex items-center justify-center gap-1 px-3 py-2 bg-stone-900 text-white rounded-lg text-sm font-medium disabled:opacity-50">{busy ? <><Spinner /> შექმნა…</> : "შექმნა"}</button>
          </form>
        )}

        {loading ? (
          <div className="text-center py-8 text-stone-500 text-sm flex items-center justify-center gap-2"><Spinner /> იტვირთება…</div>
        ) : !users || users.length === 0 ? (
          <div className="text-center py-8 text-stone-500 text-sm">იუზერი არ მოიძებნა</div>
        ) : (
          <div className="space-y-2">
            {users.map(u => (
              <div key={u.id} className="flex items-center gap-3 p-3 bg-stone-50 rounded-lg border border-stone-200">
                <div className="w-9 h-9 rounded-full bg-stone-900 text-white flex items-center justify-center text-xs font-bold uppercase shrink-0">{(u.email || "?")[0]}</div>
                <div className="flex-1 min-w-0">
                  <div className="text-sm font-medium text-stone-900 truncate flex items-center gap-2">
                    {u.email}
                    {u.isAdmin && <Pill tone="warning">ადმინი</Pill>}
                    {u.isSelf && <Pill tone="info">მე</Pill>}
                  </div>
                  <div className="text-[11px] text-stone-500">
                    შეიქმნა: {formatDate(u.createdAt)}
                    {u.lastSignInAt && <> · ბოლო შესვლა: {formatDate(u.lastSignInAt)}</>}
                    {!u.emailConfirmed && <> · <span className="text-rose-600">დაუდასტურებელი</span></>}
                  </div>
                </div>
                {!u.isSelf && (
                  <>
                    <button onClick={() => handleReset(u)} className="p-2 text-stone-600 hover:text-stone-900 hover:bg-white rounded" title="პაროლის შეცვლა">{React.cloneElement(I.lock, { size: 14 })}</button>
                    {!u.isAdmin && <button onClick={() => handleDelete(u)} className="p-2 text-stone-600 hover:text-rose-600 hover:bg-white rounded" title="წაშლა">{React.cloneElement(I.trash, { size: 14 })}</button>}
                  </>
                )}
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
};

// ===== Root =====
function App() {
  const [ready, setReady] = useState(false);
  const [session, setSession] = useState(null);
  const [tenders, setTenders] = useState(null);
  const [view, setView] = useState({ type: "dashboard" });
  const [search, setSearch] = useState("");
  const [toastMsg, setToastMsg] = useState(null);
  const [toastType, setToastType] = useState("info");
  const [seedBusy, setSeedBusy] = useState(false);
  const toastTimer = useRef(null);

  const toast = useCallback((msg, type = "info") => {
    setToastMsg(msg); setToastType(type);
    if (toastTimer.current) clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToastMsg(null), 3500);
  }, []);

  useEffect(() => {
    let sub;
    (async () => {
      await waitForSupabase();
      const s = await api.getSession();
      setSession(s); setReady(true);
      const { data } = api.onAuthChange((_e, sess) => { setSession(sess); if (!sess) { setTenders(null); setView({ type: "dashboard" }); } });
      sub = data?.subscription;
    })();
    return () => sub?.unsubscribe?.();
  }, []);

  const currentEmail = session?.user?.email || null;

  const loadAll = useCallback(async () => {
    try { const list = await api.loadAll(); setTenders(list); }
    catch (e) { toast("ვერ ჩაიტვირთა: " + e.message, "error"); setTenders([]); }
  }, [toast]);

  useEffect(() => { if (session) loadAll(); }, [session, loadAll]);

  const updateTender = useCallback(async (t) => {
    const saved = await api.updateTender(t.id, t, currentEmail);
    setTenders(prev => prev.map(x => x.id === t.id ? { ...saved, deliveries: x.deliveries, files: x.files } : x));
    return saved;
  }, [currentEmail]);

  const deleteTender = useCallback(async (id) => {
    try { await api.deleteTender(id); setTenders(prev => prev.filter(t => t.id !== id)); setView({ type: "dashboard" }); toast("ტენდერი წაიშალა", "success"); }
    catch (e) { toast("ვერ წაიშალა: " + e.message, "error"); }
  }, [toast]);

  const addTender = useCallback(async () => {
    try {
      const created = await api.createTender({ name: "ახალი ტენდერი", code: "", date: new Date().toISOString(), address: "", notes: "", tenderAmount: 0, bidPrice: 0, bidStep: 0, items: [] }, currentEmail);
      setTenders(prev => [{ ...created, deliveries: [], files: [] }, ...(prev || [])]);
      setView({ type: "tender", id: created.id });
    } catch (e) { toast("ვერ შეიქმნა: " + e.message, "error"); }
  }, [currentEmail, toast]);

  const updateDelivery = useCallback(async (d) => {
    const saved = await api.updateDelivery(d.id, d, currentEmail);
    setTenders(prev => prev.map(t => {
      if (t.id !== saved.tenderId) return t;
      return { ...t, deliveries: t.deliveries.map(x => x.id === saved.id ? { ...saved, files: x.files } : x) };
    }));
    return saved;
  }, [currentEmail]);

  const deleteDelivery = useCallback(async (id) => {
    try {
      await api.deleteDelivery(id);
      let parentTenderId = null;
      setTenders(prev => prev.map(t => {
        if (!t.deliveries?.find(d => d.id === id)) return t;
        parentTenderId = t.id;
        return { ...t, deliveries: t.deliveries.filter(d => d.id !== id) };
      }));
      setView({ type: "tender", id: parentTenderId });
      toast("მიწოდება წაიშალა", "success");
    } catch (e) { toast("ვერ წაიშალა: " + e.message, "error"); }
  }, [toast]);

  const addDeliveryToTender = useCallback(async (tenderId) => {
    try {
      const created = await api.createDelivery({
        tenderId,
        deliveredAt: new Date().toISOString().slice(0, 10),
        notes: "",
        items: [],
      }, currentEmail);
      setTenders(prev => prev.map(t => t.id === tenderId ? { ...t, deliveries: [{ ...created, files: [] }, ...(t.deliveries || [])] } : t));
      setView({ type: "delivery", tenderId, id: created.id });
    } catch (e) { toast("ვერ შეიქმნა: " + e.message, "error"); }
  }, [currentEmail, toast]);

  const fileUpload = useCallback(async ({ tenderId, deliveryId, kind, file }) => {
    return await api.uploadFile({ tenderId: tenderId || (view.type === "delivery" ? view.tenderId : null), deliveryId, kind, file, email: currentEmail });
  }, [currentEmail, view]);

  const fileDelete = useCallback(async (file) => {
    await api.deleteFile(file);
    setTenders(prev => prev.map(t => ({
      ...t,
      files: (t.files || []).filter(f => f.id !== file.id),
      deliveries: (t.deliveries || []).map(d => ({ ...d, files: (d.files || []).filter(f => f.id !== file.id) })),
    })));
  }, []);

  const fileView = useCallback(async (f) => {
    try { const url = await api.fileSignedUrl(f.path); window.open(url, "_blank"); }
    catch (e) { toast("ვერ გავხსენი: " + e.message, "error"); }
  }, [toast]);

  const handleSeed = useCallback(async () => {
    setSeedBusy(true);
    try { const n = await api.seed(SEED, currentEmail); toast(`ჩაიტვირთა ${n} ტენდერი`, "success"); await loadAll(); }
    catch (e) { toast("ვერ ჩაიტვირთა: " + e.message, "error"); }
    setSeedBusy(false);
  }, [currentEmail, loadAll, toast]);

  const exportCSV = useCallback(() => {
    if (!tenders) return;
    const rows = [["ტენდერი", "კოდი", "მიწოდების თარიღი", "პროდუქტი", "ერთეული", "რაოდ.", "გაყიდვა", "თვითღირ.", "შემოსავალი", "ხარჯი", "მოგება", "მარჟა%"]];
    for (const t of tenders) {
      for (const d of t.deliveries || []) {
        for (const it of d.items || []) {
          const c = calcDeliveryItem(it);
          rows.push([t.name, t.code || "", d.deliveredAt || "", it.name, it.unit, it.qty, it.salePrice, it.costPrice, c.rev.toFixed(2), c.cost.toFixed(2), c.profit.toFixed(2), c.margin.toFixed(1)]);
        }
      }
    }
    const csv = "\uFEFF" + rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = `ramimpex_${new Date().toISOString().slice(0,10)}.csv`; a.click();
    URL.revokeObjectURL(url);
  }, [tenders]);

  if (!ready) return <div className="min-h-screen flex items-center justify-center text-stone-500 text-sm gap-2"><Spinner /> ვამოწმებ ავტორიზაციას…</div>;
  if (!session) return <><Login onSignedIn={() => {}} toast={toast} /><Toast message={toastMsg} type={toastType} /></>;
  if (tenders === null) return <div className="min-h-screen flex items-center justify-center text-stone-500 text-sm gap-2"><Spinner /> იტვირთება…</div>;

  if (tenders.length === 0) {
    return (
      <div className="min-h-screen bg-stone-50">
        <header className="bg-white border-b border-stone-200">
          <div className="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
            <div className="flex items-center gap-2">
              <img src={LOGO} alt="RAM IMPEX" className="w-9 h-9" />
              <div><div className="font-display font-bold text-base leading-none">RamImpex</div><div className="text-[10px] text-stone-500">{currentEmail}</div></div>
            </div>
            <button onClick={() => api.signOut()} className="p-2 text-stone-600 hover:text-stone-900 rounded-lg" title="გასვლა">{I.logout}</button>
          </div>
        </header>
        <div className="max-w-5xl mx-auto px-4"><SeedPrompt onSeed={handleSeed} onSkip={() => setTenders([])} busy={seedBusy} /></div>
        <Toast message={toastMsg} type={toastType} />
      </div>
    );
  }

  let content;
  if (view.type === "tender") {
    const t = tenders.find(x => x.id === view.id);
    content = t ? (
      <TenderDetail
        tender={t}
        save={updateTender}
        onDelete={deleteTender}
        back={() => setView({ type: "dashboard" })}
        toast={toast}
        onFileUpload={fileUpload}
        onFileDelete={fileDelete}
        onFileView={fileView}
        openDelivery={(did) => setView({ type: "delivery", tenderId: t.id, id: did })}
        addDelivery={() => addDeliveryToTender(t.id)}
      />
    ) : <div className="text-center py-12 text-stone-500">ტენდერი ვერ მოიძებნა. <button onClick={() => setView({ type: "dashboard" })} className="underline">მთავარზე</button></div>;
  } else if (view.type === "delivery") {
    const t = tenders.find(x => x.id === view.tenderId);
    const d = t?.deliveries?.find(x => x.id === view.id);
    content = d ? (
      <DeliveryDetail
        delivery={d}
        tender={t}
        save={updateDelivery}
        onDelete={deleteDelivery}
        back={() => setView({ type: "tender", id: view.tenderId })}
        toast={toast}
        onFileUpload={fileUpload}
        onFileDelete={fileDelete}
        onFileView={fileView}
      />
    ) : <div className="text-center py-12 text-stone-500">მიწოდება ვერ მოიძებნა. <button onClick={() => setView({ type: "dashboard" })} className="underline">მთავარზე</button></div>;
  } else if (view.type === "users") {
    if (!isAdmin(currentEmail)) {
      content = <div className="text-center py-12 text-stone-500">წვდომა არ გაქვს. <button onClick={() => setView({ type: "dashboard" })} className="underline">მთავარზე</button></div>;
    } else {
      content = <UserManagement back={() => setView({ type: "dashboard" })} currentEmail={currentEmail} toast={toast} />;
    }
  } else {
    content = <Dashboard tenders={tenders} search={search} setSearch={setSearch} openTender={(id) => setView({ type: "tender", id })} addTender={addTender} />;
  }

  return (
    <div className="min-h-screen bg-stone-50 text-stone-900">
      <header className="sticky top-0 z-10 bg-white/95 backdrop-blur border-b border-stone-200">
        <div className="max-w-5xl mx-auto px-3 sm:px-6 py-3 flex items-center justify-between gap-3">
          <button onClick={() => { setView({ type: "dashboard" }); setSearch(""); }} className="flex items-center gap-2">
            <img src={LOGO} alt="RAM IMPEX" className="w-9 h-9" />
            <div className="text-left">
              <div className="font-display text-base sm:text-lg font-bold leading-none flex items-center gap-1.5">
                RamImpex
                <span className="text-[9px] font-mono px-1.5 py-0.5 bg-emerald-100 text-emerald-800 rounded">v9</span>
              </div>
              <div className="text-[10px] text-stone-500 leading-tight">{currentEmail}</div>
            </div>
          </button>
          <div className="flex items-center gap-1 sm:gap-2">
            <a href="../" className="p-2 text-stone-600 hover:text-stone-900 hover:bg-stone-100 rounded-lg inline-flex" title="მთავარ საიტზე">{I.home}</a>
            {isAdmin(currentEmail) && <button onClick={() => setView({ type: "users" })} className="p-2 text-stone-600 hover:text-stone-900 hover:bg-stone-100 rounded-lg" title="იუზერები">{I.user}</button>}
            <button onClick={exportCSV} className="p-2 text-stone-600 hover:text-stone-900 hover:bg-stone-100 rounded-lg" title="CSV">{I.download}</button>
            <button onClick={loadAll} className="p-2 text-stone-600 hover:text-stone-900 hover:bg-stone-100 rounded-lg" title="განახლება">{I.refresh}</button>
            <button onClick={() => api.signOut()} className="p-2 text-stone-600 hover:text-stone-900 hover:bg-stone-100 rounded-lg" title="გასვლა">{I.logout}</button>
          </div>
        </div>
      </header>
      <main className="max-w-5xl mx-auto px-3 sm:px-6 py-4 sm:py-6 pb-24">{content}</main>
      <Toast message={toastMsg} type={toastType} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
