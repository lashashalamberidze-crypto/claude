let DIRS=null, curGid=null, saveTimer=null;
const PLABEL={usdRub:'1 USD = ₽',usdGel:'USD → ₾',transpUsd:'ტრანსპ. სულ ($)',container:'კონტეინერი (ცალი)',setkaRub:'სეტკა (₽)',vat:'დღგ',profit:'მოგება',step:'დამრგვ. ბიჯი'};
const PORDER=['usdRub','usdGel','transpUsd','container','setkaRub','vat','profit','step'];
function calcRow(d,it){
  const p=d.params;let box,setka,transp;
  // ტრანსპ. 1 ცალზე = ტრანსპ.სულ ÷ ინდივიდუალური ტევადობა (it.cap); თუ ცარიელია — ნაგულისხმევი p.container
  const perCont=(it.cap!=null&&it.cap!==''&&+it.cap>0)?+it.cap:p.container;
  if(it.setkaOnly){box=0;setka=(+it.rub||0)/p.usdRub;transp=0;}
  else{box=(+it.rub||0)/p.usdRub;setka=d.hasSetka?(p.setkaRub/p.usdRub):0;transp=perCont?p.transpUsd/perCont:0;}
  const sub=box+setka+transp,vat=sub*p.vat,profit=(sub+vat)*p.profit,totUsd=sub+vat+profit,totGel=totUsd*p.usdGel;
  const price=Math.ceil(totGel/p.step-1e-9)*p.step;
  return {box,setka,transp,vat,profit,totUsd,totGel,price:Math.round(price*100)/100};
}
function effective(d,it){if(it.pfinal!=null&&it.pfinal!==''&&!isNaN(+it.pfinal))return Math.round((+it.pfinal)*100)/100;return calcRow(d,it).price;}
function byCode(c){for(const d of DIRS){for(const it of d.items){if(it.code===c)return {code:c,name:it.name,size:it.size,color:it.color,mark:it.mark,ply:it.ply||'',dir:d.dir,group:d.name,price:effective(d,it)};}}return null;}

function itmBox(l){if(!l)return true;const c=l.cat||'';if(c==='კუთხოვანი დამცავები'||c==='ანთრაციტის ბრიკეტი')return false;if(l.code){const p=byCode(l.code);if(p&&p.dir&&p.dir!=='მუყაოს ყუთები')return false;}return true;}

async function ensureDirs(){
  if(DIRS)return true;
  const {data,error}=await sb.from('catalog').select('dirs').eq('id','main').maybeSingle();
  if(error)throw error;
  // STORED data is the source of truth — ALL edits (names, sizes, prices, added/removed items) persist.
  // We only: (1) add SEED groups that don't exist yet, (2) drop stale groups (fixes duplicates).
  const stored=(data&&data.dirs)||[];
  const byId={}, byName={};
  stored.forEach(g=>{if(!g)return; if(g.id&&!byId[g.id])byId[g.id]=g; if(g.name&&!byName[g.name])byName[g.name]=g;});
  const used=new Set(); const result=[];
  SEED.forEach(sg=>{
    let st=(byId[sg.id]&&!used.has(byId[sg.id]))?byId[sg.id]:((byName[sg.name]&&!used.has(byName[sg.name]))?byName[sg.name]:null);
    if(st){
      used.add(st);
      st.id=sg.id;                 // normalize id (stable)
      if(!st.dir)st.dir=sg.dir;
      if(!st.params)st.params=JSON.parse(JSON.stringify(sg.params));
      if(!st.name)st.name=sg.name;
      result.push(st);
    }else{
      result.push(JSON.parse(JSON.stringify(sg)));
    }
  });
  DIRS=result;
  await sb.from('catalog').upsert({id:'main',dirs:DIRS,updated_at:new Date().toISOString()},{onConflict:'id'});
  return true;
}

function renderInvLines(){
  const tb=$('iRows');$('iEmpty').style.display=invDraft.length?'none':'block';$('iTbl').style.display=invDraft.length?'':'none';
  tb.innerHTML=invDraft.map((l,i)=>{const p=byCode(l.code)||{};return '<tr><td><b>'+esc(ruCode(l.code))+'</b></td><td>'+esc(l.name||p.name||'')+(p.color?' <span class="muted">· '+esc(p.color)+'</span>':'')+'</td><td>'+esc(l.size||p.size||'')+'</td>'+
    '<td>'+(itmBox(l)?'<input value="'+esc(l.ply||'')+'" placeholder="შრე" style="width:64px" data-ply="'+i+'">':'<span class="muted">—</span>')+'</td>'+
    '<td><select data-brand="'+i+'" style="padding:5px 6px"><option value=""'+(!l.brand?' selected':'')+'>—</option><option value="კი"'+(l.brand==='კი'?' selected':'')+'>კი</option><option value="არა"'+(l.brand==='არა'?' selected':'')+'>არა</option></select></td>'+
    '<td class="right"><input type="number" step="0.01" value="'+l.price+'" style="width:80px;text-align:right;background:#fffbea" data-p="'+i+'"></td>'+
    '<td class="right"><input type="number" min="1" value="'+l.qty+'" style="width:96px;min-width:96px;text-align:right" data-q="'+i+'"></td>'+
    '<td class="right sum">'+money(l.price*l.qty)+'</td><td class="right"><button class="btn danger sm" data-x="'+i+'">✕</button></td></tr>';}).join('');
  tb.querySelectorAll('input[data-ply]').forEach(inp=>inp.oninput=()=>{invDraft[+inp.dataset.ply].ply=inp.value;});
  tb.querySelectorAll('select[data-brand]').forEach(s=>s.onchange=()=>{invDraft[+s.dataset.brand].brand=s.value;});
  tb.querySelectorAll('input[data-q]').forEach(inp=>inp.oninput=()=>{const i=+inp.dataset.q;invDraft[i].qty=parseInt(inp.value)||0;updInvRow(i,inp);});
  tb.querySelectorAll('input[data-q]').forEach(inp=>inp.onblur=()=>{const i=+inp.dataset.q;if(!(parseInt(inp.value)>0)){invDraft[i].qty=1;inp.value=1;updInvRow(i,inp);}});
  tb.querySelectorAll('input[data-p]').forEach(inp=>inp.oninput=()=>{const i=+inp.dataset.p;invDraft[i].price=parseFloat(inp.value)||0;updInvRow(i,inp);});
  tb.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{invDraft.splice(+b.dataset.x,1);renderInvLines();});
  updInvTotals();
}
function updInvTotals(){const t=invTotals();$('tSub').textContent=money(t.sub)+' ₾';$('tVat').textContent=money(t.vat)+' ₾';$('tGrand').textContent=money(t.grand)+' ₾';}
function updInvRow(i,inp){const l=invDraft[i];const tr=inp.closest('tr');if(tr){const s=tr.querySelector('.sum');if(s)s.textContent=money(l.price*l.qty);}updInvTotals();}
function currentInv(){const t=invTotals();return {no:$('iNo').value,date:$('iDate').value||todayStr(),cust:$('iCust').value,idc:$('iId').value,phone:($('iPhone')?$('iPhone').value:''),
  lines:invDraft.map(l=>{const p=byCode(l.code)||{};return {code:l.code,name:l.name||p.name,size:l.size||p.size,ply:l.ply||'',brand:l.brand||'',color:p.color,price:l.price,qty:l.qty};}),
  sub:t.sub,vat:t.vat,extra:{brandAmt:t.brandAmt,transAmt:t.transAmt},grand:t.grand};}
async function saveInvoice(){if(!invDraft.length){alert('ჯერ დაამატე პროდუქტი');return;}const inv=currentInv();
  const isEdit=!!editingInvId; inv.id=editingInvId||String(Date.now());
  try{const {error}=await sb.from('invoices').upsert(inv,{onConflict:'id'});if(error)throw error;
    INVOICES=INVOICES.filter(x=>String(x.id)!==String(inv.id));
    INVOICES.unshift(Object.assign({created_at:new Date().toISOString()},inv));
    alert((isEdit?'განახლდა ✔':'შენახულია ✔')+'  სულ: '+money(inv.grand)+' ₾');
    invDraft=[];editingInvId=null;const eb=$('editBanner');if(eb)eb.style.display='none';
    ['iCust','iId','iPhone','iNo','brandAmt','transAmt'].forEach(id=>{if($(id))$(id).value='';});renderInvLines();renderInvList();}
  catch(e){alert('ვერ შეინახა: '+(e.message||e)+'\n(გაუშვი RamImpex_invoices_table.sql)');}
}
function renderInvList(){const host=$('iList');if(!host)return;if(!INVOICES.length){host.innerHTML='<div class="empty" style="padding:16px">ჯერ ინვოისი არ არის.</div>';return;}
  host.innerHTML='<div class="scroll"><table><thead><tr><th>№</th><th>თარიღი</th><th>მყიდველი</th><th class="right">სულ ₾</th><th></th></tr></thead><tbody>'+
   INVOICES.map(inv=>'<tr><td><b>'+esc(inv.no||'—')+'</b></td><td>'+esc(inv.date||'')+'</td><td>'+esc(inv.cust||'—')+'</td><td class="right">'+money(inv.grand)+'</td><td class="right" style="white-space:nowrap"><button class="btn sm" data-ed="'+esc(inv.id)+'">✏ რედაქტ.</button> <button class="btn line sm" data-rp="'+esc(inv.id)+'">🖨</button> <button class="btn danger sm" data-del="'+esc(inv.id)+'">🗑</button></td></tr>').join('')+
   '</tbody></table></div>';
  host.querySelectorAll('[data-rp]').forEach(b=>b.onclick=()=>{const inv=INVOICES.find(x=>String(x.id)===b.dataset.rp);if(inv)printInvoice(inv);});
  host.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>{const inv=INVOICES.find(x=>String(x.id)===b.dataset.ed);if(inv)editInvoice(inv);});
  host.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>deleteInvoice(b.dataset.del));
}
async function deleteInvoice(id){
  const inv=INVOICES.find(x=>String(x.id)===String(id));if(!inv)return;
  if(!confirm('წავშალო ინვოისი № '+(inv.no||inv.id)+'?\nეს მოქმედება შეუქცევადია.'))return;
  try{const {error}=await sb.from('invoices').delete().eq('id',inv.id);if(error)throw error;
    INVOICES=INVOICES.filter(x=>String(x.id)!==String(id));
    if(String(editingInvId)===String(id)){editingInvId=null;invDraft=[];const eb=$('editBanner');if(eb)eb.style.display='none';renderInvLines();}
    renderInvList();
  }catch(e){alert('ვერ წაიშალა: '+(e.message||e));}
}
function printInvoice(inv){
  $('printArea').innerHTML=invoiceHTML(inv);
  const fname=((inv&&inv.no)?(''+inv.no):'ინვოისი').replace(/[\\/:*?"<>|]/g,'-').trim();
  const prev=document.title;
  document.title=fname;
  const restore=()=>{document.title=prev;window.removeEventListener('afterprint',restore);};
  window.addEventListener('afterprint',restore);
  window.print();
}

  return '<div style="max-width:720px;margin:0 auto;color:#14261C;padding:20px;font-family:system-ui,\'Noto Sans Georgian\',sans-serif">'+

   '<div style="text-align:right"><div style="font-size:22px;font-weight:800;color:#0B6B3C">ინვოისი</div><div>№ <b>'+esc(inv.no||"—")+'</b></div><div>თარიღი: '+esc(inv.date||"")+'</div></div></div>'+
   '<div style="margin-bottom:12px;font-size:13px">მყიდველი: <b>'+esc(inv.cust||"—")+'</b>'+(inv.idc?' · ს/კ: '+esc(inv.idc):'')+(inv.phone?' · 📞 '+esc(inv.phone):'')+'</div>'+
   '<table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr style="background:#0F8A4D;color:#fff"><th style="padding:7px">№</th><th style="padding:7px;text-align:left">კოდი</th><th style="padding:7px;text-align:left">დასახელება</th><th style="padding:7px;text-align:left">ზომა</th><th style="padding:7px;text-align:right">ფასი</th><th style="padding:7px;text-align:right">რაოდ.</th><th style="padding:7px;text-align:right">ჯამი</th></tr></thead><tbody>'+rows+'</tbody></table>'+
   '<div style="max-width:300px;margin-left:auto;margin-top:14px;font-size:14px">'+
   '<div style="display:flex;justify-content:space-between;padding:4px 0"><span>ქვეჯამი (დღგ-ით)</span><b>'+money(inv.sub)+' ₾</b></div>'+
   '<div style="display:flex;justify-content:space-between;padding:4px 0;color:#5C6B62;font-size:12px"><span>მ.შ. დღგ 18%</span><span>'+money(inv.vat)+' ₾</span></div>'+
   (ex.brandAmt?'<div style="display:flex;justify-content:space-between;padding:4px 0"><span>ბრენდირება</span><b>'+money(ex.brandAmt)+' ₾</b></div>':'')+
   (ex.transAmt?'<div style="display:flex;justify-content:space-between;padding:4px 0"><span>ტრანსპ. თბილისამდე</span><b>'+money(ex.transAmt)+' ₾</b></div>':'')+
   '<div style="display:flex;justify-content:space-between;padding:10px 0;border-top:2px solid #0F8A4D;margin-top:6px;font-size:18px;font-weight:800;color:#0B6B3C"><span>სულ</span><span>'+money(inv.grand)+' ₾</span></div></div>'+
   '<div style="margin-top:18px;border-top:1px solid #DCE7E0;padding-top:10px;font-size:11.5px"><b style="color:#0B6B3C">საბანკო რეკვიზიტები</b><br>მიმღები: შპს „რამ იმპექს" · ს/კ: 405565794<br>ბანკი: სს „საქართველოს ბანკი" · SWIFT: BAGAGE22<br>ანგარიში (IBAN): <b>GE47BG0000000611211417</b></div>'+
   '<div style="margin-top:12px;background:#E3F1E8;border-radius:8px;padding:9px 12px;font-size:11.5px;color:#0b6b3c;font-weight:600">✔ ნებისმიერ რაოდენობაზე მოლაპარაკება · ✔ ადგილზე მიწოდება საქართველოში · ✔ ნებისმიერი ზომის დამზადება</div>'+
   '<div style="margin-top:8px;font-size:11px;color:#5C6B62">ფასები დღგ-ის ჩათვლით. მადლობა თანამშრომლობისთვის!</div></div>';}

loginView();
