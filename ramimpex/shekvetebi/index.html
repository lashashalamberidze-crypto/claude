let DIRS=null, curGid=null, saveTimer=null;
const PLABEL={usdRub:'1 USD = ₽',usdGel:'USD → ₾',transpUsd:'ტრანსპ. სულ ($)',container:'კონტეინერი (ცალი)',setkaRub:'სეტკა (₽)',vat:'დღგ',profit:'მოგება',step:'დამრგვ. ბიჯი'};
const PORDER=['usdRub','usdGel','transpUsd','container','setkaRub','vat','profit','step'];
function calcRow(d,it){
  const p=d.params;let box,setka,transp;
  if(it.setkaOnly){box=0;setka=(+it.rub||0)/p.usdRub;transp=0;}
  else{box=(+it.rub||0)/p.usdRub;setka=d.hasSetka?(p.setkaRub/p.usdRub):0;transp=p.transpUsd/p.container;}
  const sub=box+setka+transp,vat=sub*p.vat,profit=(sub+vat)*p.profit,totUsd=sub+vat+profit,totGel=totUsd*p.usdGel;
  const price=Math.ceil(totGel/p.step-1e-9)*p.step;
  return {box,setka,transp,vat,profit,totUsd,totGel,price:Math.round(price*100)/100};
}
function effective(d,it){if(it.pfinal!=null&&it.pfinal!==''&&!isNaN(+it.pfinal))return Math.round((+it.pfinal)*100)/100;return calcRow(d,it).price;}
function byCode(c){for(const d of DIRS){for(const it of d.items){if(it.code===c)return {code:c,name:it.name,size:it.size,color:it.color,mark:it.mark,dir:d.dir,group:d.name,price:effective(d,it)};}}return null;}
function directions(){const o=[];DIRS.forEach(g=>{if(o.indexOf(g.dir)<0)o.push(g.dir);});return o;}
function curGroup(){return DIRS.find(x=>x.id===curGid)||DIRS[0];}

  flagSaving('💾 ინახება…');
  if(saveTimer)clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{const {error}=await sb.from('catalog').upsert({id:'main',dirs:DIRS,updated_at:new Date().toISOString()},{onConflict:'id'});if(error)throw error;flagSaving('✔ შენახულია');setTimeout(()=>flagSaving(''),1500);}
    catch(e){flagSaving('⚠ ვერ შეინახა');alert('ვერ შეინახა: '+(e.message||e));}
  },600);
}
async function ensureDirs(){
  if(DIRS)return true;
  const {data,error}=await sb.from('catalog').select('dirs').eq('id','main').maybeSingle();
  if(error)throw error;
  if(data&&data.dirs){DIRS=data.dirs;}
  else{DIRS=JSON.parse(JSON.stringify(SEED));await sb.from('catalog').upsert({id:'main',dirs:DIRS,updated_at:new Date().toISOString()},{onConflict:'id'});}
  // merge in any SEED groups not yet stored (so newly-added catalog groups appear)
  const have=new Set(DIRS.map(d=>d.id));let added=false;
  SEED.forEach(sg=>{if(!have.has(sg.id)){DIRS.push(JSON.parse(JSON.stringify(sg)));added=true;}});
  if(added){await sb.from('catalog').upsert({id:'main',dirs:DIRS,updated_at:new Date().toISOString()},{onConflict:'id'});}
  return true;
}

        '<td><input value="'+esc(it.color||'')+'" style="width:62px" data-f="color" data-i="'+idx+'"></td>'+
        '<td class="right"><input type="number" step="0.01" value="'+(it.rub!=null?it.rub:'')+'" style="width:72px" data-f="rub" data-i="'+idx+'"></td>'+
        '<td class="right"><input type="number" step="1" placeholder="ცალი" value="'+(it.cap!=null&&it.cap!==''?it.cap:'')+'" style="width:72px" data-f="cap" data-i="'+idx+'"></td>'+
        '<td class="right usdcol">'+c.box.toFixed(4)+'</td>'+(d.hasSetka?'<td class="right usdcol">'+c.setka.toFixed(4)+'</td>':'')+
        '<td class="right usdcol">'+c.transp.toFixed(4)+'</td><td class="right usdcol">'+c.vat.toFixed(4)+'</td><td class="right usdcol">'+c.profit.toFixed(4)+'</td><td class="right usdcol">'+c.totUsd.toFixed(4)+'</td>'+
        '<td class="right">'+c.totGel.toFixed(4)+'</td><td class="right finalcol">'+money(c.price)+'</td>'+
        '<td class="right"><input type="number" step="0.01" placeholder="'+money(c.price)+'" value="'+(it.pfinal!=null&&it.pfinal!==''?it.pfinal:'')+'" style="width:82px" data-f="pfinal" data-i="'+idx+'"></td>'+
        '<td class="right"><button class="btn danger sm" data-del="'+idx+'">✕</button></td></tr>';
    });
    rowsHost.innerHTML=rh||'<tr><td colspan="18" class="empty">ვერ მოიძებნა</td></tr>';
    rowsHost.querySelectorAll('input[data-f]').forEach(inp=>inp.onchange=()=>{const it=d.items[+inp.dataset.i];const f=inp.dataset.f;
      if(f==='rub'){it[f]=inp.value===''?0:(parseFloat(inp.value)||0);}
      else if(f==='pfinal'||f==='cap'){it[f]=inp.value===''?'':(parseFloat(inp.value)||0);if(f==='cap')pushCapacity(it.code,it.cap);}
      else{it[f]=inp.value;}
      saveDirs();paintRows();});
    rowsHost.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(!confirm('წავშალო?'))return;d.items.splice(+b.dataset.del,1);saveDirs();paintRows();});
  }
  $('cq').oninput=paintRows;
  paintRows();
  body.querySelectorAll('input[data-pk]').forEach(inp=>inp.onchange=()=>{d.params[inp.dataset.pk]=parseFloat(inp.value)||0;saveDirs();renderCat();});
  const add=body.querySelector('[data-add]');if(add)add.onclick=()=>{const pre=(d.tag||'X').toUpperCase();let n=1;const has=c=>d.items.some(x=>x.code===c);while(has(pre+(n<10?'0':'')+n))n++;d.items.push({code:pre+(n<10?'0':'')+n,name:'ახალი პროდუქტი',size:'',rub:0});saveDirs();paintRows();};
}
/* public capacity projection (order form reads this; anon-readable table) */
async function pushCapacity(code,cap){try{if(cap===''||cap==null){await sb.from('capacity').delete().eq('code',code);}else{await sb.from('capacity').upsert({code,cap:cap,updated_at:new Date().toISOString()},{onConflict:'code'});}}catch(e){/* table optional */}}

/* ===================== INVOICE ===================== */
let invDraft=[], INVOICES=[];
async function openInvoice(){
  invEl.innerHTML='<div class="empty">იტვირთება…</div>';
  try{await ensureDirs();}catch(e){invEl.innerHTML='<div class="card"><p style="color:#c62828">ვერ ჩაიტვირთა: '+esc(e.message||e)+'</p></div>';return;}
  try{const {data}=await sb.from('invoices').select('*').order('created_at',{ascending:false}).limit(50);INVOICES=data||[];}catch(e){INVOICES=[];}
  renderInvoice();
}
function invPickerOptions(){let h='<option value="">— აირჩიე პროდუქტი —</option>';
  DIRS.forEach(d=>{let inner='';d.items.forEach(it=>{const pr=effective(d,it);inner+='<option value="'+esc(it.code)+'">'+esc(ruCode(it.code))+' · '+esc(it.name||'')+(it.size?' '+esc(it.size):'')+(it.color?' '+esc(it.color):'')+' — '+money(pr)+' ₾</option>';});
    if(inner)h+='<optgroup label="'+esc(d.name)+'">'+inner+'</optgroup>';});
  return h;}
function invTotals(){let sub=0;invDraft.forEach(l=>sub+=l.price*l.qty);const vat=sub-sub/1.18;
  const bAmt=parseFloat(($('brandAmt')||{}).value)||0, tAmt=parseFloat(($('transAmt')||{}).value)||0;
  return {sub,vat,brandAmt:bAmt,transAmt:tAmt,grand:sub+bAmt+tAmt};}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function renderInvoice(){
  invEl.innerHTML=
   '<div class="card"><h2>🧾 ახალი ინვოისი</h2>'+
   '<div class="row"><div><label>ინვოისის №</label><input id="iNo" placeholder="მაგ. 001"></div><div><label>თარიღი</label><input id="iDate" type="date" value="'+todayStr()+'"></div></div>'+
   '<div class="row"><div><label>მყიდველი</label><input id="iCust" placeholder="შპს ..."></div><div><label>ს/კ (არჩ.)</label><input id="iId" placeholder="საიდ. კოდი"></div></div>'+
   '<label style="margin-top:10px">პროდუქტის დამატება</label><div class="row"><div style="flex:3"><select id="iPick">'+invPickerOptions()+'</select></div><div style="flex:0 0 90px;min-width:80px"><input id="iQty" type="number" min="1" value="1"></div><div style="flex:0 0 auto"><button class="btn" id="iAdd" style="margin-top:0">＋ დამატება</button></div></div>'+
   '</div>'+
   '<div class="card"><div class="scroll"><table id="iTbl"><thead><tr><th>კოდი</th><th>დასახელება</th><th>ზომა</th><th class="right">ფასი ₾</th><th class="right">რაოდ.</th><th class="right">ჯამი ₾</th><th></th></tr></thead><tbody id="iRows"></tbody></table></div>'+
   '<div id="iEmpty" class="empty">ჯერ პროდუქტი არ არის დამატებული.</div>'+
   '<div class="row" style="margin-top:10px"><div><label>დამატ. ბრენდირება ₾ (არჩ.)</label><input id="brandAmt" type="number" step="0.01" placeholder="0.00"></div><div><label>ტრანსპ. თბილისამდე ₾ (არჩ.)</label><input id="transAmt" type="number" step="0.01" placeholder="0.00"></div></div>'+
   '<div class="ttl"><div class="tr"><span>ქვეჯამი (დღგ-ით)</span><b id="tSub">0.00 ₾</b></div><div class="tr" style="color:var(--muted);font-size:12px"><span>მ.შ. დღგ 18%</span><span id="tVat">0.00 ₾</span></div><div class="tr grand"><span>სულ</span><span id="tGrand">0.00 ₾</span></div></div>'+
   '<div class="row" style="margin-top:12px"><button class="btn" id="iPrint">🖨 ბეჭდვა / PDF</button><button class="btn line" id="iSave">💾 შენახვა</button><button class="btn danger" id="iClear">🗑 გასუფთავება</button></div></div>'+
   '<div class="card"><h2>📚 ბოლო ინვოისები</h2><div id="iList"></div></div>';
  $('iAdd').onclick=()=>{const code=$('iPick').value;if(!code)return;const p=byCode(code);if(!p)return;const qty=parseInt($('iQty').value)||1;const ex=invDraft.find(l=>l.code===code);if(ex)ex.qty+=qty;else invDraft.push({code,price:p.price,qty});renderInvLines();};
  $('iPrint').onclick=()=>{if(!invDraft.length){alert('ჯერ დაამატე პროდუქტი');return;}$('printArea').innerHTML=invoiceHTML(currentInv());window.print();};
  $('iSave').onclick=saveInvoice;
  $('iClear').onclick=()=>{invDraft=[];['iCust','iId','iNo','brandAmt','transAmt'].forEach(id=>{if($(id))$(id).value='';});renderInvLines();};
  ['brandAmt','transAmt'].forEach(id=>$(id).oninput=renderInvLines);
  renderInvLines();renderInvList();
}
function renderInvLines(){
  const tb=$('iRows');$('iEmpty').style.display=invDraft.length?'none':'block';$('iTbl').style.display=invDraft.length?'':'none';
  tb.innerHTML=invDraft.map((l,i)=>{const p=byCode(l.code)||{};return '<tr><td><b>'+esc(ruCode(l.code))+'</b></td><td>'+esc(p.name||'')+(p.color?' <span class="muted">· '+esc(p.color)+'</span>':'')+'</td><td>'+esc(p.size||'')+'</td>'+
    '<td class="right"><input type="number" step="0.01" value="'+l.price+'" style="width:80px;text-align:right;background:#fffbea" data-p="'+i+'"></td>'+
    '<td class="right"><input type="number" min="1" value="'+l.qty+'" style="width:64px;text-align:right" data-q="'+i+'"></td>'+
    '<td class="right">'+money(l.price*l.qty)+'</td><td class="right"><button class="btn danger sm" data-x="'+i+'">✕</button></td></tr>';}).join('');
  tb.querySelectorAll('input[data-q]').forEach(inp=>inp.oninput=()=>{invDraft[+inp.dataset.q].qty=parseInt(inp.value)||1;renderInvLines();});
  tb.querySelectorAll('input[data-p]').forEach(inp=>inp.oninput=()=>{invDraft[+inp.dataset.p].price=parseFloat(inp.value)||0;renderInvLines();});
  tb.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{invDraft.splice(+b.dataset.x,1);renderInvLines();});
  const t=invTotals();$('tSub').textContent=money(t.sub)+' ₾';$('tVat').textContent=money(t.vat)+' ₾';$('tGrand').textContent=money(t.grand)+' ₾';
}
function currentInv(){const t=invTotals();return {no:$('iNo').value,date:$('iDate').value||todayStr(),cust:$('iCust').value,idc:$('iId').value,
  lines:invDraft.map(l=>{const p=byCode(l.code)||{};return {code:l.code,name:p.name,size:p.size,color:p.color,price:l.price,qty:l.qty};}),
  sub:t.sub,vat:t.vat,extra:{brandAmt:t.brandAmt,transAmt:t.transAmt},grand:t.grand};}
async function saveInvoice(){if(!invDraft.length){alert('ჯერ დაამატე პროდუქტი');return;}const inv=currentInv();inv.id=String(Date.now());
  try{const {error}=await sb.from('invoices').upsert(inv,{onConflict:'id'});if(error)throw error;INVOICES.unshift(Object.assign({created_at:new Date().toISOString()},inv));alert('შენახულია ✔  სულ: '+money(inv.grand)+' ₾');invDraft=[];['iCust','iId','iNo','brandAmt','transAmt'].forEach(id=>{if($(id))$(id).value='';});renderInvLines();renderInvList();}
  catch(e){alert('ვერ შეინახა: '+(e.message||e)+'\n(გაუშვი RamImpex_invoices_table.sql)');}
}
function renderInvList(){const host=$('iList');if(!host)return;if(!INVOICES.length){host.innerHTML='<div class="empty" style="padding:16px">ჯერ ინვოისი არ არის.</div>';return;}

   INVOICES.map(inv=>'<tr><td><b>'+esc(inv.no||'—')+'</b></td><td>'+esc(inv.date||'')+'</td><td>'+esc(inv.cust||'—')+'</td><td class="right">'+money(inv.grand)+'</td><td class="right"><button class="btn line sm" data-rp="'+esc(inv.id)+'">🖨</button></td></tr>').join('')+
   '</tbody></table></div>';

}
