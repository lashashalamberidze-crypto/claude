async function saveSale(){
  const cust=$('sfCust').value.trim();if(!cust){alert('შეავსე მყიდველი');return;}
  const sp=splitTier($('sfProd').value),code=sp.code,pr=byCode(code)||{};
  const pname=(pr.name||'')+(sp.tier?' — '+briketTierLabel(sp.tier):'');
  const qty=+$('sfQty').value||0,price=+$('sfPrice').value||0,total=qty*price,paid=+$('sfPaid').value||0;
  const status=(total>0&&paid>=total)?'paid':(paid>0?'part':'due');
  const id=editingSaleId||String(Date.now());
  const btn=$('sfSave'),msg=$('sfMsg');btn.disabled=true;btn.textContent='⏳ ინახება…';msg.textContent='';
  const cur=editingSaleId?(SALES.find(x=>String(x.id)===String(editingSaleId))||{}):{};
  const docs=Object.assign({},cur.docs||{});
  try{
    const inps=salEl.querySelectorAll('input[type=file][data-doc]');
    for(const inp of inps){const f=inp.files&&inp.files[0];if(!f)continue;const t=inp.dataset.doc;const path=id+'/'+t+'-'+Date.now()+'-'+f.name.replace(/[^\\w.\\-]/g,'_');
      const up=await sb.storage.from('sale-docs').upload(path,f,{upsert:true});if(up.error)throw up.error;
      const pu=sb.storage.from('sale-docs').getPublicUrl(path);docs[t]=pu.data.publicUrl;}
    const row={id:id,date:$('sfDate').value||todayStr(),cust_name:cust,cust_id:$('sfId').value.trim(),cust_phone:$('sfPhone').value.trim(),direction:pr.dir||'',code:code,name:pname||pr.name||'',qty:qty,unit:$('sfUnit').value,price:price,total:total,paid:paid,status:status,note:$('sfNote').value.trim(),docs:docs};
    const {error}=await sb.from('sales').upsert(row,{onConflict:'id'});if(error)throw error;
    editingSaleId=null;openSales();
  }catch(e){msg.innerHTML='<span style="color:#c62828">ვერ შეინახა: '+esc(e.message||e)+'</span>';btn.disabled=false;btn.textContent='💾 შენახვა';}

function zaprosText(o){let t='Запрос цен — RAM IMPEX\nПрошу указать цену (₽) по позициям:\n\n';(o.items||[]).forEach((it,i)=>{const name=it.name?(NAME_RU[it.name]||tr(it.name)):'';const parts=[ruCode(it.code)];if(name)parts.push(name);if(it.size)parts.push(tr(it.size));if(it.type)parts.push(it.type);t+=(i+1)+'. '+parts.join(' · ')+(it.qty?'  — Кол-во: '+tr(it.qty):'')+'  — Цена: ______\n';});if(o.req_title||o.req_desc)t+='\nДоп.: '+tr(o.req_title||'')+' '+tr(o.req_desc||'');t+='\n\nСпасибо!';return t;}
function orderCard(o){const isNew=o.status==='new';const isManual=o.status==='manual'||o.source==='manual';
 const items=(o.items||[]).map((it,i)=>{const name=it.name?(NAME_RU[it.name]||it.name):ruCode(it.code);const ex=[];if(it.qty)ex.push('Кол-во: '+tr(it.qty));if(it.brand)ex.push('Брендир.: да');if(it.note)ex.push(tr(it.note));return '<tr><td>'+(i+1)+'</td><td><b>'+esc(ruCode(it.code))+'</b></td><td>'+esc(name)+'</td><td>'+esc(tr(it.size||''))+(it.type?' '+esc(it.type):'')+(it.ply?' · слой '+esc(tr(it.ply)):'')+'</td><td>'+esc(catRu(it.cat))+'</td><td>'+esc(ex.join(' · '))+'</td></tr>';}).join('');
 const imgs=(o.images||[]).map(u=>'<img src="'+u+'" onclick="zoom(this.src)">').join('');
 return '<div class="ord'+(isNew?' new':'')+'"><div class="h"><div><div class="who"><span style="color:#0B6B3C;font-weight:800">№ '+esc(orderNo(o))+'</span> · '+esc(o.cust_name||'—')+' <span class="pill'+(isNew?' new':'')+'" style="'+(isManual?'background:#fff4e0;color:#8a5a00':'')+'">'+(isNew?'ახალი':isManual?'✋ ხელით დამატებული':esc(o.status))+'</span> <span class="pill">'+esc(DIR_RU[o.direction]||o.direction||'')+'</span></div><div class="meta">📞 '+esc(o.cust_phone||'—')+' · ✉ '+esc(o.cust_email||'—')+' · '+esc((o.created_at||'').replace('T',' ').slice(0,16))+'</div></div><div class="acts"><button class="btn sm" data-inv="'+o.id+'" title="ამ შეკვეთიდან ავტომატურად ინვოისის აწყობა">🧾 ინვოისის გენერაცია</button><button class="btn line sm" data-zap="'+o.id+'" title="PDF — არტურასთვის, ПЛ- კოდებით და ცარიელი ფასის სვეტით">📤 არტურას ფასები</button>'+(isNew?'<button class="btn line sm" data-seen="'+o.id+'">✔ ნანახია</button>':'')+'<button class="btn line sm" data-oe="'+o.id+'">✏ რედაქტ.</button><button class="btn danger sm" data-odel="'+o.id+'">🗑</button></div></div>'+(items?'<table><thead><tr><th>#</th><th>Код</th><th>Наимен.</th><th>Размер</th><th>Категория</th><th>Доп.</th></tr></thead><tbody>'+items+'</tbody></table>':'')+(o.req_title||o.req_desc?'<div style="margin-top:8px;font-size:13px"><b>Индив. запрос:</b> '+esc(tr(o.req_title||''))+' '+esc(tr(o.req_desc||''))+'</div>':'')+(imgs?'<div class="imgs">'+imgs+'</div>':'')+'</div>';}
function orderNo(o){return (window.__orderNo&&window.__orderNo[o.id])||'—';}
function renderOrders(){
 const all=window.__orders||[];
 const asc=[...all].sort((a,b)=>String(a.created_at||'').localeCompare(String(b.created_at||'')));
 window.__orderNo={};asc.forEach((o,i)=>{window.__orderNo[o.id]='RI-'+('000'+(i+1)).slice(-4);});
 const data=ORD_DIR==='all'?all:all.filter(o=>(o.direction||'')===ORD_DIR);
 const tabs='<div class="dirtabs">'+ORD_TABS.map(([k,lab])=>{const n=k==='all'?all.length:all.filter(o=>(o.direction||'')===k).length;return '<button class="dirbtn'+(k===ORD_DIR?' on':'')+'" data-od="'+k+'">'+esc(lab)+' · '+n+'</button>';}).join('')+'</div>';
 const nNew=data.filter(o=>o.status==='new').length;
 const head='<div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><b>'+data.length+' შეკვეთა'+(nNew?' · '+nNew+' ახალი':'')+'</b><div style="display:flex;gap:8px"><button class="btn sm" id="addOrder">➕ ხელით შეკვეთის დამატება</button><button class="btn line sm" id="refresh">↻ განახლება</button></div></div>';
 app.innerHTML=tabs+head+'<div id="ordFormWrap"></div>'+(data.length?data.map(orderCard).join(''):'<div class="empty">ამ მიმართულებაზე შეკვეთა ჯერ არ არის.</div>');
 app.querySelectorAll('[data-od]').forEach(b=>b.onclick=()=>{ORD_DIR=b.dataset.od;renderOrders();});
 $('refresh').onclick=loadOrders;
 $('addOrder').onclick=()=>openOrderForm(null);
 app.querySelectorAll('[data-seen]').forEach(b=>b.onclick=async()=>{b.disabled=true;await sb.from('orders').update({status:'seen'}).eq('id',b.dataset.seen);const o=window.__orders.find(x=>String(x.id)===b.dataset.seen);if(o)o.status='seen';renderOrders();});
 app.querySelectorAll('[data-zap]').forEach(b=>b.onclick=()=>{const o=window.__orders.find(x=>String(x.id)===b.dataset.zap);if(o)printZapros(o);else alert('შეკვეთა ვერ მოიძებნა — განაახლე გვერდი.');});
 app.querySelectorAll('[data-inv]').forEach(b=>b.onclick=()=>{const o=window.__orders.find(x=>String(x.id)===b.dataset.inv);if(o)invoiceFromOrder(o);else alert('შეკვეთა ვერ მოიძებნა — განაახლე გვერდი.');});
 app.querySelectorAll('[data-oe]').forEach(b=>b.onclick=()=>{const o=window.__orders.find(x=>String(x.id)===b.dataset.oe);if(o)openOrderForm(o);});
 app.querySelectorAll('[data-odel]').forEach(b=>b.onclick=()=>deleteOrder(b.dataset.odel));
}

async function openOrderForm(o){
  try{await ensureDirs();}catch(e){}
  editingOrderId=o?o.id:null;
  manualItems=o?((o.items||[]).map(it=>({code:it.code||'',name:it.name||'',size:it.size||'',type:it.type||it.mark||'',cat:it.cat||'',qty:parseInt(it.qty)||1,ply:it.ply||''}))):[];
  manualImgs=o?((o.images||[]).slice()):[];

    '<div class="row"><div><label>ელფოსტა (არჩ.)</label><input id="mEmail" value="'+esc(o&&o.cust_email||'')+'" placeholder="—"></div><div><label>მიმართულება</label><select id="mDir">'+ORD_DIRS.map(([k,l])=>'<option value="'+k+'"'+((o&&o.direction===k)?' selected':'')+'>'+esc(l)+'</option>').join('')+'</select></div></div>'+
    '<label style="margin-top:10px">პროდუქტი კატალოგიდან (არჩ.)</label><div class="row"><div style="flex:3"><select id="mPick">'+invPickerOptions()+'</select></div><div style="flex:0 0 74px"><input id="mPly" placeholder="შრე"></div><div style="flex:0 0 84px"><input id="mQty" type="number" min="1" placeholder="რაოდ.*"></div><div style="flex:0 0 auto"><button class="btn sm" id="mAdd" style="margin-top:0">＋</button></div></div>'+
    '<label style="margin-top:10px">ან სპეც-პროდუქტი (კატალოგში არ არის)</label><div class="row"><div style="flex:2"><input id="cName" placeholder="დასახელება (მაგ. გოფროყუთი)"></div><div style="flex:1.2"><input id="cSize" placeholder="ზომა (მაგ. 400×300×200)"></div><div style="flex:0 0 74px"><input id="cPly" placeholder="შრე"></div><div style="flex:0 0 84px"><input id="cQty" type="number" min="1" placeholder="რაოდ.*"></div><div style="flex:0 0 auto"><button class="btn sm" id="cAdd" style="margin-top:0">＋</button></div></div>'+
    '<div id="mItems" style="margin-top:8px"></div>'+
    '<label style="margin-top:10px">კომენტარი / დანიშნულება (რისთვის, ვადა…)</label><textarea id="mNote" rows="2" placeholder="მაგ. „ხილისთვის, თეთრი, ლოგოთი, 2 კვირაში"…">'+esc(o&&(o.req_desc||o.req_title)||'')+'</textarea>'+

    '<div class="row" style="margin-top:12px"><button class="btn" id="mSave">💾 შენახვა</button><button class="btn line" id="mCancel">გაუქმება</button></div></div>';
  $('mAdd').onclick=()=>{const code=$('mPick').value;if(!code){alert('აირჩიე პროდუქტი.');return;}const p=byCode(code);if(!p)return;const qty=parseInt($('mQty').value);if(!(qty>0)){alert('შეიყვანე რაოდენობა — რამდენი ცალი.');$('mQty').focus();return;}const ply=itmBox({code:code,cat:p.group})?($('mPly')?$('mPly').value:''):'';const ex=manualItems.find(x=>x.code===code);if(ex){ex.qty+=qty;if(ply)ex.ply=ply;}else manualItems.push({code,name:p.name,size:p.size,type:p.mark,cat:p.group,qty,ply});$('mQty').value='';if($('mPly'))$('mPly').value='';renderManualItems();};
  $('cAdd').onclick=()=>{const nm=$('cName').value.trim(),sz=$('cSize').value.trim();if(!nm&&!sz){alert('შეავსე დასახელება ან ზომა.');return;}const cq=parseInt($('cQty').value);if(!(cq>0)){alert('შეიყვანე რაოდენობა — რამდენი ცალი.');$('cQty').focus();return;}manualItems.push({code:'',name:nm||'სპეც-პროდუქტი',size:sz,type:'',cat:'სპეც შეკვეთა',qty:cq,ply:($('cPly')?$('cPly').value:'')});$('cName').value='';$('cSize').value='';$('cQty').value='';if($('cPly'))$('cPly').value='';renderManualItems();};
  $('mSave').onclick=saveManualOrder;
  $('mCancel').onclick=()=>{editingOrderId=null;manualItems=[];manualImgs=[];$('ordFormWrap').innerHTML='';};
  renderManualItems();buildManualGal();

function buildManualGal(){const g=$('mGal');if(!g)return;g.innerHTML='';
  manualImgs.forEach((src,i)=>{const d=document.createElement('div');d.style.cssText='position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;border:1px solid var(--line)';
    d.innerHTML='<img src="'+src+'" style="width:100%;height:100%;object-fit:cover"><button class="btn danger sm" data-ix="'+i+'" style="position:absolute;top:2px;right:2px;padding:2px 6px">✕</button>';g.appendChild(d);
    d.querySelector('[data-ix]').onclick=()=>{manualImgs.splice(i,1);buildManualGal();};});
  if(manualImgs.length<12){const d=document.createElement('label');d.style.cssText='width:84px;height:84px;border:1.5px dashed var(--green);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--green);font-size:22px';d.textContent='📷+';
    const fi=document.createElement('input');fi.type='file';fi.accept='image/*';fi.style.display='none';d.appendChild(fi);
    fi.onchange=()=>{const f=fi.files&&fi.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const mx=900,sc=Math.min(1,mx/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*sc;c.height=im.height*sc;c.getContext('2d').drawImage(im,0,0,c.width,c.height);manualImgs.push(c.toDataURL('image/jpeg',0.7));buildManualGal();};im.src=r.result;};r.readAsDataURL(f);};
    g.appendChild(d);}
}
function renderManualItems(){const h=$('mItems');if(!h)return;
  if(!manualItems.length){h.innerHTML='<div class="muted" style="font-size:12px">პროდუქტი ჯერ არ არის (შეგიძლია მხოლოდ კომენტარით დაამატო).</div>';return;}
  h.innerHTML='<div class="muted" style="font-size:11.5px;margin-bottom:4px">✏ დასახელება/ზომა/შრე/რაოდენობა რედაქტირებადია — შეცვალე პირდაპირ.</div><div class="scroll"><table><thead><tr><th>კოდი</th><th>დასახელება</th><th>ზომა</th><th>შრე</th><th class="right">რაოდ.</th><th></th></tr></thead><tbody>'+
    manualItems.map((l,i)=>'<tr><td>'+(l.code?'<b>'+esc(ruCode(l.code))+'</b>':'<span class="muted">—</span>')+'</td><td><input value="'+esc(l.name||'')+'" placeholder="დასახელება" style="min-width:130px" data-mn="'+i+'"></td><td><input value="'+esc(l.size||'')+'" placeholder="ზომა" style="width:110px" data-ms="'+i+'"></td><td>'+(itmBox(l)?'<input value="'+esc(l.ply||'')+'" placeholder="მაგ. 3/5" style="width:70px" data-mp="'+i+'">':'<span class="muted">—</span>')+'</td><td class="right"><input type="number" min="1" value="'+l.qty+'" style="width:84px;text-align:right" data-mq="'+i+'"></td><td class="right"><button class="btn danger sm" data-mx="'+i+'">✕</button></td></tr>').join('')+'</tbody></table></div>';
  h.querySelectorAll('input[data-mn]').forEach(inp=>inp.oninput=()=>{manualItems[+inp.dataset.mn].name=inp.value;});
  h.querySelectorAll('input[data-ms]').forEach(inp=>inp.oninput=()=>{manualItems[+inp.dataset.ms].size=inp.value;});
  h.querySelectorAll('input[data-mp]').forEach(inp=>inp.oninput=()=>{manualItems[+inp.dataset.mp].ply=inp.value;});
  h.querySelectorAll('input[data-mq]').forEach(inp=>inp.oninput=()=>{manualItems[+inp.dataset.mq].qty=parseInt(inp.value)||1;});
  h.querySelectorAll('[data-mx]').forEach(b=>b.onclick=()=>{manualItems.splice(+b.dataset.mx,1);renderManualItems();});
}
async function saveManualOrder(){
  const name=$('mName').value.trim(), phone=$('mPhone').value.trim();
  if(!name||!phone){alert('შეავსე სახელი და ტელეფონი.');return;}
  const note=$('mNote').value.trim();
  if(!manualItems.length && !note){alert('დაამატე პროდუქტი ან კომენტარი.');return;}
  const payload={direction:$('mDir').value,cust_name:name,cust_phone:phone,cust_email:$('mEmail').value.trim()||null,
    items:manualItems.map(x=>({code:x.code,name:x.name,size:x.size,type:x.type,cat:x.cat,qty:x.qty,ply:x.ply||''})),
    images:manualImgs,req_desc:note||null,status:'manual'};
  const btn=$('mSave');btn.disabled=true;btn.textContent='...';
  try{let error,data;
    if(editingOrderId){({data,error}=await sb.from('orders').update(payload).eq('id',editingOrderId).select());}
    else{({data,error}=await sb.from('orders').insert(payload).select());}
    if(error)throw error;
    if(!data||!data.length){btn.disabled=false;btn.textContent='💾 შენახვა';alert('❌ ვერ შეინახა ღრუბელში — ბაზას არ აქვს ჩაწერის უფლება (RLS policy).\nგაუშვი Supabase-ში ქვემოთ მოცემული SQL (RamImpex_orders_admin_policies.sql).');return;}
    editingOrderId=null;manualItems=[];manualImgs=[];
    await loadOrders();
  }catch(e){btn.disabled=false;btn.textContent='💾 შენახვა';alert('ვერ შეინახა: '+(e.message||e));}
}
async function deleteOrder(id){
  const o=window.__orders.find(x=>String(x.id)===String(id));if(!o)return;
  if(!confirm('წავშალო შეკვეთა № '+orderNo(o)+'?\n'+(o.cust_name||'')+' · '+(o.cust_phone||'')+'\nეს შეუქცევადია.'))return;
  try{const {data,error}=await sb.from('orders').delete().eq('id',o.id).select();if(error)throw error;
    if(!data||!data.length){alert('❌ ვერ წაიშალა — ბაზას არ აქვს წაშლის უფლება (RLS policy).\nგაუშვი Supabase-ში:\ncreate policy "auth delete orders" on orders for delete to authenticated using (true);');return;}
    window.__orders=(window.__orders||[]).filter(x=>String(x.id)!==String(id));renderOrders();
  }catch(e){alert('ვერ წაიშალა: '+(e.message||e));}

async function ensureDirs(){
  if(DIRS)return true;
  const {data,error}=await sb.from('catalog').select('dirs').eq('id','main').maybeSingle();
  if(error)throw error;
  // STORED data is the source of truth — ALL edits (names, sizes, prices, added/removed items) persist.
  // We only: (1) add SEED groups that don't exist yet, (2) drop stale groups (fixes duplicates).
  // ერთჯერადი გასუფთავება: ძველი ტორტის ყუთების ვერსია (cakebox, ფასების გარეშე) → ამოვიღოთ, ახალი seed (cakebox2) ჩაჯდეს
  const stored=((data&&data.dirs)||[]).filter(g=>!(g&&g.id==='cakebox'));
  const byId={}, byName={};
  stored.forEach(g=>{if(!g)return; if(g.id&&!byId[g.id])byId[g.id]=g; if(g.name&&!byName[g.name])byName[g.name]=g;});
  const used=new Set(); const result=[];
  SEED.forEach(sg=>{
    let st=(byId[sg.id]&&!used.has(byId[sg.id]))?byId[sg.id]:((byName[sg.name]&&!used.has(byName[sg.name]))?byName[sg.name]:null);
    if(st){
      used.add(st);
      st.id=sg.id;                 // normalize id (stable)
      if(!st.dir)st.dir=sg.dir;
      if(!st.params)st.params=JSON.parse(JSON.stringify(sg.params));
      if(!st.name)st.name=sg.name;
      result.push(st);
    }else{
      result.push(JSON.parse(JSON.stringify(sg)));
    }
  });
  // შევინახოთ ხელით შექმნილი კატეგორიები (SEED-ში რომ არ არის) — მაგრამ დუბლების გარეშე
  const haveName=new Set(result.map(g=>g.name));
  stored.forEach(g=>{if(g&&!used.has(g)&&g.name&&!haveName.has(g.name)){used.add(g);haveName.add(g.name);result.push(g);}});
  DIRS=result;
  await sb.from('catalog').upsert({id:'main',dirs:DIRS,updated_at:new Date().toISOString()},{onConflict:'id'});
  return true;
}

/* ფოტოები + საიტზე გამოჩენა — წერს public product_pub ცხრილში (მომხმარებელი კითხულობს) */
function openProdMedia(d,it,after){
  if(!it)return;const code=it.code;
  let imgs=(PUB[code]&&Array.isArray(PUB[code].images))?PUB[code].images.slice():[];
  const published=!!PUB[code];
  const old=$('pmOvl');if(old)old.remove();
  const ovl=document.createElement('div');ovl.id='pmOvl';
  ovl.style.cssText='position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.5);overflow:auto;padding:20px';
  function draw(){
    ovl.innerHTML='<div style="max-width:580px;margin:30px auto;background:#fff;border-radius:14px;padding:20px">'+
      '<h2 style="margin:0 0 4px">🖼 ფოტოები — '+esc(ruCode(code))+'</h2>'+
      '<div class="muted" style="font-size:12.5px;margin-bottom:10px">'+esc(it.name||'')+' · '+esc(it.size||'')+'</div>'+
      '<label style="display:flex;gap:8px;align-items:center;font-weight:700;margin-bottom:10px"><input type="checkbox" id="pmVis" '+(published?'checked':'')+' style="width:auto"> 🌐 გამოჩნდეს მომხმარებლის საიტზე (შესაკვეთ ფორმაში)</label>'+
      '<div id="pmGal" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"></div>'+
      '<div class="row" style="display:flex;gap:8px;align-items:center"><button class="btn" id="pmSave">💾 შენახვა</button><button class="btn line" id="pmCancel">დახურვა</button>'+(published?'<button class="btn danger" id="pmUnpub" style="margin-left:auto">საიტიდან მოხსნა</button>':'')+'</div>'+
    '</div>';
    const gal=ovl.querySelector('#pmGal');
    imgs.forEach((src,i)=>{const dv=document.createElement('div');dv.style.cssText='position:relative;width:92px;height:92px;border-radius:10px;overflow:hidden;border:1px solid var(--line)';
      dv.innerHTML='<img src="'+src+'" style="width:100%;height:100%;object-fit:cover"><button class="btn danger sm" data-x="'+i+'" style="position:absolute;top:2px;right:2px;padding:2px 6px">✕</button>';gal.appendChild(dv);
      dv.querySelector('[data-x]').onclick=()=>{imgs.splice(i,1);draw();};});
    if(imgs.length<12){const lb=document.createElement('label');lb.style.cssText='width:92px;height:92px;border:1.5px dashed var(--green);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--green);font-size:24px';lb.textContent='📷+';
      const fi=document.createElement('input');fi.type='file';fi.accept='image/*';fi.style.display='none';lb.appendChild(fi);
      fi.onchange=()=>{const f=fi.files&&fi.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const mx=1000,sc=Math.min(1,mx/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*sc;c.height=im.height*sc;c.getContext('2d').drawImage(im,0,0,c.width,c.height);imgs.push(c.toDataURL('image/jpeg',0.72));draw();};im.src=r.result;};r.readAsDataURL(f);};
      gal.appendChild(lb);}
    ovl.querySelector('#pmCancel').onclick=()=>ovl.remove();
    ovl.querySelector('#pmSave').onclick=async()=>{const vis=ovl.querySelector('#pmVis').checked;
      try{
        if(vis){const row={code:code,dir:d.dir,category:d.name,name:it.name||'',size:it.size||'',mark:it.mark||'',ply:it.ply||'',color:it.color||'',cap:(it.cap!=null&&it.cap!==''?it.cap:null),images:imgs,sort:0,updated_at:new Date().toISOString()};
          const {error}=await sb.from('product_pub').upsert(row,{onConflict:'code'});if(error)throw error;PUB[code]=row;}
        else{const {error}=await sb.from('product_pub').delete().eq('code',code);if(error)throw error;delete PUB[code];}
        ovl.remove();if(after)after();
      }catch(e){alert('ვერ შეინახა: '+(e.message||e)+'\n(გაუშვი RamImpex_product_pub.sql)');}
    };
    const up=ovl.querySelector('#pmUnpub');if(up)up.onclick=async()=>{if(!confirm('მოვხსნა საიტიდან?'))return;try{const {error}=await sb.from('product_pub').delete().eq('code',code);if(error)throw error;delete PUB[code];ovl.remove();if(after)after();}catch(e){alert('ვერ მოიხსნა: '+(e.message||e));}};
  }
  document.body.appendChild(ovl);draw();
}

// შენახული ინვოისის ჩატვირთვა რედაქტირებისთვის

  renderInvoice();
  if($('iNo'))$('iNo').value=inv.no||'';
  if($('iDate'))$('iDate').value=inv.date||todayStr();

  if($('iId'))$('iId').value=inv.idc||'';
  if($('iPhone'))$('iPhone').value=inv.phone||'';
  const ex=inv.extra||{};
  if($('brandAmt'))$('brandAmt').value=ex.brandAmt||'';

// შეკვეთიდან ავტომატურად ინვოისის აწყობა
async function invoiceFromOrder(o){
  try{await ensureDirs();}catch(e){alert('კატალოგი ვერ ჩაიტვირთა: '+(e.message||e));return;}
  invVatIncl=false;
  invDraft=(o.items||[]).filter(it=>it&&it.code).map(it=>{const p=byCode(it.code);return {code:it.code,price:(p&&p.price!=null)?p.price:0,qty:parseInt(it.qty)||1,name:it.name||(p&&p.name)||'',size:it.size||(p&&p.size)||'',ply:it.ply||(p&&p.ply)||'',pack:it.pack||'',packSet:!!it.pack,tier:it.tier||0,min:'3000'};});
  // ინვოისის ტაბზე გადასვლა
  $('tabbar').querySelectorAll('.tb').forEach(x=>x.classList.remove('on'));
  const ib=$('tabbar').querySelector('[data-t="invoice"]'); if(ib)ib.classList.add('on');
  app.style.display='none';catEl.style.display='none';bukEl.style.display='none';invEl.style.display='';
  await openInvoice();
  if($('iCust'))$('iCust').value=o.cust_name||'';
  if($('iPhone'))$('iPhone').value=o.cust_phone||'';
  const miss=invDraft.filter(l=>!l.price).length;
  window.scrollTo(0,0);
  if(!invDraft.length){alert('ამ შეკვეთას პროდუქცია არ აქვს (მხოლოდ ტექსტური მოთხოვნაა).');}
  else if(miss){/* silent: some prices 0 until entered */}
}
async function openInvoice(){
  if(!document.getElementById('salCss')){const st=document.createElement('style');st.id='salCss';st.textContent=SAL_CSS;document.head.appendChild(st);}
  invEl.innerHTML='<div class="empty">იტვირთება…</div>';

  if(!Object.keys(PUB).length)await loadPub();
  try{const {data}=await sb.from('invoices').select('*').order('created_at',{ascending:false}).limit(500);INVOICES=data||[];}catch(e){INVOICES=[];}
  renderInvoice();
}

function addToCart(d,it,btn,tier){
  if(!it)return;const brik=(d.dir==='ანთრაციტის ბრიკეტი');
  const pr=(brik&&tier)?briketTierPrice(tier):(brik?briketPrice(1):effective(d,it));
  const ex=invDraft.find(l=>l.code===it.code&&(l.tier||0)===(tier||0));
  if(ex){ex.qty=(parseInt(ex.qty)||0)+1;}
  else{const line={code:it.code,name:it.name||'',size:it.size||'',price:pr,qty:1,min:'3000',ply:(itmBox(it)?(it.ply||''):'')};if(brik&&tier){line.tier=tier;line.pack=briketTierPack(tier);line.packSet=true;}invDraft.push(line);}
  updateCartBar();
  if(btn){const o=btn.textContent;btn.textContent='✓';btn.style.background='#0B6B3C';btn.style.color='#fff';setTimeout(()=>{btn.textContent=o;btn.style.background='';btn.style.color='';},700);}
}
function cartCount(){let n=0;invDraft.forEach(l=>n+=(parseInt(l.qty)||0));return n;}
function updateCartBar(){const n=$('cartN');if(n)n.textContent=invDraft.length;const q=$('cartQ');if(q)q.textContent=cartCount();
  const go=$('cartGo');if(go)go.disabled=!invDraft.length;const clr=$('cartClr');if(clr)clr.style.display=invDraft.length?'':'none';}

    if(inner)h+='<optgroup label="'+esc(d.name)+'">'+inner+'</optgroup>';});

function invTotals(){let sub=0;invDraft.forEach(l=>sub+=l.price*l.qty);const vat=invVatIncl?(sub-sub/1.18):0;

function todayStr(){const d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function invSeqOf(no){const s=(''+(no||''));const last=s.split('-').pop().replace(/\D/g,'');const n=parseInt(last,10);return isNaN(n)?0:n;}
function nextInvSeq(){let mx=0;(INVOICES||[]).forEach(v=>{const n=invSeqOf(v.no);if(n>mx)mx=n;});return mx+1;}
function dirPrefix(dir){if(dir==='ანთრაციტის ბრიკეტი')return 'ANT';if(dir==='კუთხოვანი დამცავები')return 'EDG';if(/პიცის/.test(dir))return 'PIZ';if(/სამედიცინო|Safety/.test(dir))return 'MED';if(dir)return 'BOX';return 'RI';}
function invPrefix(){if(!invDraft.length)return 'RI';const uniq=[];invDraft.forEach(l=>{const p=dirPrefix((byCode(l.code)||{}).dir||'');if(uniq.indexOf(p)<0)uniq.push(p);});return uniq.length===1?uniq[0]:'RI';}

function nextInvNo(){return makeInvNo(invPrefix(),nextInvSeq());}

async function saveInvoice(){if(!invDraft.length){alert('ჯერ დაამატე პროდუქტი');return;}const inv=currentInv();
  const isEdit=!!editingInvId; inv.id=editingInvId||String(Date.now());
  const prev=isEdit?(INVOICES.find(x=>String(x.id)===String(inv.id))||{}):{};
  inv.paid=(prev.paid!=null?prev.paid:0); inv.docs=prev.docs||{};
  inv.status=(+inv.grand>0&&inv.paid>=+inv.grand)?'paid':(inv.paid>0?'part':'due');
  try{const {error}=await sb.from('invoices').upsert(inv,{onConflict:'id'});if(error)throw error;

        const sub=[pizzaShapeWord(l.code,nm),(isBriket(l.code)?'':(l.size||p.size||'')),(isBriket(l.code)&&l.tier?briketTierLabel(l.tier):''),(isBriket(l.code)&&l.pack?l.pack:''),(l.ply?l.ply+' შრე':''),(p.color||''),(l.brand?(l.brand==='კი'?'ბრენდირებით':'ბრენდ. გარეშე'):'')].filter(Boolean).join(' · ');
        ctx.textAlign='left';ctx.fillStyle='#14261C';ctx.font='700 21px '+GEO;
        let nmT=nm;while(ctx.measureText(nmT).width>nameMax&&nmT.length>4)nmT=nmT.slice(0,-2);
        ctx.fillText(nmT+(nmT!==nm?'…':''),148,y+48);
        ctx.fillStyle='#0B6B3C';ctx.font='700 15px '+GEO;ctx.fillText(code,148,y+74);const codeW=ctx.measureText(code).width;
        if(sub){const sx=148+codeW+16;const sMax=(148+nameMax)-sx;ctx.fillStyle='#5C6B62';ctx.font='400 15px '+GEO;let sT=sub;while(ctx.measureText(sT).width>sMax&&sT.length>4)sT=sT.slice(0,-2);ctx.fillText(sT+(sT!==sub?'…':''),sx,y+74);}
        // price
        ctx.textAlign='right';ctx.fillStyle='#0B6B3C';ctx.font='800 26px '+GEO;ctx.fillText(money(l.price)+' ₾',priceR,y+62);
        // min
        ctx.fillStyle='#14261C';ctx.font='600 20px '+GEO;ctx.fillText((l.min||gMin||'—'),minR,y+62);
        // row line
        ctx.strokeStyle='#E4EBE7';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(padX,y+rowH);ctx.lineTo(rightE,y+rowH);ctx.stroke();
      });
      // note
      let yb=rowsY+lines.length*rowH;
      if(note){yb+=24;ctx.textAlign='left';ctx.fillStyle='#6d3ad6';ctx.font='800 18px '+GEO;ctx.fillText('შენიშვნა:',padX,yb+16);
        ctx.fillStyle='#14261C';ctx.font='400 22px '+GEO;noteW.forEach((ln,k)=>ctx.fillText(ln,padX,yb+16+34+k*30));yb+=34+noteW.length*30+18;}
      // footer
      ctx.fillStyle='#0F8A4D';ctx.fillRect(padX,H-footerH+14,innerW,3);
      ctx.textAlign='center';ctx.fillStyle='#5C6B62';ctx.font='600 16px '+GEO;
      ctx.fillText('RAM IMPEX · მუყაოს შესაფუთი და ყუთები · 595 533 500 · ramimpex.com.ge',W/2,H-24);
      return cv;
    }
    let url;
    try{url=paint(true).toDataURL('image/jpeg',0.92);}
    catch(e){url=paint(false).toDataURL('image/jpeg',0.92);}
    const a=document.createElement('a');a.href=url;a.download='RAM_IMPEX_shetavazeba_'+dateStr+'.jpg';document.body.appendChild(a);a.click();a.remove();
  }catch(e){alert('ვერ შეიქმნა JPG: '+(e.message||e));}
  finally{if(btn){btn.textContent=ob;btn.disabled=false;}}
}

async function addDraftToOrders(){
  if(!invDraft.length){alert('ჯერ დაამატე პროდუქტი');return;}
  const name=($('iCust')&&$('iCust').value.trim())||'';

  if(!name){alert('შეავსე მყიდველი (სახელი), მერე დაამატე შეკვეთებში.');return;}
  const note=($('iNote')&&$('iNote').value.trim())||'';

  const first=byCode(invDraft[0].code);const direction=(first&&dirMap[first.dir])||'boxes';

  const payload={direction,cust_name:name,cust_phone:phone||null,cust_email:null,items,images:[],req_desc:note||null,status:'manual'};
  const btn=$('iToOrders');const ob=btn?btn.textContent:'';if(btn){btn.disabled=true;btn.textContent='⏳ ემატება…';}
  try{const {data,error}=await sb.from('orders').insert(payload).select();if(error)throw error;
    if(!data||!data.length){alert('❌ ვერ დაემატა — ბაზას არ აქვს ჩაწერის უფლება (RLS policy).');return;}
    try{await loadOrders();}catch(e){}
    const total=(window.__orders||[]).length;

  }catch(e){alert('ვერ დაემატა: '+(e.message||e));}
  finally{if(btn){btn.disabled=false;btn.textContent=ob;}}
}
