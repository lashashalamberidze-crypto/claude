<style>

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}

.btn{background:var(--green-d);color:#fff;border:none;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}
.btn.sm{padding:6px 11px;font-size:12px}.btn.line{background:#fff;color:var(--green-d);border:1.5px solid var(--green-d)}
.btn.danger{background:#fdecec;color:#c62828;border:none}
.muted{color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:40px}
/* direction filter tabs */
.dirtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.dirbtn{background:#fff;border:1.5px solid var(--line);color:var(--muted);border-radius:22px;padding:8px 16px;font:inherit;font-weight:700;cursor:pointer;font-size:13px}
.dirbtn.on{background:var(--green-d);color:#fff;border-color:var(--green-d)}
.subtabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.subtab{background:#eef7f1;border:1px solid var(--line);color:var(--green-d);border-radius:18px;padding:6px 13px;font:inherit;font-weight:700;cursor:pointer;font-size:12.5px}
.subtab.on{background:var(--green);color:#fff;border-color:var(--green)}
/* orders */
.ord{border:1px solid var(--line);border-left:4px solid var(--green-d);border-radius:12px;padding:14px;margin-bottom:12px}
.ord.new{border-left-color:#E6A200;background:#fffdf5}
.ord .h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.ord .who{font-weight:800;font-size:15px}.ord .meta{font-size:12px;color:var(--muted)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-block;background:#E3F1E8;color:var(--green-d);border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700}
.pill.new{background:#FFF0CC;color:#8a6a00}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid #eef4f0;vertical-align:middle}
th{background:#f2f9f5;color:var(--green-d)}
td.right,th.right{text-align:right}
.imgs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.imgs img{width:90px;height:90px;object-fit:cover;border:1px solid var(--line);border-radius:8px;cursor:zoom-in}
/* finance catalog */
.parambox{background:#f7fbf9}
.parambox .prow{display:flex;gap:12px;flex-wrap:wrap}

.scroll{overflow-x:auto}

#catTbl td{padding:4px 6px;border-bottom:1px solid #eef4f0}
#catTbl input{padding:6px 7px;border:1px solid var(--line);border-radius:7px;font:inherit;font-size:12.5px}
#catTbl input[data-f=rub],#catTbl input[data-f=pfinal]{text-align:right}
.usdcol{background:#eef4fb;color:#25507a}
.finalcol{background:#f2faf5;font-weight:800;color:var(--green-d)}
#catTbl input[data-f=pfinal]{background:#fffbea}
.saveflag{font-size:12px;font-weight:700;color:var(--green);margin-left:auto;align-self:center}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
.ov.on{display:flex}.ov img{max-width:92vw;max-height:90vh;border-radius:10px}
#printArea{display:none}
@media print{body>*{display:none!important}#printArea{display:block!important}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

function ruText(o){let t='Новый заказ — RAM IMPEX\n\nЗаказчик: '+(o.cust_name||'—')+'\nТелефон: '+(o.cust_phone||'—')+'\nE-mail: '+(o.cust_email||'—')+'\n\nПродукция:\n';(o.items||[]).forEach((it,i)=>{const name=it.name?(NAME_RU[it.name]||it.name):ruCode(it.code);const ex=[];if(it.qty)ex.push('Кол-во: '+tr(it.qty));if(it.brand)ex.push('Брендирование: да');if(it.note)ex.push('Прим.: '+tr(it.note));t+=(i+1)+'. '+name+' ('+tr(it.size||'')+(it.type?' '+it.type:'')+', '+catRu(it.cat)+')'+(ex.length?' — '+ex.join(', '):'')+'\n';});if(o.req_title||o.req_desc)t+='\nИндивидуальный запрос: '+tr(o.req_title||'')+' '+tr(o.req_desc||'');return t;}
function orderCard(o){const isNew=o.status==='new';
 const items=(o.items||[]).map((it,i)=>{const name=it.name?(NAME_RU[it.name]||it.name):ruCode(it.code);const ex=[];if(it.qty)ex.push('Кол-во: '+tr(it.qty));if(it.brand)ex.push('Брендир.: да');if(it.note)ex.push(tr(it.note));return '<tr><td>'+(i+1)+'</td><td><b>'+esc(ruCode(it.code))+'</b></td><td>'+esc(name)+'</td><td>'+esc(tr(it.size||''))+(it.type?' '+esc(it.type):'')+'</td><td>'+esc(catRu(it.cat))+'</td><td>'+esc(ex.join(' · '))+'</td></tr>';}).join('');

function renderOrders(){
 const all=window.__orders||[];
 const data=ORD_DIR==='all'?all:all.filter(o=>(o.direction||'')===ORD_DIR);
 const tabs='<div class="dirtabs">'+ORD_TABS.map(([k,lab])=>{const n=k==='all'?all.length:all.filter(o=>(o.direction||'')===k).length;return '<button class="dirbtn'+(k===ORD_DIR?' on':'')+'" data-od="'+k+'">'+esc(lab)+' · '+n+'</button>';}).join('')+'</div>';

}
async function loadOrders(){app.innerHTML='<div class="empty">იტვირთება…</div>';const {data,error}=await sb.from('orders').select('*').order('created_at',{ascending:false});if(error){app.innerHTML='<div class="card"><p style="color:#c62828">'+esc(error.message)+'</p></div>';return;}window.__orders=data||[];renderOrders();}
function printOrder(o){const items=(o.items||[]).map((it,i)=>{const name=it.name?(NAME_RU[it.name]||it.name):ruCode(it.code);const ex=[];if(it.qty)ex.push('Кол-во: '+tr(it.qty));if(it.brand)ex.push('Брендир.: да');if(it.note)ex.push(tr(it.note));return '<tr><td style="border:1px solid #ccc;padding:5px 8px">'+(i+1)+'</td><td style="border:1px solid #ccc;padding:5px 8px"><b>'+esc(ruCode(it.code))+'</b></td><td style="border:1px solid #ccc;padding:5px 8px">'+esc(name)+'</td><td style="border:1px solid #ccc;padding:5px 8px">'+esc(tr(it.size||''))+(it.type?' '+esc(it.type):'')+'</td><td style="border:1px solid #ccc;padding:5px 8px">'+esc(catRu(it.cat))+'</td><td style="border:1px solid #ccc;padding:5px 8px">'+esc(ex.join(' · '))+'</td></tr>';}).join('');const imgs=(o.images||[]).map(u=>'<img src="'+u+'" style="width:150px;height:150px;object-fit:contain;border:1px solid #ccc;margin:4px">').join('');$('printArea').innerHTML='<div style="font-family:Arial;padding:24px;color:#111"><div style="border-bottom:3px solid #0B6B3C;padding-bottom:8px;margin-bottom:12px"><span style="font-size:24px;font-weight:800;color:#0B6B3C">RAM IMPEX</span> &nbsp; Заказ</div><p><b>Заказчик:</b> '+esc(o.cust_name||'—')+' &nbsp; 📞 '+esc(o.cust_phone||'—')+' &nbsp; ✉ '+esc(o.cust_email||'—')+'</p><p><b>Направление:</b> '+esc(DIR_RU[o.direction]||'')+' &nbsp;·&nbsp; '+esc((o.created_at||'').replace('T',' ').slice(0,16))+'</p>'+(items?'<table style="border-collapse:collapse;width:100%;font-size:13px;margin-top:8px"><thead><tr><th style="border:1px solid #ccc;padding:5px 8px;background:#eef7f1">#</th><th style="border:1px solid #ccc;padding:5px 8px;background:#eef7f1">Код</th><th style="border:1px solid #ccc;padding:5px 8px;background:#eef7f1">Наимен.</th><th style="border:1px solid #ccc;padding:5px 8px;background:#eef7f1">Размер</th><th style="border:1px solid #ccc;padding:5px 8px;background:#eef7f1">Категория</th><th style="border:1px solid #ccc;padding:5px 8px;background:#eef7f1">Доп.</th></tr></thead><tbody>'+items+'</tbody></table>':'')+(o.req_title||o.req_desc?'<p style="margin-top:10px"><b>Индивидуальный запрос:</b> '+esc(tr(o.req_title||''))+' '+esc(tr(o.req_desc||''))+'</p>':'')+(imgs?'<div style="margin-top:10px">'+imgs+'</div>':'')+'<p style="margin-top:16px;border-top:2px solid #0F8A4D;padding-top:8px;font-size:12px;color:#555">RAM IMPEX · 595 533 500 · ramimpexltd@gmail.com</p></div>';window.print();}

/* ========================= FINANCE CATALOG (by direction) ========================= */
let DIRS=null, curGid=null, saveTimer=null;
const PLABEL={usdRub:'1 USD = ₽',usdGel:'USD → ₾',transpUsd:'ტრანსპ. სულ ($)',container:'კონტეინერი (ცალი)',setkaRub:'სეტკა (₽)',vat:'დღგ',profit:'მოგება',step:'დამრგვ. ბიჯი'};
const PORDER=['usdRub','usdGel','transpUsd','container','setkaRub','vat','profit','step'];
function calcRow(d,it){
  const p=d.params;let box,setka,transp;
  if(it.setkaOnly){box=0;setka=(+it.rub||0)/p.usdRub;transp=0;}
  else{box=(+it.rub||0)/p.usdRub;setka=d.hasSetka?(p.setkaRub/p.usdRub):0;transp=p.transpUsd/p.container;}
  const sub=box+setka+transp,vat=sub*p.vat,profit=(sub+vat)*p.profit,totUsd=sub+vat+profit,totGel=totUsd*p.usdGel;
  const price=Math.ceil(totGel/p.step-1e-9)*p.step;
  return {box,setka,transp,vat,profit,totUsd,totGel,price:Math.round(price*100)/100};
}
function effective(d,it){if(it.pfinal!=null&&it.pfinal!==''&&!isNaN(+it.pfinal))return Math.round((+it.pfinal)*100)/100;return calcRow(d,it).price;}
function directions(){const o=[];DIRS.forEach(g=>{if(o.indexOf(g.dir)<0)o.push(g.dir);});return o;}
function curGroup(){return DIRS.find(x=>x.id===curGid)||DIRS[0];}
function flagSaving(t){const f=$('saveflag');if(f)f.textContent=t;}
function saveDirs(){
  flagSaving('💾 ინახება…');
  if(saveTimer)clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{const {error}=await sb.from('catalog').upsert({id:'main',dirs:DIRS,updated_at:new Date().toISOString()},{onConflict:'id'});if(error)throw error;flagSaving('✔ შენახულია');setTimeout(()=>flagSaving(''),1500);}
    catch(e){flagSaving('⚠ ვერ შეინახა');alert('ვერ შეინახა: '+(e.message||e));}
  },600);
}
async function loadCatalog(){
  catEl.dataset.ready='1';
  catEl.innerHTML='<div class="empty">იტვირთება…</div>';
  try{
    const {data,error}=await sb.from('catalog').select('dirs').eq('id','main').maybeSingle();
    if(error)throw error;
    if(data&&data.dirs){DIRS=data.dirs;}
    else{DIRS=JSON.parse(JSON.stringify(SEED));await sb.from('catalog').upsert({id:'main',dirs:DIRS,updated_at:new Date().toISOString()},{onConflict:'id'});}
  }catch(e){catEl.innerHTML='<div class="card"><p style="color:#c62828">ვერ ჩაიტვირთა: '+esc(e.message||e)+'</p><p class="muted" style="font-size:12px;margin-top:6px">გაუშვი RamImpex_catalog_table.sql Supabase-ში.</p></div>';return;}
  curGid=DIRS[0].id;
  renderCat();
}
function renderCat(){
  const g=curGroup(),curdir=g.dir;
  const dirTabs='<div class="dirtabs" id="dirTabs"></div>';
  const subTabs='<div class="subtabs" id="subTabs"></div>';
  catEl.innerHTML=dirTabs+subTabs+'<div id="catBody"></div>';
  // direction tabs
  const dt=$('dirTabs');
  directions().forEach(dn=>{let cnt=0;DIRS.forEach(x=>{if(x.dir===dn)cnt+=x.items.length;});
    const b=document.createElement('button');b.className='dirbtn'+(dn===curdir?' on':'');b.textContent=dn+' · '+cnt;
    b.onclick=()=>{const first=DIRS.find(x=>x.dir===dn);if(first)curGid=first.id;renderCat();};dt.appendChild(b);});
  // sub tabs
  const groupsInDir=DIRS.filter(x=>x.dir===curdir);
  const st=$('subTabs');st.style.display=groupsInDir.length>1?'flex':'none';
  if(groupsInDir.length>1)groupsInDir.forEach(x=>{const b=document.createElement('button');b.className='subtab'+(x.id===curGid?' on':'');b.innerHTML=esc(x.name)+' · '+x.items.length;b.onclick=()=>{curGid=x.id;renderCat();};st.appendChild(b);});
  const d=g,body=$('catBody');let h='';
  // params
  h+='<div class="card parambox"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h2 style="font-size:15px;color:var(--green-d)">⚙️ პარამეტრები — '+esc(d.name)+'</h2><span class="saveflag" id="saveflag"></span></div><div class="prow" style="margin-top:8px">';
  PORDER.forEach(k=>{if(d.params[k]==null)return;const step=(k==='vat'||k==='profit'||k==='step'||k==='usdGel')?'0.01':'1';
    h+='<div class="f"><label>'+PLABEL[k]+'</label><input type="number" step="'+step+'" value="'+d.params[k]+'" data-pk="'+k+'"></div>';});
  h+='</div><div class="muted" style="margin-top:8px;font-size:12px">ტრანსპ. 1 ცალზე: <b>'+(d.params.transpUsd/d.params.container).toFixed(4)+' $</b> · ლოგიკა: RUB÷'+d.params.usdRub+(d.hasSetka?' + სეტკა(₽÷'+d.params.usdRub+')':'')+' + ტრანსპ → +დღგ → +მოგება → ×'+d.params.usdGel+' → მრგვალდება '+d.params.step+'-ზე</div></div>';
  if(d.note)h+='<div class="card" style="background:#FFF7D6;border-color:#E6C200;font-size:12px;color:#5a4b00;padding:10px 14px">📋 <b>შენიშვნა:</b> '+esc(d.note)+'</div>';
  // table
  h+='<div class="card"><div class="row" style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap"><button class="btn line sm" data-add>+ პროდუქტის დამატება</button><span class="muted" style="align-self:center;font-size:11.5px">🔵 დოლარი · 🟢 საბოლოო ფასი ₾ (ავტო) · 🟡 ხელით შესწორება</span></div>';
  h+='<div class="scroll"><table id="catTbl"><thead><tr><th>№</th><th>კოდი</th><th>დასახელება</th><th>ზომა</th><th>მარკა</th><th>ფერი</th><th class="right">RUB</th><th class="right" title="რამდენი ეტევა კონტეინერში">კონტ. ცალი</th><th class="right usdcol">ყუთი $</th>'+(d.hasSetka?'<th class="right usdcol">სეტკა $</th>':'')+'<th class="right usdcol">ტრანსპ $</th><th class="right usdcol">დღგ $</th><th class="right usdcol">მოგება $</th><th class="right usdcol">ჯამი $</th><th class="right">ჯამი ₾</th><th class="right finalcol">ფასი ₾ (ავტო)</th><th class="right">ფასი ₾ (ხელით)</th><th></th></tr></thead><tbody>';
  d.items.forEach((it,idx)=>{const c=calcRow(d,it);
    h+='<tr><td>'+(idx+1)+'</td><td><input value="'+esc(it.code)+'" style="width:66px" data-f="code" data-i="'+idx+'"></td>'+
      '<td><input value="'+esc(it.name||'')+'" style="min-width:150px" data-f="name" data-i="'+idx+'">'+(it.pack?'<div class="muted" style="font-size:9.5px;margin-top:2px">📦 '+esc(it.pack)+'</div>':'')+'</td>'+
      '<td><input value="'+esc(it.size||'')+'" style="width:96px" data-f="size" data-i="'+idx+'"></td>'+
      '<td><input value="'+esc(it.mark||'')+'" style="width:66px" data-f="mark" data-i="'+idx+'"></td>'+
      '<td><input value="'+esc(it.color||'')+'" style="width:62px" data-f="color" data-i="'+idx+'"></td>'+
      '<td class="right"><input type="number" step="0.01" value="'+(it.rub!=null?it.rub:'')+'" style="width:72px" data-f="rub" data-i="'+idx+'"></td>'+
      '<td class="right"><input type="number" step="1" placeholder="ცალი" value="'+(it.cap!=null&&it.cap!==''?it.cap:'')+'" style="width:72px" data-f="cap" data-i="'+idx+'"></td>'+
      '<td class="right usdcol">'+c.box.toFixed(4)+'</td>'+(d.hasSetka?'<td class="right usdcol">'+c.setka.toFixed(4)+'</td>':'')+
      '<td class="right usdcol">'+c.transp.toFixed(4)+'</td><td class="right usdcol">'+c.vat.toFixed(4)+'</td><td class="right usdcol">'+c.profit.toFixed(4)+'</td><td class="right usdcol">'+c.totUsd.toFixed(4)+'</td>'+
      '<td class="right">'+c.totGel.toFixed(4)+'</td><td class="right finalcol">'+money(c.price)+'</td>'+
      '<td class="right"><input type="number" step="0.01" placeholder="'+money(c.price)+'" value="'+(it.pfinal!=null&&it.pfinal!==''?it.pfinal:'')+'" style="width:82px" data-f="pfinal" data-i="'+idx+'"></td>'+
      '<td class="right"><button class="btn danger sm" data-del="'+idx+'">✕</button></td></tr>';});
  h+='</tbody></table></div></div>';
  body.innerHTML=h;
  body.querySelectorAll('input[data-pk]').forEach(inp=>inp.onchange=()=>{d.params[inp.dataset.pk]=parseFloat(inp.value)||0;saveDirs();renderCat();});
  body.querySelectorAll('input[data-f]').forEach(inp=>inp.onchange=()=>{const it=d.items[+inp.dataset.i];const f=inp.dataset.f;
    if(f==='rub'){it[f]=inp.value===''?0:(parseFloat(inp.value)||0);}
    else if(f==='pfinal'||f==='cap'){it[f]=inp.value===''?'':(parseFloat(inp.value)||0);}
    else if(f==='code'){let v=inp.value.trim();it.code=v;} // stored as typed (Cyrillic ok)
    else{it[f]=inp.value;}
    saveDirs();renderCat();});
  body.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(!confirm('წავშალო?'))return;d.items.splice(+b.dataset.del,1);saveDirs();renderCat();});
  const add=body.querySelector('[data-add]');if(add)add.onclick=()=>{const pre=(d.tag||'X').toUpperCase();let n=1;const has=c=>d.items.some(x=>x.code===c);while(has(pre+(n<10?'0':'')+n))n++;d.items.push({code:pre+(n<10?'0':'')+n,name:'ახალი პროდუქტი',size:'',rub:0});saveDirs();renderCat();};
}
loginView();
(async()=>{try{const {data}=await sb.auth.getSession();if(data&&data.session)onLogin();}catch(e){console.error(e);}})();
</script>
