<!doctype html><html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAM IMPEX — ადმინი</title>
<style>
:root{--green-d:#0B6B3C;--green:#0F8A4D;--bg:#f4f7f5;--card:#fff;--line:#dce7e0;--ink:#14261C;--muted:#5C6B62}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,'Noto Sans Georgian',sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
.top{background:linear-gradient(120deg,var(--green-d),var(--green));color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;flex-wrap:wrap;gap:8px}
.top .lg{font-size:20px;font-weight:800}.top .su{font-size:12px;opacity:.9}
.tabbar{display:flex;gap:8px}
.tb{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:20px;padding:7px 16px;font:inherit;font-weight:700;cursor:pointer}
.tb.on{background:#fff;color:var(--green-d)}
.wrap{max-width:960px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px;font-weight:600}
input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font:inherit}
.btn{background:var(--green-d);color:#fff;border:none;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}
.btn.sm{padding:6px 11px;font-size:12px}.btn.line{background:#fff;color:var(--green-d);border:1.5px solid var(--green-d)}
.muted{color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:40px}
/* orders */
.ord{border:1px solid var(--line);border-left:4px solid var(--green-d);border-radius:12px;padding:14px;margin-bottom:12px}
.ord.new{border-left-color:#E6A200;background:#fffdf5}
.ord .h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.ord .who{font-weight:800;font-size:15px}.ord .meta{font-size:12px;color:var(--muted)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-block;background:#E3F1E8;color:var(--green-d);border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700}
.pill.new{background:#FFF0CC;color:#8a6a00}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid #eef4f0;vertical-align:top}
th{background:#f2f9f5;color:var(--green-d)}
.imgs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.imgs img{width:90px;height:90px;object-fit:cover;border:1px solid var(--line);border-radius:8px;cursor:zoom-in}
/* catalog */
.crow{display:flex;align-items:center;gap:12px;padding:9px 8px;border-bottom:1px solid #eef4f0}
.crow img{width:54px;height:54px;object-fit:contain;background:#fafdfb;border:1px solid var(--line);border-radius:8px;cursor:zoom-in;flex:0 0 auto}
.crow .info{flex:1;min-width:0}
.crow .cd{font-weight:800}.crow .mt{font-size:11px;color:var(--muted)}
.crow .pr{flex:0 0 130px;display:flex;align-items:center;gap:4px}
.crow .pr input{width:88px;text-align:right;padding:7px 8px}
.saved{color:var(--green);font-size:11px;min-width:14px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
.ov.on{display:flex}.ov img{max-width:92vw;max-height:90vh;border-radius:10px}
#printArea{display:none}
@media print{body>*{display:none!important}#printArea{display:block!important}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head>

const DIR_RU={boxes:'Картонные ящики',edge:'Уголковые защиты',anth:'Антрацитовый брикет',contact:'Сообщение с сайта','':'—'};
const CAT_RU={'შესაფუთი საკონდიტრო ნაწარმისთვის':'Упаковка для кондитерских изделий','შესაფუთი ბოსტნეულისა და ხილისთვის':'Упаковка для овощей и фруктов','შესაფუთი გაყინული ხორცპროდუქტისთვის':'Упаковка для замороженной продукции','შესაფუთი რძის ნაწარმისთვის':'Упаковка для молочной продукции','შესაფუთი სასმელებისა და ალკოჰოლური პროდუქციისთვის':'Упаковка для напитков и алкоголя','შესაფუთი მინის ტარისთვის':'Упаковка для стеклотары','სხვადასხვა შესაფუთი კონსტრუქცია':'Прочие упаковочные конструкции','კუთხოვანი დამცავები':'Уголковые защиты','ანთრაციტის ბრიკეტი':'Антрацитовый брикет'};
const NAME_RU={'ანთრაციტის ქვანახშირის ბრიკეტი':'Антрацитовый угольный брикет','მუყაოს კუთხოვანი 35×35×4 მმ':'Картонный уголок 35×35×4 мм','მუყაოს კუთხოვანი 40×50×5 მმ':'Картонный уголок 40×50×5 мм'};
const GW={'მმ':'мм','სმ':'см','ტონა':'тонна','ტონობით':'тоннами','ცალი':'шт','დიახ':'да','კი':'да','არა':'нет','თეთრი':'белый','კრაფტი':'крафт','ლოგო':'логотип','ლოგოთი':'с логотипом','ბრენდირება':'брендирование','ყუთი':'ящик','ტიხარი':'перегородка','ტიხრები':'перегородки','სეტკა':'решётка','ზომა':'размер','ფერი':'цвет','რაოდენობა':'количество','დიზაინი':'дизайн','ბოთლი':'бутылка','ბოთლის':'бутылки','სპეციალური':'специальный','მაღალი':'высокий'};
const tr=s=>{if(!s)return s;let o=''+s;Object.keys(GW).sort((a,b)=>b.length-a.length).forEach(k=>o=o.split(k).join(GW[k]));return o;};
const catRu=c=>CAT_RU[c]||c;
window.zoom=src=>{$('ovImg').src=src;$('ov').classList.add('on');};
$('ov').onclick=()=>$('ov').classList.remove('on');
$('logout').onclick=async()=>{await sb.auth.signOut();location.reload();};
$('tabbar').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{
  $('tabbar').querySelectorAll('.tb').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  if(b.dataset.t==='orders'){app.style.display='';catEl.style.display='none';}
  else{app.style.display='none';catEl.style.display='';if(!catEl.dataset.ready)loadCatalog();}
});
function loginView(msg){
 $('tabbar').style.display='none';$('logout').style.display='none';catEl.style.display='none';app.style.display='';
 app.innerHTML='<div class="card" style="max-width:380px;margin:40px auto"><h2 style="color:var(--green-d);margin-bottom:6px">შესვლა</h2><p class="muted" style="font-size:12px;margin-bottom:8px">ადმინის ელ.ფოსტა/პაროლი (Supabase)</p>'+(msg?'<p style="color:#c62828;font-size:12px;margin-bottom:6px">'+esc(msg)+'</p>':'')+'<label>ელ. ფოსტა</label><input id="em" type="email"><label>პაროლი</label><input id="pw" type="password"><button class="btn" id="lg" style="width:100%;margin-top:12px">შესვლა</button></div>';
 $('lg').onclick=async()=>{$('lg').disabled=true;$('lg').textContent='...';const {error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});if(error){loginView(error.message);}else{onLogin();}};
}
function onLogin(){$('tabbar').style.display='';$('logout').style.display='';loadOrders();}
/* ===== ORDERS ===== */
function ruText(o){let t='Новый заказ — RAM IMPEX\n\nЗаказчик: '+(o.cust_name||'—')+'\nТелефон: '+(o.cust_phone||'—')+'\nE-mail: '+(o.cust_email||'—')+'\n\nПродукция:\n';(o.items||[]).forEach((it,i)=>{const name=it.name?(NAME_RU[it.name]||it.name):it.code;const ex=[];if(it.qty)ex.push('Кол-во: '+tr(it.qty));if(it.brand)ex.push('Брендирование: да');if(it.note)ex.push('Прим.: '+tr(it.note));t+=(i+1)+'. '+name+' ('+tr(it.size||'')+(it.type?' '+it.type:'')+', '+catRu(it.cat)+')'+(ex.length?' — '+ex.join(', '):'')+'\n';});if(o.req_title||o.req_desc)t+='\nИндивидуальный запрос: '+tr(o.req_title||'')+' '+tr(o.req_desc||'');return t;}
function orderCard(o){const isNew=o.status==='new';
 const items=(o.items||[]).map((it,i)=>{const name=it.name?(NAME_RU[it.name]||it.name):it.code;const ex=[];if(it.qty)ex.push('Кол-во: '+tr(it.qty));if(it.brand)ex.push('Брендир.: да');if(it.note)ex.push(tr(it.note));return '<tr><td>'+(i+1)+'</td><td><b>'+esc(name)+'</b></td><td>'+esc(tr(it.size||''))+(it.type?' '+esc(it.type):'')+'</td><td>'+esc(catRu(it.cat))+'</td><td>'+esc(ex.join(' · '))+'</td></tr>';}).join('');
 const imgs=(o.images||[]).map(u=>'<img src="'+u+'" onclick="zoom(this.src)">').join('');
 return '<div class="ord'+(isNew?' new':'')+'"><div class="h"><div><div class="who">'+esc(o.cust_name||'—')+' <span class="pill'+(isNew?' new':'')+'">'+(isNew?'ახალი':esc(o.status))+'</span> <span class="pill">'+esc(DIR_RU[o.direction]||o.direction||'')+'</span></div><div class="meta">📞 '+esc(o.cust_phone||'—')+' · ✉ '+esc(o.cust_email||'—')+' · '+esc((o.created_at||'').replace('T',' ').slice(0,16))+'</div></div><div class="acts"><button class="btn line sm" data-print="'+o.id+'">🖨 PDF</button><button class="btn line sm" data-copy="'+o.id+'">📋 RU</button>'+(isNew?'<button class="btn sm" data-seen="'+o.id+'">✔ ნანახია</button>':'')+'</div></div>'+(items?'<table><thead><tr><th>#</th><th>Код</th><th>Размер</th><th>Категория</th><th>Доп.</th></tr></thead><tbody>'+items+'</tbody></table>':'')+(o.req_title||o.req_desc?'<div style="margin-top:8px;font-size:13px"><b>Индив. запрос:</b> '+esc(tr(o.req_title||''))+' '+esc(tr(o.req_desc||''))+'</div>':'')+(imgs?'<div class="imgs">'+imgs+'</div>':'')+'</div>';}
async function loadOrders(){app.innerHTML='<div class="empty">იტვირთება…</div>';const {data,error}=await sb.from('orders').select('*').order('created_at',{ascending:false});if(error){app.innerHTML='<div class="card"><p style="color:#c62828">'+esc(error.message)+'</p></div>';return;}if(!data||!data.length){app.innerHTML='<div class="empty">ჯერ შეკვეთა არ არის.</div>';return;}const nNew=data.filter(o=>o.status==='new').length;window.__orders=data;app.innerHTML='<div class="card" style="display:flex;justify-content:space-between;align-items:center"><b>სულ '+data.length+' შეკვეთა'+(nNew?' · '+nNew+' ახალი':'')+'</b><button class="btn line sm" id="refresh">↻</button></div>'+data.map(orderCard).join('');$('refresh').onclick=loadOrders;
 app.querySelectorAll('[data-seen]').forEach(b=>b.onclick=async()=>{b.disabled=true;await sb.from('orders').update({status:'seen'}).eq('id',b.dataset.seen);loadOrders();});
 app.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{const o=window.__orders.find(x=>x.id===b.dataset.copy);try{await navigator.clipboard.writeText(ruText(o));b.textContent='✔';setTimeout(()=>b.textContent='📋 RU',1200);}catch(e){alert(ruText(o));}});
 app.querySelectorAll('[data-print]').forEach(b=>b.onclick=()=>{const o=window.__orders.find(x=>x.id===b.dataset.print);if(o)printOrder(o);});}
function printOrder(o){const items=(o.items||[]).map((it,i)=>{const name=it.name?(NAME_RU[it.name]||it.name):it.code;const ex=[];if(it.qty)ex.push('Кол-во: '+tr(it.qty));if(it.brand)ex.push('Брендир.: да');if(it.note)ex.push(tr(it.note));return '<tr><td style="border:1px solid #ccc;padding:5px 8px">'+(i+1)+'</td><td style="border:1px solid #ccc;padding:5px 8px"><b>'+esc(name)+'</b></td><td style="border:1px solid #ccc;padding:5px 8px">'+esc(tr(it.size||''))+(it.type?' '+esc(it.type):'')+'</td><td style="border:1px solid #ccc;padding:5px 8px">'+esc(catRu(it.cat))+'</td><td style="border:1px solid #ccc;padding:5px 8px">'+esc(ex.join(' · '))+'</td></tr>';}).join('');const imgs=(o.images||[]).map(u=>'<img src="'+u+'" style="width:150px;height:150px;object-fit:contain;border:1px solid #ccc;margin:4px">').join('');$('printArea').innerHTML='<div style="font-family:Arial;padding:24px;color:#111"><div style="border-bottom:3px solid #0B6B3C;padding-bottom:8px;margin-bottom:12px"><span style="font-size:24px;font-weight:800;color:#0B6B3C">RAM IMPEX</span> &nbsp; Заказ</div><p><b>Заказчик:</b> '+esc(o.cust_name||'—')+' &nbsp; 📞 '+esc(o.cust_phone||'—')+' &nbsp; ✉ '+esc(o.cust_email||'—')+'</p><p><b>Направление:</b> '+esc(DIR_RU[o.direction]||'')+' &nbsp;·&nbsp; '+esc((o.created_at||'').replace('T',' ').slice(0,16))+'</p>'+(items?'<table style="border-collapse:collapse;width:100%;font-size:13px;margin-top:8px"><thead><tr><th style="border:1px solid #ccc;padding:5px 8px;background:#eef7f1">#</th><th style="border:1px solid #ccc;padding:5px 8px;background:#eef7f1">Код</th><th style="border:1px solid #ccc;padding:5px 8px;background:#eef7f1">Размер</th><th style="border:1px solid #ccc;padding:5px 8px;background:#eef7f1">Категория</th><th style="border:1px solid #ccc;padding:5px 8px;background:#eef7f1">Доп.</th></tr></thead><tbody>'+items+'</tbody></table>':'')+(o.req_title||o.req_desc?'<p style="margin-top:10px"><b>Индивидуальный запрос:</b> '+esc(tr(o.req_title||''))+' '+esc(tr(o.req_desc||''))+'</p>':'')+(imgs?'<div style="margin-top:10px">'+imgs+'</div>':'')+'<p style="margin-top:16px;border-top:2px solid #0F8A4D;padding-top:8px;font-size:12px;color:#555">RAM IMPEX · 595 533 500 · ramimpexltd@gmail.com</p></div>';window.print();}
/* ===== CATALOG ===== */
let PRICES={};
async function loadCatalog(){
 catEl.dataset.ready='1';
 catEl.innerHTML='<div class="empty">იტვირთება…</div>';
 try{const {data}=await sb.from('prices').select('code,price');(data||[]).forEach(r=>PRICES[r.code]=r.price);}catch(e){}
 catEl.innerHTML='<div class="card"><input id="cq" placeholder="🔍 ძებნა კოდით (მაგ. PL-0651) ან ზომით..."><div class="muted" id="ccount" style="margin-top:6px"></div></div><div class="card" style="padding:6px 10px"><div id="clist"></div></div>';
 $('cq').oninput=renderCatalog; renderCatalog();
}
function renderCatalog(){
 const q=($('cq').value||'').toLowerCase().trim();
 let items=q?CATALOG.filter(x=>(x.code+' '+x.size+' '+x.cat).toLowerCase().indexOf(q)>=0):CATALOG;
 $('ccount').textContent=items.length+' პროდუქტი'+(items.length>300?' — მოძებნე კოდით რომ დაიწუროს':'');
 const show=items.slice(0,400);
 $('clist').innerHTML=show.map(x=>'<div class="crow">'+(x.img?'<img src="'+esc(x.img)+'" onclick="zoom(\''+esc(x.dia||x.img)+'\')" onerror="this.style.visibility=\'hidden\'">':'<div style="width:54px"></div>')+'<div class="info"><div class="cd">'+esc(x.code)+'</div><div class="mt">'+esc(x.size)+(x.type?' · '+esc(x.type):'')+' · '+esc(x.cat)+'</div></div><div class="pr"><input type="number" step="0.01" placeholder="ფასი ₾" value="'+(PRICES[x.code]!=null?PRICES[x.code]:'')+'" data-code="'+esc(x.code)+'"><span class="saved" data-s="'+esc(x.code)+'"></span></div></div>').join('')||'<div class="empty">ვერ მოიძებნა</div>';
 if(items.length>400)$('clist').innerHTML+='<div class="muted" style="padding:10px;text-align:center">ნაჩვენებია პირველი 400 — დააზუსტე ძებნა</div>';
 $('clist').querySelectorAll('input[data-code]').forEach(inp=>{inp.onchange=async()=>{const code=inp.dataset.code;const v=inp.value===''?null:parseFloat(inp.value);const tag=catEl.querySelector('[data-s="'+CSS.escape(code)+'"]');try{const {error}=await sb.from('prices').upsert({code:code,price:v,updated_at:new Date().toISOString()},{onConflict:'code'});if(error)throw error;PRICES[code]=v;if(tag){tag.textContent='✔';setTimeout(()=>tag.textContent='',1200);}}catch(e){if(tag)tag.textContent='!';alert('ვერ შეინახა: '+(e.message||e));}};});
}
loginView();
(async()=>{try{const {data}=await sb.auth.getSession();if(data&&data.session)onLogin();}catch(e){console.error(e);}})();
</script>
</body></html>
