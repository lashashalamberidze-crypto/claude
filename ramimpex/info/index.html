<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">

<title>ანთრაციტის ბრიკეტი — RAM IMPEX</title>
<meta name="description" content="ანთრაციტის ბრიკეტი — მაღალკალორიული, უკვამლო საწვავი. RAM IMPEX, ნატახტარი.">
<style>
:root{--g:#0B6B3C;--g2:#0F8A4D;--o:#c9701a;--ink:#26201a;--mut:#6b5f52;--bg:#fbf7f0;--card:#fff;--line:#e7dcc9}
*{margin:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans Georgian','Segoe UI',system-ui,-apple-system,'Noto Sans Armenian',sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
img{max-width:100%;display:block}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}
/* header + lang switch */
.top{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.05)}
.top .in{max-width:820px;margin:0 auto;padding:8px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top img{width:40px;height:40px}
.top .bn{font-weight:900;color:var(--g);font-size:18px;line-height:1}
.langs{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.langs button{font:inherit;font-weight:800;font-size:13px;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer;display:flex;align-items:center;gap:5px;transition:.15s}
.langs button .fl{font-size:15px}
.langs button.on{background:var(--g);color:#fff;border-color:var(--g)}
.langs button:hover{border-color:var(--g)}
/* hero */
.hero{background:linear-gradient(160deg,#1c1206,#3a2410);color:#fff;padding:26px 0 22px;margin-bottom:18px}
.hero h1{font-size:34px;font-weight:900;line-height:1.05}
.hero .sub{color:#ffb347;font-weight:800;font-size:17px;margin-top:8px}
.hero .foto{margin-top:16px;border-radius:14px;overflow:hidden;border:3px solid rgba(201,112,26,.5)}
.hero .foto img{width:100%;height:230px;object-fit:cover}
.dl{display:inline-flex;align-items:center;gap:9px;background:var(--o);color:#fff;font-weight:800;font-size:16px;text-decoration:none;border-radius:12px;padding:13px 22px;margin-top:16px;box-shadow:0 6px 16px rgba(201,112,26,.4)}
.dl:active{transform:translateY(1px)}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}
.ch{background:rgba(255,255,255,.08);border:1.5px solid rgba(201,112,26,.4);border-radius:12px;padding:11px 6px;text-align:center}
.ch .v{color:#ffb347;font-weight:900;font-size:21px;line-height:1}
.ch .l{color:#e9d9c2;font-weight:700;font-size:12px;margin-top:5px}
/* sections */
section{margin:24px 0}
h2{color:var(--g);font-weight:900;font-size:23px;margin-bottom:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bx{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:15px 17px}
.bx .t{font-weight:900;font-size:17px;color:#3a2410;margin-bottom:6px}
.bx .d{font-weight:600;font-size:15px;color:var(--mut);line-height:1.45}
.bx .d b{color:var(--g)}
.steps{display:grid;grid-template-columns:1fr;gap:11px}
.st{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;gap:13px;align-items:flex-start}
.st .n{flex:0 0 auto;background:var(--o);color:#fff;font-weight:900;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px}
.st .t{font-weight:900;font-size:16px;color:#3a2410}
.st .d{font-weight:600;font-size:14.5px;color:var(--mut);margin-top:3px;line-height:1.4}
.note{background:#eef7f1;border:1.5px solid #bfe3ce;border-radius:12px;padding:12px 16px;font-weight:700;font-size:15px;color:var(--g);margin-top:11px}
.why{background:linear-gradient(90deg,#fff7ea,#fdefd6);border:2px solid #f0c46a;border-radius:16px;padding:16px 20px;display:grid;grid-template-columns:1fr 1fr;gap:11px 20px}
.wi{font-size:15px;color:#3a2f22;font-weight:600;line-height:1.35}.wi b{color:var(--g)}
.uses{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ui{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:800;font-size:14.5px;color:#3a2410;display:flex;align-items:center;gap:10px}
.ui .e{font-size:22px}
table{width:100%;border-collapse:collapse;font-size:15px;background:#fff;border-radius:12px;overflow:hidden;border:1.5px solid var(--line)}
th,td{padding:11px 15px;text-align:left;border-bottom:1px solid var(--line)}
th{background:var(--g);color:#fff;font-weight:800}
td.v{text-align:right;font-weight:900;color:var(--g);white-space:nowrap}
tr:last-child td{border-bottom:none}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{background:#eaf6ef;border:1.5px solid #bfe3ce;border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;color:var(--g)}
.pill.o{background:#fff4d6;border-color:#e6a700;color:#8a6a00}
.recbox{background:#FFF7E4;border:2px solid #E6A700;border-radius:16px;padding:4px 20px}
.ri{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px dashed #edcf94}
.ri:last-child{border-bottom:none}
.ri .e{font-size:28px;flex:0 0 auto;line-height:1.1}
.ri div{font-weight:600;font-size:15px;color:#5a4415;line-height:1.42}
.ri div b{color:#8a2b00}.ri div .g{color:var(--g);font-weight:900}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.pc{background:#fff;border:2px solid var(--line);border-radius:16px;padding:20px 8px 14px;text-align:center;position:relative}
.pc.best{border-color:#e6a700;background:linear-gradient(180deg,#fffdf5,#fff8e6)}
.pc .tag{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:#e6a700;color:#3a2600;font-weight:900;font-size:12px;padding:4px 12px;border-radius:999px;white-space:nowrap}
.pc .rng{font-weight:900;font-size:15px;color:#3a2410;min-height:40px;display:flex;align-items:center;justify-content:center;line-height:1.15}
.pc .prc{margin:5px 0;font-weight:900;font-size:38px;color:var(--o);line-height:1}
.pc .prc small{font-size:14px;color:#8a6a00;font-weight:800}
.pc .pk{font-weight:800;font-size:12.5px;color:var(--g);margin-top:4px}
.pinfo{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
.pib{background:#eaf6ef;border:1.5px solid #bfe3ce;border-radius:12px;padding:11px 12px;font-weight:800;font-size:13.5px;color:var(--g);text-align:center}
.cmp{display:flex;align-items:stretch;gap:10px}
.cmp .side{flex:1;border-radius:14px;padding:16px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cmp .brik{background:linear-gradient(180deg,#1c1206,#3a2410);color:#fff;border:2px solid var(--o)}
.cmp .wood{background:#f4efe6;border:2px solid var(--line)}
.cmp .em{font-size:34px;line-height:1}
.cmp .q{font-weight:900;font-size:20px;margin-top:6px;line-height:1.1}
.cmp .brik .q{color:#ffb347}.cmp .wood .q{color:#3a2410}
.cmp .s{font-size:12.5px;font-weight:700;margin-top:6px;line-height:1.3}
.cmp .brik .s{color:#e9d6bd}.cmp .wood .s{color:#7a6a52}
.cmp .eq{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 2px}
.cmp .eq b{font-size:34px;color:var(--o);font-weight:900;line-height:1}
.cmp .eq span{font-size:10.5px;color:var(--g);font-weight:800;margin-top:3px;text-align:center;line-height:1.1}
.cmpbig{background:linear-gradient(90deg,#0B6B3C,#0F8A4D);color:#fff;border-radius:14px;padding:15px;text-align:center;font-weight:900;font-size:20px;margin-top:11px}
.cmpnote{text-align:center;font-weight:700;font-size:14px;color:var(--mut);margin-top:9px}
.loc{background:#fff;border:2px solid #bfe3ce;border-radius:16px;padding:16px 18px;display:flex;align-items:center;gap:18px}
.loc .qr{width:120px;height:120px;flex:0 0 auto;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.loc .lt .h{font-weight:900;font-size:18px;color:var(--g);margin-bottom:5px}
.loc .lt .d{font-weight:700;font-size:14px;color:#3a2410;line-height:1.4}
.mapbtn{display:inline-flex;align-items:center;gap:7px;background:var(--g);color:#fff;font-weight:800;font-size:15px;text-decoration:none;border-radius:10px;padding:10px 18px;margin-top:10px}
.loc a.qr{display:block;cursor:pointer}
.foot{background:var(--g2);color:#fff;padding:22px 0;margin-top:26px}
.foot .in{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.foot a{color:#fff;text-decoration:none;font-weight:800;font-size:17px}
.foot .r{font-size:13px;color:#dff5e8;font-weight:600}
.dl2{display:inline-flex;align-items:center;gap:9px;background:#fff;color:var(--g);font-weight:800;font-size:15px;text-decoration:none;border-radius:12px;padding:11px 20px;margin-top:8px}
@media(max-width:560px){
 .two,.why,.uses,.cards,.pinfo{grid-template-columns:1fr}
 .chips{grid-template-columns:repeat(2,1fr)}
 .hero h1{font-size:27px}
 .loc{flex-direction:column;text-align:center}
}
body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
@media print{
 .top{position:static;box-shadow:none;border-bottom:2px solid var(--g)}
 .langs,.dl,.dl2{display:none!important}
 .hero{margin-bottom:10px}
 section,.bx,.st,.ui,.ri,.loc,table,tr,.why,.two,.steps{break-inside:avoid;page-break-inside:avoid}
 h2{break-after:avoid;page-break-after:avoid}
}
</style>

function pickLang(){const u=new URLSearchParams(location.search).get('lang');if(u&&T[u])return u;try{const s=localStorage.getItem('ri_lang');if(s&&T[s])return s;}catch(e){}return 'ka';}
let cur=pickLang();
document.addEventListener('click',e=>{const b=e.target.closest('[data-l]');if(!b)return;cur=b.dataset.l;try{localStorage.setItem('ri_lang',cur);}catch(e){}
