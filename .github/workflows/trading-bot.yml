# ============================================================================
# სავაჭრო ბოტი — დღეში ორჯერ ამოწმებს (GitHub ხშირად აგვიანებს, ამიტომ ბოტი ნებისმიერ დროს მუშაობს)
#
# საჭიროა 2 secret (GitHub → Settings → Secrets and variables → Actions):
#   ALPACA_API_KEY     — Alpaca Paper API Key
#   ALPACA_SECRET_KEY  — Alpaca Paper Secret Key
# არასავალდებულო (Telegram შეტყობინებები):
#   TELEGRAM_BOT_TOKEN — Telegram ბოტის token
#   TELEGRAM_CHAT_ID   — შენი Telegram chat ID
#
# შენიშვნა: GitHub-ის schedule მუშაობს მხოლოდ main ბრანჩიდან.
# ============================================================================
name: Trading bot

on:
  schedule:
    # 13:17 UTC (ნიუ-იორკში გახსნამდე — ორდერი შესრულდება გახსნისას) და 17:47 UTC (სარეზერვო).
    # სიგნალი ბოლო დასრულებული დღის ფასითაა, ამიტომ დაგვიანება საშიში არ არის;
    # ორჯერ გაშვებისას ერთსა და იმავეს ორჯერ არ ყიდულობს.
    # GitHub ზოგჯერ საათობით აგვიანებს — ბოტი ნებისმიერ დროს მუშაობს, ასე რომ პრობლემა არ არის.
    # (სურვილისამებრ ზუსტი განრიგი: sql/trading_bot_cron.sql Supabase-ში.)
    - cron: "17 13 * * *"
    - cron: "47 17 * * *"
    # შაბათს 08:07 UTC (12:07 თბილისში) — კვირის შეჯამება Telegram-ზე
    - cron: "7 8 * * 6"
  workflow_dispatch:      # Actions ტაბში ხელით გაშვების ღილაკი
    inputs:
      telegram_test:
        description: "მხოლოდ სატესტო Telegram მესიჯი (ვაჭრობის გარეშე)"
        type: boolean
        default: false
      weekly_summary:
        description: "კვირის შეჯამების გაგზავნა ახლავე"
        type: boolean
        default: false

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: trading-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python bot.py ${{ inputs.telegram_test && '--telegram-test' || '' }}
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: "true"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INITIAL_CAPITAL: ${{ vars.INITIAL_CAPITAL }}   # ცარიელი = 100000
          WEEKLY_SUMMARY: ${{ github.event.schedule == '7 8 * * 6' || inputs.weekly_summary }}
