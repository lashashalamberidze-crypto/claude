# ============================================================================
# სავაჭრო ბოტი — დღეში ერთხელ, ბირჟის დახურვამდე ~30 წთ-ით ადრე (კომპიუტერი არ სჭირდება)
#
# საჭიროა 2 secret (GitHub → Settings → Secrets and variables → Actions):
#   ALPACA_API_KEY     — Alpaca Paper API Key
#   ALPACA_SECRET_KEY  — Alpaca Paper Secret Key
#
# შენიშვნა: GitHub-ის schedule მუშაობს მხოლოდ main ბრანჩიდან.
# ============================================================================
name: Trading bot

on:
  schedule:
    # 15:30 ნიუ-იორკის დროით: ზაფხულში 19:30 UTC, ზამთარში 20:30 UTC.
    # ორივე ეშვება — ბოტი თავად ამოწმებს, დახურვამდე 45 წთ-ზე ნაკლებია თუ არა.
    - cron: "30 19,20 * * 1-5"
  workflow_dispatch:      # Actions ტაბში ხელით გაშვების ღილაკი
    inputs:
      force:
        description: "ვაჭრობა ახლავე (დახურვამდე ლოდინის გარეშე, ბირჟა ღია უნდა იყოს)"
        type: boolean
        default: false

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: trading-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python bot.py ${{ inputs.force && '--force' || '' }}
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: "true"
